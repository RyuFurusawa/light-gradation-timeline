<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>光のグラデーション・タイムライン（HDR対応）</title>
<!-- PWA：ホーム画面に追加すると、ブラウザの枠なしで起動できる -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="光タイムライン" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #stage { position: fixed; inset: 0; }
  /* HDRレンダラ用キャンバス（背景を塗る）。CSSレンダラ時は透明のまま */
  #gpu { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 0; }
  /* 非HDR表示のときの境界グラデーション（小さな画像を全面に引き伸ばす） */
  #blend2d { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 0; }
  /* UI・リングを描くp5キャンバスは透明で最前面手前に重ねる */
  .bar {
    position: absolute; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 10px; border-radius: 14px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    color: #f2f2f2; z-index: 10; user-select: none;
  }
  .bar button {
    padding: 7px 12px; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 9px; background: rgba(255,255,255,0.08); color: #f2f2f2;
    cursor: pointer; font-size: 13px; line-height: 1;
  }
  .bar button:hover { background: rgba(255,255,255,0.18); }
  .bar button.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  .bar span { font-size: 12.5px; color: #d8d8d8; }
  .bar input[type=number] {
    width: 60px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3);
    color: #fff; font-size: 13px; text-align: right;
  }
  .bar input[type=range] { width: 130px; accent-color: #f5f5f5; }
  #topBar { display: none; }   /* 方式選択はモーダルへ移行 */
  #timeBar { left: 50%; transform: translateX(-50%); }
  #colorBar { left: 50%; transform: translateX(-50%); }
  body:not(.narrowLayout) #colorBar { flex-wrap: nowrap; max-width: 96vw; }
  #viewBar { left: 50%; transform: translateX(-50%); }
  .segGroup { display: flex; border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; overflow: hidden; }
  .segGroup button { border: none !important; border-radius: 0 !important; }
  .segGroup button + button { border-left: 1px solid rgba(255,255,255,0.18) !important; }
  canvas.p5Canvas { position: relative; z-index: 1; touch-action: none; }
  @media (pointer: coarse) {
    .bar { gap: 10px; padding: 10px 12px; max-width: 94vw; }
    .bar button { padding: 12px 16px; font-size: 15px; border-radius: 11px; }
    .bar span { font-size: 14px; }
    .bar input[type=number] { width: 72px; padding: 10px; font-size: 15px; }
    .bar input[type=range] { width: 30vw; min-width: 100px; }
  }
  /* 補間方式スイッチ（サークル上部）とモーダル */
  #modeSwitch {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 13;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 22px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.26); color: #f2f2f2;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    font-size: 14px; line-height: 1; cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #modeSwitch:hover { background: rgba(255,255,255,0.18); }
  #modeSwitch .caret { font-size: 10px; opacity: 0.75; }
  body.narrowLayout #modeSwitch { font-size: 12px; padding: 8px 13px; max-width: 82vw; overflow: hidden; }

  #modeModal {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: rgba(0,0,0,0.62);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  #modeModal.open { display: flex; }
  #modeModal .sheet {
    display: flex; flex-direction: column; gap: 8px;
    padding: 22px; border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 16px 60px rgba(0,0,0,0.5);
    max-height: 86vh; overflow-y: auto; min-width: 280px;
  }
  #modeModal h3 {
    margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.55); font-weight: 600; text-align: center;
  }
  #modeModal button {
    padding: 14px 20px; border-radius: 12px; text-align: left;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.07); color: #f2f2f2;
    font-size: 15px; line-height: 1.2; cursor: pointer; white-space: nowrap;
  }
  #modeModal button:hover { background: rgba(255,255,255,0.2); }
  #modeModal button.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  #fsBtn {
    position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); z-index: 12;
    display: flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 24px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28); color: #fff;
    font-size: 15px; line-height: 1; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  #fsBtn:hover { background: rgba(255,255,255,0.2); }
  body.narrowLayout #fsBtn { padding: 9px 15px; font-size: 13px; }
  #infoBtn {
    position: fixed; top: 14px; right: 14px; z-index: 12;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(15,15,18,0.55); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28); color: #fff;
    font: italic bold 19px Georgia, "Times New Roman", serif;
    cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #infoBtn:hover { background: rgba(255,255,255,0.22); }
  #infoPanel {
    position: fixed; inset: 0; z-index: 30; display: none;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; overflow-y: auto; cursor: pointer;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  #infoPanel .inner {
    max-width: 700px; margin: 5vh auto 8vh; padding: 30px 34px 40px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 22px; box-shadow: 0 12px 60px rgba(0,0,0,0.45);
    cursor: auto;
  }
  #infoPanel h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: 0.06em; font-weight: 600; }
  #infoPanel .sub { font-size: 12px; color: rgba(255,255,255,0.55); margin: 0 0 18px; }
  #infoPanel h3 {
    font-size: 14px; margin: 24px 0 8px; color: #cfe6ff;
    letter-spacing: 0.08em; font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.14); padding-bottom: 6px;
  }
  #infoPanel ul { padding-left: 1.3em; margin: 6px 0; }
  #infoPanel li { font-size: 13.5px; line-height: 1.95; color: rgba(255,255,255,0.92); margin: 2px 0; }
  #infoPanel b { color: #fff; font-weight: 600; }
  #infoPanel .closeHint { text-align: center; font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 26px; }
  #infoPanel .wakeStatus {
    font-size: 13.5px; line-height: 1.8; margin: 8px 0; padding: 8px 12px; border-radius: 10px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
  }
  #infoPanel .wakeStatus.warn { background: rgba(255,170,60,0.16); border-color: rgba(255,190,100,0.5); }
  /* スリープを防げない環境への案内（一度だけ出る。どこかをタップで閉じる）
     他のUIと重ならないよう、方式モーダルと同じ暗転オーバーレイにする */
  #wakeNotice {
    position: fixed; inset: 0; z-index: 35; display: none;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    align-items: center; justify-content: center; cursor: pointer;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  #wakeNotice.open { display: flex; }
  #wakeNotice .card {
    max-width: min(440px, 84vw); box-sizing: border-box;
    padding: 20px 22px; border-radius: 18px;
    background: rgba(40,28,10,0.85);
    border: 1px solid rgba(255,190,100,0.55); color: #ffe9c8;
    font-size: 14px; line-height: 1.8;
    box-shadow: 0 16px 60px rgba(0,0,0,0.5);
  }
  #wakeNotice .card b { color: #fff; }
  #wakeNotice .card .closeHint { display: block; margin-top: 10px; font-size: 12px; color: rgba(255,233,200,0.6); text-align: center; }
  /* ---- 画面分割（親ページ）：タイムラインを iframe で並べる。
     枠は分割の木（hostRoot）から計算した矩形に絶対配置する（iframe は DOM 上で移動すると再読み込みされるため、入れ子にしない） ---- */
  #panes { position: fixed; inset: 0; background: #000; overflow: hidden; }
  #panes .pane { position: absolute; overflow: hidden; }
  #panes iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
  .splitBtn, .paneClose {
    position: absolute; z-index: 25; padding: 0;
    background: rgba(15,15,18,0.5); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.26); color: #fff;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; line-height: 1;
    cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  .splitBtn:hover, .paneClose:hover { background: rgba(255,255,255,0.3); }
  /* ＋は各枠の四辺の中央に貼りつくタブ。押した側に、その枠を二分して複製を置く */
  .splitBtn { font-size: 18px; font-weight: 300; opacity: 0.75; }
  .splitBtn:hover { opacity: 1; }
  .splitBtn.sL, .splitBtn.sR { top: 50%; transform: translateY(-50%); width: 22px; height: 56px; }
  .splitBtn.sT, .splitBtn.sB { left: 50%; transform: translateX(-50%); width: 56px; height: 20px; }
  .splitBtn.sL { left: 0; border-radius: 0 12px 12px 0; border-left: 0; }
  .splitBtn.sR { right: 0; border-radius: 12px 0 0 12px; border-right: 0; }
  .splitBtn.sT { top: 0; border-radius: 0 0 12px 12px; border-top: 0; }
  .splitBtn.sB { bottom: 0; border-radius: 12px 12px 0 0; border-bottom: 0; }
  .paneClose { top: 26px; left: 12px; width: 32px; height: 32px; border-radius: 50%; font-size: 17px; display: none; }
  body.multi .paneClose { display: block; }
  body.playing .splitBtn, body.playing .paneClose { display: none; }
  /* 分割の境界：ドラッグで比率を変える（ダブルクリックで半々に戻す）。つまみは境界の1/4の位置（中央は＋が使う） */
  .paneDivider { position: fixed; z-index: 24; touch-action: none; }
  .paneDivider.dv { cursor: col-resize; }
  .paneDivider.dh { cursor: row-resize; }
  .paneDivider::after {
    content: ''; position: absolute; border-radius: 2px;
    background: rgba(255,255,255,0.6); box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
  }
  .paneDivider.dv::after { left: 7px; top: 25%; width: 4px; height: 52px; transform: translateY(-50%); }
  .paneDivider.dh::after { top: 7px; left: 25%; height: 4px; width: 52px; transform: translateX(-50%); }
  .paneDivider:hover::after, .paneDivider.drag::after { background: #fff; }
  body.playing .paneDivider { display: none; }
  /* 分割中の共通バー（親）：補間方式・フルスクリーン・境界グラデーション・ヘルプを全タイムライン共通で1つずつ */
  #hostBar {
    position: fixed; top: 26px; left: 0; right: 0; margin: 0 auto; width: max-content; z-index: 26;
    display: none; align-items: center; justify-content: center; gap: 8px;
    flex-wrap: wrap; max-width: 96vw; white-space: nowrap;
  }
  body.multi #hostBar { display: flex; }
  body.playing #hostBar { display: none; }
  body.host #modeSwitch, body.host #fsBtn, body.host #infoBtn { position: static; transform: none; }
  body.host #fsBtn { padding: 9px 16px; font-size: 14px; }
  #blendBtn {
    padding: 9px 16px; border-radius: 22px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.26); color: #f2f2f2;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    font-size: 14px; line-height: 1; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #blendBtn:hover { background: rgba(255,255,255,0.18); }
  #blendBtn.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  #blendW { width: 80px; accent-color: #f5f5f5; display: none; }
  #blendBtn.active + #blendW { display: block; }
  /* ---- 子ページ側：分割中（shared）は共通バーに任せるボタンを隠す ---- */
  body.shared #modeSwitch, body.shared #fsBtn, body.shared #infoBtn { display: none !important; }
  /* ---- 子ページ側：細い枠の簡略表示（compact）。リング＋秒数＋一時停止だけを出し、残りは「⋯」で開く ---- */
  #moreBtn {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 12; display: none;
    width: 38px; height: 38px; border-radius: 50%; padding: 0;
    background: rgba(15,15,18,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28); color: #fff;
    font: 20px/1 system-ui, -apple-system, sans-serif; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #moreBtn:hover { background: rgba(255,255,255,0.22); }
  body.compact #moreBtn { display: block; }
  body.compact.moreOpen #moreBtn { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  body.play #moreBtn { display: none; }
  body.compact:not(.moreOpen) #viewBar, body.compact:not(.moreOpen) #colorBar { display: none; }
  body.compact #timeBar, body.compact #viewBar { flex-wrap: nowrap; }
  body.compact #timeBar input[type=range] { display: none; }
  body.compact .bar button, body.compact .bar span { white-space: nowrap; }
  body.compact #colorBar { max-width: calc(100vw - 16px); justify-content: center; box-sizing: border-box; }
  body.multi .paneClose { display: block; }
  body.playing .splitBtn, body.playing .paneClose { display: none; }
  /* 枠の境界のつまみ：左右にドラッグして幅の配分を変える（ダブルクリックで均等に戻す） */
  .paneDivider {
    position: fixed; top: 0; bottom: 0; width: 18px; margin-left: -9px; z-index: 24;
    cursor: col-resize; touch-action: none;
  }
  .paneDivider::after {
    content: ''; position: absolute; left: 7px; top: 50%; width: 4px; height: 52px;
    transform: translateY(-50%); border-radius: 2px;
    background: rgba(255,255,255,0.6); box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
  }
  .paneDivider:hover::after, .paneDivider.drag::after { background: #fff; height: 72px; }
  body.playing .paneDivider { display: none; }
  #errbox {
    position: absolute; left: 12px; top: 12px; z-index: 99; display: none;
    max-width: 60vw; padding: 10px 12px; border-radius: 10px;
    background: rgba(120,0,0,0.85); color: #fff;
    font: 12px/1.5 monospace; white-space: pre-wrap;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<canvas id="gpu"></canvas>
<canvas id="blend2d" width="96" height="96"></canvas>
<div id="errbox"></div>
<script>
/* =========================================================
   光のグラデーション・タイムライン（HDR対応 / 三段フォールバック）
   第一段 WebGPU + extended tone mapping … 真のHDR（白を超える光）
   第二段 Display P3 … 広色域SDR（CSS背景）
   第三段 sRGB … 通常表示
   起動時に能力検出して最良の一つを選ぶ。補間ロジックは全段共通。
   ========================================================= */

window.addEventListener('error', function (ev) {
  var b = document.getElementById('errbox');
  b.style.display = 'block';
  b.textContent = 'JSエラー: ' + ev.message + '\n' + (ev.filename || '') + ' : ' + ev.lineno;
});

// 役割：親（HOST）＝画面分割の管理だけを行う／子（PANE）＝iframe内でタイムライン1つを動かす
// 通常の起動は親で、親が最初の子を1つ作る。file:// でも動くよう、親子のやり取りは postMessage のみ
const IS_PANE = new URLSearchParams(location.search).has('pane') && window.parent !== window;
const IS_HOST = !IS_PANE;
let hostPanes = [], hostStateWaiters = {}, hostReqId = 0;
let gainSlider = null;
let reversed = false, revBtn = null;       // 回転（読み取り）方向の逆転。false＝時計回り
let sharedUI = false, moreBtn = null;      // 子：分割中は方式・フルスクリーン・ヘルプを親の共通バーに任せる
// 境界グラデーション。子：隣の現在色（線形×ゲイン）を受け取り、枠の端へ向けて混ぜる
// nb[側] ＝ その辺に接する隣の枠の並び。各要素 { a0, a1：辺の上での区間（0..1）, c：現在色 }
let blendOn = false, blendWidth = 1, nb = { L: [], R: [], T: [], B: [] };
// 4枠が集まる角：cornerOn[角] ＝ その角に4枠が集まっているか、diag[角] ＝ 対角の枠の現在色
let cornerOn = { TL: false, TR: false, BL: false, BR: false }, diag = { TL: null, TR: null, BL: null, BR: null };
let topInset = 0;                          // 子：上端に親の共通バーがあるとき、そのぶん下げる量
let hostRoot = null, hostDividers = [];    // 親：分割の木（葉＝枠、節＝左右または上下の二分割と比率）
const NO_HDR = /[?&]nohdr\b/.test(location.search);   // 検証用：HDRを使わず P3／sRGB の経路で描く
let hostBar = null, blendBtn = null;

let points = [];
let mode = 'oklabLin';       // step | hsb | rgbLight | rgbValue | oklch | oklabLin | cielch | cielabLin
let loopDur = 12;
let hdrGain = 1.6;          // HDR時の輝度倍率（SDR白=1.0を超える持ち上げ）
let t0 = 0, paused = false, pausedAt = 0;

let cx, cy, R, hitR = 24, isCoarse = false;
let dragIdx = -1, dragDelete = false, pressX = 0, pressY = 0, movedFar = false;
let lastTapT = -99999, lastTapX = 0, lastTapY = 0;
let dragPlayhead = false;
let dragXYIdx = -1, dragXY_Y = 0;   // xy図上の色点ドラッグ
let playMode = false, playHintT = 0, wasFs = false;

let renderer = null;        // {kind, draw(rgb)}
let picker, pickTarget = -1;
let lumaSnapshot = null;     // 輝度統一前の色スナップショット（元に戻す用）
let showLumaCheck = false;   // 輝度検証：中央にグレー基準面を表示
let showXY = false;          // xy色度図の表示
let xyBuf = null, xyBufKey = '';
let infoBtn = null, infoPanel = null;
let isNarrow = false;
let modeSwitch = null, modeModal = null;
let modalModeBtns = {};
const MODE_LIST = [
  ['ステップ切替', 'step'],
  ['HSB色相回転', 'hsb'],
  ['RGB中間混色（光量平均）', 'rgbLight'],
  ['RGB中間混色（画素値平均）', 'rgbValue'],
  ['OKLab 色相回転', 'oklch'],
  ['OKLab 中間混色', 'oklabLin'],
  ['CIELab 色相回転', 'cielch'],
  ['CIELab 中間混色', 'cielabLin']
];
let fsBtn = null;
let wakeLock = null;          // WakeLockSentinel（保持中のみ非null）
let wakeState = 'pending';    // pending | on | unsupported | failed
let wakeRequesting = false, wakeNotice = null, wakeNoticeShown = false;
let topBar, timeBar, colorBar, viewBar, pauseBtn, durNum, durSlider, gainNum, gainWrap, restoreBtn = null, checkBtn, xyBtn, modeBtns = {};
let lumaSegBtns = {}, lumaMode = 'none';
let modeLabels = {};

/* ---------------- p5 ---------------- */
function setup() {
  if (IS_HOST) {
    noCanvas(); noLoop();
    buildHost();
    initWakeLock();
    registerServiceWorker();
    return;
  }
  let c = createCanvas(window.innerWidth, window.innerHeight);
  c.class('p5Canvas');
  layout();
  textFont('system-ui, sans-serif');

  // 初期値：光の三原色（赤・緑・青）
  points.push({ ang: -HALF_PI,                r: 255, g: 0,   b: 0   });
  points.push({ ang: -HALF_PI + TWO_PI / 3,   r: 0,   g: 255, b: 0   });
  points.push({ ang: -HALF_PI + TWO_PI * 2/3, r: 0,   g: 0,   b: 255 });

  isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if (isCoarse) { hitR = 36; }

  picker = document.createElement('input');
  picker.type = 'color';
  picker.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none;z-index:5;';
  document.body.appendChild(picker);
  picker.addEventListener('input', function () {
    if (pickTarget >= 0 && pickTarget < points.length) {
      let c2 = hexToRgb(picker.value);
      points[pickTarget].r = c2[0]; points[pickTarget].g = c2[1]; points[pickTarget].b = c2[2];
    }
  });

  buildUI();
  initWakeLock();
  t0 = millis();
  initPaneMessaging();
  applyStateFromHash();

  // レンダラを検出・初期化（非同期）。決まるまではsRGBで暫定描画
  renderer = makeCssRenderer(false);
  refreshRenderer();

  // ディスプレイ環境の変化（HDR⇄SDRモニタ間の移動、表示モード変更）を監視して
  // レンダラとHDRスライダーの表示を動的に追従させる
  if (window.matchMedia) {
    try {
      const mq = window.matchMedia('(dynamic-range: high)');
      if (mq.addEventListener) { mq.addEventListener('change', refreshRenderer); }
      else if (mq.addListener) { mq.addListener(refreshRenderer); }
    } catch (e) { /* 監視非対応環境では初回判定のみ */ }
  }

  noLoop();
  setInterval(function () { try { redraw(); } catch (err) { showErr(err); } }, 33);
}

function showErr(err) {
  var b = document.getElementById('errbox');
  b.style.display = 'block';
  b.textContent = 'エラー: ' + (err && err.message ? err.message : String(err)) + '\n' + (err && err.stack ? err.stack.split('\n')[1] : '');
}

// 簡略表示にする条件：分割中で、枠が細いか低いとき
function isCompact() { return sharedUI && (window.innerWidth <= 820 || window.innerHeight <= 700); }
// 簡略表示の時間バーの上端。上辺の＋タブ（20px）と共通バーを避け、細い枠では左上の×の下へ逃がす
function compactTimeTop() { return topInset + 26 + (width < 320 ? 40 : 0); }
function layout() {
  cx = width / 2; cy = height / 2;
  if (isCompact()) {
    // 時間バーの下から「⋯」の上までに、針のノブ（R+26）ごと収まる最大のリングを置く
    let A = compactTimeTop() + 48 + 34, B = height - 96;
    R = Math.max(30, Math.min(width * 0.38, (B - A) / 2));
    cy = Math.max(A + R, (A + B) / 2);
  } else {
    R = min(width, height) * 0.30;
  }
  placeBars();
}

// UIをサークルの外周と画面縁の中間に、上下対称・左右中央で均等配置する
function placeBars() {
  if (playMode) { return; }
  // すべてのバーが生成済みでなければ何もしない（setup途中の呼び出しで落ちるのを防ぐ）
  if (!timeBar || !viewBar || !colorBar) { return; }
  let narrow = document.body.classList.contains('narrowLayout');

  let topGap = cy - R;
  let botGap = height - (cy + R);

  // 簡略表示：上に秒数と一時停止、サークルの下に「⋯」。開いたときだけ観察トグルと色設定を出す
  if (document.body.classList.contains('compact')) {
    timeBar.elt.style.top = compactTimeTop() + 'px'; timeBar.elt.style.bottom = 'auto';
    let my = Math.round(cy + R + 36);
    if (moreBtn) { moreBtn.style.top = my + 'px'; }
    // 開いたパネルは下端から積む（色設定の上に観察トグル）。下辺の＋タブのぶん空ける
    colorBar.elt.style.top = 'auto'; colorBar.elt.style.bottom = '26px';
    let cH2 = colorBar.elt.offsetHeight || 0, vH2 = viewBar.elt.offsetHeight || 0;
    viewBar.elt.style.top = Math.round(height - 26 - cH2 - 8 - vH2) + 'px'; viewBar.elt.style.bottom = 'auto';
    return;
  }

  // 時間制御：狭い画面ではハンバーガー／iボタンの下、広い画面では上の空きの中央
  let tEl = timeBar.elt;
  let tH = tEl.offsetHeight || 46;
  if (narrow) {
    tEl.style.top = '70px';
  } else {
    // 分割中は上端に親の共通バーがあるので、その下に置く
    tEl.style.top = Math.max(sharedUI ? topInset + 26 : 12, Math.round(topGap / 2 - tH / 2)) + 'px';
  }
  tEl.style.bottom = 'auto';

  // 補間方式スイッチ：時間バーの下端とサークル上端のちょうど中間
  if (modeSwitch) {
    let sH = modeSwitch.offsetHeight || 38;
    let tBottom = (parseFloat(tEl.style.top) || 0) + tH;   // 時間バーの下端
    let mid = (tBottom + (cy - R)) / 2;                    // サークル上端との中間
    modeSwitch.style.top = Math.round(mid - sH / 2) + 'px';
    modeSwitch.style.bottom = 'auto';
  }

  // 観察トグル：常にサークル内側・下寄り（狭い画面ではやや上＝弦の幅を確保）
  let vEl = viewBar.elt;
  let vH = vEl.offsetHeight || 40;
  let vy = narrow ? cy + R * 0.74 : cy + R * 0.84;
  vEl.style.top = Math.round(vy - vH / 2) + 'px';
  vEl.style.bottom = 'auto';

  // 色設定とフルスクリーン
  let cEl = colorBar.elt;
  let cH = cEl.offsetHeight || 50;
  if (narrow) {
    cEl.style.top = 'auto';
    cEl.style.bottom = '26px';   // 下辺の＋タブのぶん空ける
    if (fsBtn) {
      let fH = fsBtn.offsetHeight || 40;
      let mid = (cy + R + (height - cH - 26)) / 2;   // サークル下端と色設定の中間
      fsBtn.style.top = Math.round(mid - fH / 2) + 'px';
      fsBtn.style.bottom = 'auto';
    }
  } else {
    if (fsBtn) {
      let fH = fsBtn.offsetHeight || 42;
      fsBtn.style.top = Math.round(cy + R + botGap / 3 - fH / 2) + 'px';
      fsBtn.style.bottom = 'auto';
    }
    cEl.style.top = Math.round(cy + R + (botGap * 2) / 3 - cH / 2) + 'px';
    cEl.style.bottom = 'auto';
  }
}

function windowResized() { if (IS_HOST) { return; } resizeCanvas(window.innerWidth, window.innerHeight); layout(); resizeGpu(); applyResponsive(); }

function resizeGpu() {
  let g = document.getElementById('gpu');
  if (renderer && renderer.kind === 'HDR') {
    let dpr = window.devicePixelRatio || 1;
    g.width = Math.floor(window.innerWidth * dpr);
    g.height = Math.floor(window.innerHeight * dpr);
  }
}

function getPhase() {
  let now = paused ? pausedAt : millis();
  let p = ((now - t0) / 1000) / loopDur;
  if (reversed) { p = -p; }
  return p - Math.floor(p);
}
// 位相（0..1、円周上の位置）を直接指定する。回転方向によらず同じ位置になる
function setPhase(ph) {
  let now = paused ? pausedAt : millis();
  t0 = now - (reversed ? (1 - ph) : ph) * loopDur * 1000;
}
// 回転方向を逆にする（針の位置はそのまま、進む向きだけ変わる）
function setReversed(v) {
  let ph = getPhase();
  reversed = !!v;
  setPhase(ph);
  if (revBtn) {
    revBtn.html(reversed ? '\u21ba' : '\u21bb');
    if (reversed) { revBtn.addClass('active'); } else { revBtn.removeClass('active'); }
  }
}

/* ---------------- ループ ---------------- */
function draw() {
  if (IS_HOST) { return; }
  let fs = !!fullscreen();
  if (fs !== wasFs) { resizeCanvas(window.innerWidth, window.innerHeight); layout(); resizeGpu(); wasFs = fs; }
  // 分割で枠の幅が変わったとき、resize イベントが遅れて届くことがあるので、描画のたびに実寸と照合する
  if (width !== window.innerWidth || height !== window.innerHeight) { windowResized(); }

  let sorted = sortPoints();
  let a = getPhase() * TWO_PI - HALF_PI;
  let cur = sampleAt(a, sorted);

  // 境界グラデーション中は、自分の現在色（とHDRゲイン）を親経由で隣へ知らせる
  if (blendOn) { toHost({ type: 'color', rgb: [cur[0], cur[1], cur[2]], gain: outGain() }); }

  // 現在色を選ばれたレンダラで画面全体に描く（HDR失敗時はP3/sRGBへ自動降格）
  try {
    renderer.draw(cur);
  } catch (e) {
    const p3 = !!(window.matchMedia && window.matchMedia('(color-gamut: p3)').matches);
    renderer = makeCssRenderer(p3);
    renderer.draw(cur);
  }
  clear();   // p5キャンバスは透明化（背景はレンダラが担当）

  if (playMode) {
    if (showLumaCheck) { drawLumaCheck(); }
    return;
  }

  drawRing(sorted);
  drawPlayhead(a);
  drawPoints();
  if (showLumaCheck) { drawLumaCheck(); }
  if (showXY) { drawXYDiagram(sorted, cur); }

  if (sharedUI) { return; }   // 分割中は診断表示を省く（枠が小さいとUIに重なる）
  let diag = 'frame ' + frameCount + ' / t ' + nf(millis()/1000, 1, 1) + 's / ' + renderer.kind + (renderer.kind === 'HDR' ? ('  gain ' + nf(hdrGain, 1, 2)) : '');
  push(); textAlign(RIGHT, BOTTOM); textSize(11);
  fill(0, 140); noStroke(); text(diag, width - 11, height - 9);
  fill(255, 200); text(diag, width - 12, height - 10);
  pop();
}

/* ---------------- 共通ロジック ---------------- */
function wrapAng(x) { return ((x % TWO_PI) + TWO_PI) % TWO_PI; }

function sortPoints() {
  let arr = [];
  for (let i = 0; i < points.length; i++) { arr.push({ i: i, a: wrapAng(points[i].ang) }); }
  arr.sort(function (x, y) { return x.a - y.a; });
  return arr;
}

function sampleAt(angle, sorted) {
  let A = wrapAng(angle), n = sorted.length;
  if (n === 1) { let p = points[sorted[0].i]; return [p.r, p.g, p.b]; }
  let idx = -1;
  for (let k = 0; k < n; k++) { if (sorted[k].a <= A) { idx = k; } }
  let cur, nxt;
  if (idx === -1) { cur = sorted[n - 1]; nxt = sorted[0]; }
  else { cur = sorted[idx]; nxt = sorted[(idx + 1) % n]; }
  let span = wrapAng(nxt.a - cur.a);
  if (span === 0) { span = TWO_PI; }
  let f = wrapAng(A - cur.a) / span;
  return interp(points[cur.i], points[nxt.i], f);
}

function interp(pa, pb, f) {
  if (mode === 'step') { return [pa.r, pa.g, pa.b]; }
  if (mode === 'rgbLight') {
    return [
      l2s(lerp(s2l(pa.r/255), s2l(pb.r/255), f)) * 255,
      l2s(lerp(s2l(pa.g/255), s2l(pb.g/255), f)) * 255,
      l2s(lerp(s2l(pa.b/255), s2l(pb.b/255), f)) * 255
    ];
  }
  if (mode === 'rgbValue') { return [lerp(pa.r, pb.r, f), lerp(pa.g, pb.g, f), lerp(pa.b, pb.b, f)]; }
  if (mode === 'hsb') {
    let A = rgb2hsv(pa.r, pa.g, pa.b), B = rgb2hsv(pb.r, pb.g, pb.b);
    // 無彩色（S≈0）の色相は「無力」(CSS Color 4)：相手の色相を引き継ぐ
    if (A[1] < 1e-4) { A[0] = B[0]; }
    if (B[1] < 1e-4) { B[0] = A[0]; }
    let dh = ((B[0] - A[0] + 540) % 360) - 180;
    return hsv2rgb(A[0] + dh * f, lerp(A[1], B[1], f), lerp(A[2], B[2], f));
  }
  if (mode === 'oklabLin') {
    // OKLab空間上の直線補間（中間混色的：補色間は無彩軸近くを通る）
    let A = rgb2oklab(pa.r, pa.g, pa.b), B = rgb2oklab(pb.r, pb.g, pb.b);
    return oklab2rgb(lerp(A[0], B[0], f), lerp(A[1], B[1], f), lerp(A[2], B[2], f));
  }
  if (mode === 'cielabLin') {
    // CIELab空間上の直線補間
    let A = rgb2lab(pa.r, pa.g, pa.b), B = rgb2lab(pb.r, pb.g, pb.b);
    return lab2rgb(lerp(A[0], B[0], f), lerp(A[1], B[1], f), lerp(A[2], B[2], f));
  }
  if (mode === 'cielch') {
    let A = rgb2lch(pa.r, pa.g, pa.b), B = rgb2lch(pb.r, pb.g, pb.b);
    if (A[1] < 0.5) { A[2] = B[2]; }   // 無力色相の修正（C*スケールに合わせたε）
    if (B[1] < 0.5) { B[2] = A[2]; }
    let dh = ((B[2] - A[2] + 540) % 360) - 180;
    return lch2rgb(lerp(A[0], B[0], f), lerp(A[1], B[1], f), A[2] + dh * f);
  }
  // oklch（色相回転）
  let A = rgb2oklch(pa.r, pa.g, pa.b);
  let B = rgb2oklch(pb.r, pb.g, pb.b);
  if (A[1] < 0.002) { A[2] = B[2]; }   // 無力色相の修正
  if (B[1] < 0.002) { B[2] = A[2]; }
  let dh = ((B[2] - A[2] + 540) % 360) - 180;
  return oklch2rgb(lerp(A[0], B[0], f), lerp(A[1], B[1], f), A[2] + dh * f);
}

function s2l(c) { return c <= 0.04045 ? c / 12.92 : pow((c + 0.055) / 1.055, 2.4); }
function l2s(c) { c = constrain(c, 0, 1); return c <= 0.0031308 ? 12.92 * c : 1.055 * pow(c, 1 / 2.4) - 0.055; }

function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  let mx = max(r, g, b), mn = min(r, g, b), d = mx - mn, h = 0;
  if (d !== 0) {
    if (mx === r) { h = ((g - b) / d) % 6; }
    else if (mx === g) { h = (b - r) / d + 2; }
    else { h = (r - g) / d + 4; }
    h *= 60; if (h < 0) { h += 360; }
  }
  return [h, mx === 0 ? 0 : d / mx, mx];
}
function hsv2rgb(h, s, v) {
  h = ((h % 360) + 360) % 360;
  let c = v * s, x = c * (1 - abs((h / 60) % 2 - 1)), m = v - c, r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}

/* ---- CIELab / CIELCh (D65) ---- */
function rgb2xyz(r, g, b) {
  let R = s2l(r / 255), G = s2l(g / 255), B = s2l(b / 255);
  let X = (0.4124564 * R + 0.3575761 * G + 0.1804375 * B) * 100;
  let Y = (0.2126729 * R + 0.7151522 * G + 0.0721750 * B) * 100;
  let Z = (0.0193339 * R + 0.1191920 * G + 0.9503041 * B) * 100;
  return [X, Y, Z];
}
function fLab(t) { return t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116); }
function finvLab(t) { let t3 = t * t * t; return t3 > 0.008856 ? t3 : (t - 16 / 116) / 7.787; }
function rgb2lab(r, g, b) {
  let xyz = rgb2xyz(r, g, b);
  let fx = fLab(xyz[0] / 95.047), fy = fLab(xyz[1] / 100.0), fz = fLab(xyz[2] / 108.883);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function lab2rgb(L, A, B) {
  let fy = (L + 16) / 116, fx = fy + A / 500, fz = fy - B / 200;
  let X = 95.047 * finvLab(fx) / 100, Y = 100.0 * finvLab(fy) / 100, Z = 108.883 * finvLab(fz) / 100;
  let R = 3.2404542 * X - 1.5371385 * Y - 0.4985314 * Z;
  let G = -0.9692660 * X + 1.8760108 * Y + 0.0415560 * Z;
  let B2 = 0.0556434 * X - 0.2040259 * Y + 1.0572252 * Z;
  return [l2s(R) * 255, l2s(G) * 255, l2s(B2) * 255];
}
function rgb2lch(r, g, b) {
  let lab = rgb2lab(r, g, b);
  let C = sqrt(lab[1] * lab[1] + lab[2] * lab[2]);
  let h = atan2(lab[2], lab[1]) * 180 / PI; if (h < 0) { h += 360; }
  return [lab[0], C, h];
}
function lch2rgb(L, C, h) {
  return lab2rgb(L, C * cos(h * PI / 180), C * sin(h * PI / 180));
}

function rgb2oklab(r, g, b) {
  let R = s2l(r/255), G = s2l(g/255), B = s2l(b/255);
  let l = 0.4122214708*R + 0.5363325363*G + 0.0514459929*B;
  let m = 0.2119034982*R + 0.6806995451*G + 0.1073969566*B;
  let s = 0.0883024619*R + 0.2817188376*G + 0.6299787005*B;
  let l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
  return [
    0.2104542553*l_ + 0.7936177850*m_ - 0.0040720468*s_,
    1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_,
    0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_
  ];
}
function oklab2rgb(L, a, b) {
  let l_ = L + 0.3963377774*a + 0.2158037573*b;
  let m_ = L - 0.1055613458*a - 0.0638541728*b;
  let s_ = L - 0.0894841775*a - 1.2914855480*b;
  let l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
  let R = 4.0767416621*l - 3.3077115913*m + 0.2309699292*s;
  let G = -1.2684380046*l + 2.6097574011*m - 0.3413193965*s;
  let B = -0.0041960863*l - 0.7034186147*m + 1.7076147010*s;
  return [l2s(R) * 255, l2s(G) * 255, l2s(B) * 255];
}
function rgb2oklch(r, g, b) {
  let o = rgb2oklab(r, g, b);
  let C = sqrt(o[1]*o[1] + o[2]*o[2]);
  let h = atan2(o[2], o[1]) * 180 / PI; if (h < 0) { h += 360; }
  return [o[0], C, h];
}
function oklch2rgb(L, C, h) { return oklab2rgb(L, C * cos(h*PI/180), C * sin(h*PI/180)); }

// 拡張sRGBエンコード：1.0を超える値にも同じ伝達関数を延長して適用
function encExt(v) {
  v = Math.max(v, 0);
  return v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
}

function hexToRgb(hx) {
  hx = hx.replace('#', '');
  return [parseInt(hx.substr(0,2),16), parseInt(hx.substr(2,2),16), parseInt(hx.substr(4,2),16)];
}
function hex2(n) { let s = Math.round(constrain(n, 0, 255)).toString(16); return s.length < 2 ? '0' + s : s; }

/* ---------------- 境界グラデーション ----------------
   隣り合う枠の現在色どうしを、選択中の補間方式（全枠共通）で空間的につなぐ。左右にも上下にも働く。
   枠の中央＝自分の色（補間の f=0）、境界＝ちょうど中間（f=0.5）、その先は隣の枠が引き継ぐ。
   両側の枠が同じ2色・同じ方式で計算するので、境界で色が一致する（隣の色は1フレーム遅れで届く）。
   幅 blendWidth=1 で枠の中央まで、小さいほど境界付近だけ。ステップ切替は補間しないので、境界は切り替わったまま。
   方式ごとの道筋は曲がるので、EDGE_N 区間の表（線形×ゲイン）にしてレンダラへ渡し、表のあいだは光量で線形補間する。

   T字の境界（1つの辺に複数の枠が接する）：辺の区間ごとに相手を替え、相手ごとの表を持つ。
   区間の切り替わり目は、境界から離れるほど幅広くぼかす（ぼかしの半幅＝境界からの距離、45°の扇形）。
   境界の上ではぼかし幅0なので、各区間で相手の枠と色が一致する。3つの枠が出会う1点だけは不連続になる */
const EDGE_N = 32;
const EDGE_MAXS = 8;                     // 1辺あたりの相手の上限（超えた辺はつながない）
const EDGE_SIDES = ['L', 'R', 'T', 'B'];
const EDGE_FAR = 1e6;                    // 辺の両端の区間は外側へ無限に延ばす（端でぼかさない）
const EDGE_CN = 33;                      // 角の面の表の一辺の点数
const EDGE_CORNERS = ['TL', 'TR', 'BL', 'BR'];   // 並び順＝ (右なら+1) + (下なら+2)
function outGain() { return (renderer && renderer.kind === 'HDR') ? hdrGain : 1; }

/* 4枠が集まる角（中間混色の4方式だけ）
   中間混色はその色空間での直線補間なので、角に集まる4色を同じ空間で双線形に混ぜる面を張れる。
   自分 P・左右の隣 H・上下の隣 V・対角 D、kx, ky（0＝境界、1＝帯の外）で
     c = P + (1-kx)/2 (H-P) + (1-ky)/2 (V-P) + (1-kx)(1-ky)/4 (D-H-V+P)
   角（0,0）は4色の平均、左右の境界上（kx=0）は P と H の中点から伸びる線＝隣と同じ、
   帯の外側（kx=1 や ky=1）は1辺だけの表と同じになる。色相回転系は回る向きが4色で決まらないので使わない */
const LIN_SPACES = {
  rgbValue:  [function (c) { return [c.r, c.g, c.b]; }, function (v) { return v; }],
  rgbLight:  [function (c) { return [s2l(c.r / 255), s2l(c.g / 255), s2l(c.b / 255)]; },
              function (v) { return [l2s(v[0]) * 255, l2s(v[1]) * 255, l2s(v[2]) * 255]; }],
  oklabLin:  [function (c) { return rgb2oklab(c.r, c.g, c.b); }, function (v) { return oklab2rgb(v[0], v[1], v[2]); }],
  cielabLin: [function (c) { return rgb2lab(c.r, c.g, c.b); }, function (v) { return lab2rgb(v[0], v[1], v[2]); }]
};
// 角の面の表（線形×ゲイン）。並びは [ky の段][kx の列]
function cornerLut(P, H, V, D, gP) {
  let sp = LIN_SPACES[mode], f = sp[0];
  let p = f(P), h = f(H), v = f(V), d = f(D);
  let out = new Float32Array(EDGE_CN * EDGE_CN * 4), k = 0;
  for (let jy = 0; jy < EDGE_CN; jy++) {
    let ay = (1 - jy / (EDGE_CN - 1)) / 2;
    for (let jx = 0; jx < EDGE_CN; jx++) {
      let ax = (1 - jx / (EDGE_CN - 1)) / 2, axy = ax * ay;
      let q = [0, 1, 2].map(function (i) { return p[i] + ax * (h[i] - p[i]) + ay * (v[i] - p[i]) + axy * (d[i] - h[i] - v[i] + p[i]); });
      let g = gP + ax * (H.gain - gP) + ay * (V.gain - gP) + axy * (D.gain - H.gain - V.gain + gP);
      let c = sp[1](q);
      out[k++] = s2l(constrain(c[0], 0, 255) / 255) * g;
      out[k++] = s2l(constrain(c[1], 0, 255) / 255) * g;
      out[k++] = s2l(constrain(c[2], 0, 255) / 255) * g;
      out[k++] = 1;
    }
  }
  return out;
}
// 境界（j=0）から帯の終わり（j=EDGE_N、自分の色）までの表。
// 補間は必ず「左（上）の枠の色 → 右（下）の枠の色」の向きで評価する（色相回転は補色どうしだと回る向きが
// 引数の順で変わるため、両側の枠で同じ向きにそろえないと境界で食い違う）
function edgeLut(rgb, o, side) {
  let me = { r: rgb[0], g: rgb[1], b: rgb[2] }, g0 = outGain();
  let fwd = (side === 'R' || side === 'B');
  let out = new Float32Array((EDGE_N + 1) * 4);
  for (let j = 0; j <= EDGE_N; j++) {
    let f = 0.5 * (1 - j / EDGE_N);
    let c = fwd ? interp(me, o, f) : interp(o, me, 1 - f);
    let g = g0 + (o.gain - g0) * f;   // ゲインが枠ごとに違っても境界で一致させる
    out[j * 4]     = s2l(constrain(c[0], 0, 255) / 255) * g;
    out[j * 4 + 1] = s2l(constrain(c[1], 0, 255) / 255) * g;
    out[j * 4 + 2] = s2l(constrain(c[2], 0, 255) / 255) * g;
    out[j * 4 + 3] = 1;
  }
  return out;
}
// 各辺の区間の並び [{ a0, a1, lut }]。色の届いた区間だけを詰め、両端の区間は外へ延ばす。
// 何もつながないときは null
function edgeLuts(rgb) {
  if (!blendOn || mode === 'step') { return null; }
  let t = {}, any = false;
  EDGE_SIDES.forEach(function (k) {
    let list = [];
    nb[k].forEach(function (sg) { if (sg.c) { list.push({ a0: sg.a0, a1: sg.a1, lut: edgeLut(rgb, sg.c, k) }); } });
    if (list.length > 0) {
      list[0].a0 = -EDGE_FAR; list[list.length - 1].a1 = EDGE_FAR;
      any = true;
    }
    t[k] = list;
  });
  // 4枠が集まる角の面。左右の隣＝その辺の角側の端の区間、上下の隣も同じ
  t.corners = {};
  if (any && LIN_SPACES[mode]) {
    let me = { r: rgb[0], g: rgb[1], b: rgb[2] };
    EDGE_CORNERS.forEach(function (c) {
      if (!cornerOn[c] || !diag[c]) { return; }
      let hl = nb[c[1]], vl = nb[c[0]];
      let hs = (c[0] === 'T') ? hl[0] : hl[hl.length - 1];
      let vs = (c[1] === 'L') ? vl[0] : vl[vl.length - 1];
      if (!hs || !vs || !hs.c || !vs.c) { return; }
      t.corners[c] = cornerLut(me, hs.c, vs.c, diag[c], outGain());
    });
  }
  return any ? t : null;
}
// 区間 [a0, a1] の重み。pos は辺に沿った位置（0..1）、h はぼかしの半幅（同じ単位）。
// 隣り合う区間の重みの和は 1 になる。WGSL 側にも同じ式がある
function edgeSegW(pos, a0, a1, h) {
  return constrain((pos - a0 + h) / (2 * h), 0, 1) - constrain((pos - a1 + h) / (2 * h), 0, 1);
}
// 左右と上下の両方が効く隅の合成の重み。kx, ky は 0＝境界、1＝帯の外。
// 左右の境界上（kx=0）では左右の表だけ、上下の境界上では上下の表だけになる（＝どの境界でも隣と一致する）。
// WGSL 側にも同じ式がある
function edgeWeights(kx, ky) {
  let h = (1 - kx) * ky, v = (1 - ky) * kx, d = h + v;
  return d > 1e-5 ? [h / d, v / d] : [0.5, 0.5];
}
// 非HDR用：枠内の位置 (x,y)（0..1）の色（線形）を表から求める。W, H は枠の画素数。WGSL の fs と同じ計算
function edgeColorAt(x, y, self, luts, W, H) {
  function at(t, k) {
    let p = k * EDGE_N, i0 = Math.min(Math.floor(p), EDGE_N - 1), f = p - i0, a = i0 * 4, b = a + 4;
    return [t[a] + (t[b] - t[a]) * f, t[a+1] + (t[b+1] - t[a+1]) * f, t[a+2] + (t[b+2] - t[a+2]) * f];
  }
  // 辺の区間を重みで混ぜた色。区間がなければ null
  function side(list, k, pos, h) {
    if (!list || list.length === 0) { return null; }
    let acc = [0, 0, 0], ws = 0;
    for (let i = 0; i < list.length; i++) {
      let w = edgeSegW(pos, list[i].a0, list[i].a1, h);
      if (w > 0) { let c = at(list[i].lut, k); acc[0] += c[0] * w; acc[1] += c[1] * w; acc[2] += c[2] * w; ws += w; }
    }
    return ws > 1e-6 ? [acc[0] / ws, acc[1] / ws, acc[2] / ws] : null;
  }
  let ex = Math.min(x, 1 - x), ey = Math.min(y, 1 - y);
  let kx = constrain(ex * 2 / blendWidth, 0, 1), ky = constrain(ey * 2 / blendWidth, 0, 1);
  // ぼかしの半幅：境界からの距離（画素）を、辺に沿った長さで割る
  let ch = side(x > 0.5 ? luts.R : luts.L, kx, y, Math.max(ex * W / H, 1e-6));
  let cv = side(y > 0.5 ? luts.B : luts.T, ky, x, Math.max(ey * H / W, 1e-6));
  if (!ch && !cv) { return self; }
  let w = (ch && cv) ? edgeWeights(kx, ky) : [1, 1];
  let out = [self[0], self[1], self[2]];
  for (let i = 0; i < 3; i++) {
    if (ch) { out[i] += (ch[i] - self[i]) * w[0]; }
    if (cv) { out[i] += (cv[i] - self[i]) * w[1]; }
  }
  // 4枠が集まる角：角側の端の区間に入っているぶんだけ（重み wH・wV）、角の面に置き換える
  let ck = (y > 0.5 ? 'B' : 'T') + (x > 0.5 ? 'R' : 'L');
  let cl = luts.corners && luts.corners[ck];
  if (cl && ch && cv) {
    let hl = x > 0.5 ? luts.R : luts.L, vl = y > 0.5 ? luts.B : luts.T;
    let hs = y > 0.5 ? hl[hl.length - 1] : hl[0], vs = x > 0.5 ? vl[vl.length - 1] : vl[0];
    let wc = edgeSegW(y, hs.a0, hs.a1, Math.max(ex * W / H, 1e-6)) * edgeSegW(x, vs.a0, vs.a1, Math.max(ey * H / W, 1e-6));
    let pc = cornerAt(cl, kx, ky);
    for (let i = 0; i < 3; i++) { out[i] += (pc[i] - out[i]) * wc; }
  }
  return out;
}
// 角の面の表を (kx, ky) で双線形に引く。WGSL 側の cornerAt と同じ
function cornerAt(t, kx, ky) {
  let N = EDGE_CN - 1, px = kx * N, py = ky * N;
  let ix = Math.min(Math.floor(px), N - 1), iy = Math.min(Math.floor(py), N - 1), fx = px - ix, fy = py - iy;
  let a = (iy * EDGE_CN + ix) * 4, b = a + 4, c = a + EDGE_CN * 4, d = c + 4, out = [0, 0, 0];
  for (let i = 0; i < 3; i++) {
    let top = t[a + i] + (t[b + i] - t[a + i]) * fx, bot = t[c + i] + (t[d + i] - t[c + i]) * fx;
    out[i] = top + (bot - top) * fy;
  }
  return out;
}

/* ---------------- レンダラ検出 ---------------- */
function refreshRenderer() {
  detectAndInitRenderer().then(function (r) {
    renderer = r;
    if (gainWrap) { gainWrap.style('display', r.kind === 'HDR' ? 'flex' : 'none'); }
    resizeGpu();
  }).catch(function (e) { showErr(e); });
}

async function detectAndInitRenderer() {
  // ディスプレイ（現在の表示環境）が実際にHDRを表示できるかを最初に判定。
  // WebGPUのHDR設定はSDRディスプレイでも「成功」してしまう（出力が頭打ちになるだけ）ため、
  // dynamic-range メディアクエリでの能力判定が必須。
  const hdrDisplay = !!(window.matchMedia && window.matchMedia('(dynamic-range: high)').matches);
  if (hdrDisplay && navigator.gpu && !NO_HDR) {
    try {
      const adapter = await navigator.gpu.requestAdapter();
      if (adapter) {
        const device = await adapter.requestDevice();
        const canvas = document.getElementById('gpu');
        const ctx = canvas.getContext('webgpu');
        // HDRには16bit float形式が必須（8bit unormは1.0で頭打ち＝HDRにならない）
        const format = 'rgba16float';
        ctx.configure({ device, format, alphaMode: 'opaque', toneMapping: { mode: 'extended' }, colorSpace: 'srgb' });
        canvas.style.display = 'block';
        return makeWebGPURenderer(device, ctx, format);
      }
    } catch (e) { /* 次段へ */ }
  }
  const p3 = !!(window.matchMedia && window.matchMedia('(color-gamut: p3)').matches
    && window.CSS && CSS.supports('color', 'color(display-p3 1 1 1)'));
  return makeCssRenderer(p3);
}

function makeCssRenderer(wide) {
  document.getElementById('gpu').style.display = 'none';
  // 境界グラデーション用の小さなキャンバス（全面に引き伸ばして表示）。P3時は従来どおり符号値をP3座標として扱う
  const bc = document.getElementById('blend2d');
  const BW = bc.width, BH = bc.height;
  let bctx = null, img = null;
  try { bctx = bc.getContext('2d', wide ? { colorSpace: 'display-p3' } : undefined); } catch (e) { bctx = bc.getContext('2d'); }
  try { img = wide ? bctx.createImageData(BW, BH, { colorSpace: 'display-p3' }) : bctx.createImageData(BW, BH); }
  catch (e) { img = bctx.createImageData(BW, BH); }
  return {
    kind: wide ? 'P3広色域' : 'sRGB',
    draw: function (rgb) {
      let r = constrain(rgb[0], 0, 255), g = constrain(rgb[1], 0, 255), b = constrain(rgb[2], 0, 255);
      if (wide) {
        document.body.style.backgroundColor = 'color(display-p3 ' + (r/255).toFixed(4) + ' ' + (g/255).toFixed(4) + ' ' + (b/255).toFixed(4) + ')';
      } else {
        document.body.style.backgroundColor = 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
      }
      let luts = edgeLuts(rgb);
      if (!luts) {
        if (bc.style.display !== 'none') { bc.style.display = 'none'; }
        return;
      }
      let self = [s2l(r / 255), s2l(g / 255), s2l(b / 255)], d = img.data, k = 0;
      for (let j = 0; j < BH; j++) {
        for (let i = 0; i < BW; i++) {
          // 端の画素がちょうど境界（0 と 1）になるように取る
          let c = edgeColorAt(i / (BW - 1), j / (BH - 1), self, luts, window.innerWidth, window.innerHeight);
          d[k++] = Math.round(l2s(constrain(c[0], 0, 1)) * 255);
          d[k++] = Math.round(l2s(constrain(c[1], 0, 1)) * 255);
          d[k++] = Math.round(l2s(constrain(c[2], 0, 1)) * 255);
          d[k++] = 255;
        }
      }
      bctx.putImageData(img, 0, 0);
      if (bc.style.display !== 'block') { bc.style.display = 'block'; }
    }
  };
}

function makeWebGPURenderer(device, ctx, format) {
  const shader = device.createShaderModule({ code:
    'struct U {\n' +
    '  bg : vec4<f32>,\n' +
    '  gray : vec4<f32>,\n' +
    '  rect : vec4<f32>,\n' +
    '  flags : vec4<f32>,\n' +
    '  size : vec4<f32>,\n' +     // xy：キャンバスの画素数
    '  en : vec4<f32>,\n' +       // 各辺の区間の数（x左 y右 z上 w下）
    '  lself : vec4<f32>,\n' +    // 自分の光（線形×ゲイン）
    '  cflag : vec4<f32>,\n' +    // 4枠が集まる角の面の有無（x左上 y右上 z左下 w右下）
    '  seg : array<vec4<f32>, ' + (4 * EDGE_MAXS) + '>,\n' +   // 区間 xy＝a0, a1（辺に沿った 0..1）。辺ごとに EDGE_MAXS 個
    '  lut : array<vec4<f32>, ' + (4 * EDGE_MAXS * (EDGE_N + 1)) + '>,\n' +   // 区間ごとの、境界→帯の終わりの色の表（線形×ゲイン）
    '};\n' +
    '@group(0) @binding(0) var<uniform> u : U;\n' +
    '@group(0) @binding(1) var<storage, read> cl : array<vec4<f32>>;\n' +   // 4枠が集まる角の面の表（角ごとに EDGE_CN×EDGE_CN）
    'fn lutAt(base : u32, k : f32) -> vec3<f32> {\n' +
    '  let p = k * ' + EDGE_N + '.0;\n' +
    '  let i0 = min(u32(floor(p)), ' + (EDGE_N - 1) + 'u);\n' +
    '  return mix(u.lut[base + i0].rgb, u.lut[base + i0 + 1u].rgb, p - f32(i0));\n' +
    '}\n' +
    // 区間 sg（xy＝a0, a1）の重み。JS側の edgeSegW と同じ
    'fn segW(pos : f32, sg : vec4<f32>, h : f32) -> f32 {\n' +
    '  return clamp((pos - sg.x + h) / (2.0 * h), 0.0, 1.0) - clamp((pos - sg.y + h) / (2.0 * h), 0.0, 1.0);\n' +
    '}\n' +
    // 角の面の表を双線形に引く。JS側の cornerAt と同じ
    'fn cornerAt(ci : u32, kx : f32, ky : f32) -> vec3<f32> {\n' +
    '  let n = ' + (EDGE_CN - 1) + '.0;\n' +
    '  let px = kx * n; let py = ky * n;\n' +
    '  let ix = min(u32(floor(px)), ' + (EDGE_CN - 2) + 'u); let iy = min(u32(floor(py)), ' + (EDGE_CN - 2) + 'u);\n' +
    '  let fx = px - f32(ix); let fy = py - f32(iy);\n' +
    '  let a = ci * ' + (EDGE_CN * EDGE_CN) + 'u + iy * ' + EDGE_CN + 'u + ix;\n' +
    '  let top = mix(cl[a].rgb, cl[a + 1u].rgb, fx);\n' +
    '  let bot = mix(cl[a + ' + EDGE_CN + 'u].rgb, cl[a + ' + (EDGE_CN + 1) + 'u].rgb, fx);\n' +
    '  return mix(top, bot, fy);\n' +
    '}\n' +
    // 辺 s の区間を重みで混ぜた色（rgb）と重みの和（a）。JS側の edgeColorAt 内の side() と同じ
    'fn sideCol(s : u32, n : u32, k : f32, pos : f32, h : f32) -> vec4<f32> {\n' +
    '  var acc = vec3<f32>(0.0); var ws = 0.0;\n' +
    '  for (var i = 0u; i < ' + EDGE_MAXS + 'u; i = i + 1u) {\n' +
    '    if (i >= n) { break; }\n' +
    '    let id = s * ' + EDGE_MAXS + 'u + i;\n' +
    '    let sg = u.seg[id];\n' +
    '    let w = segW(pos, sg, h);\n' +
    '    if (w > 0.0) { acc = acc + lutAt(id * ' + (EDGE_N + 1) + 'u, k) * w; ws = ws + w; }\n' +
    '  }\n' +
    '  return vec4<f32>(acc, ws);\n' +
    '}\n' +
    'fn enc(v0 : vec3<f32>) -> vec3<f32> {\n' +   // 拡張sRGBエンコード（JS側の encExt と同じ）
    '  let v = max(v0, vec3<f32>(0.0));\n' +
    '  return select(12.92 * v, 1.055 * pow(v, vec3<f32>(1.0 / 2.4)) - 0.055, v > vec3<f32>(0.0031308));\n' +
    '}\n' +
    '@vertex fn vs(@builtin(vertex_index) i : u32) -> @builtin(position) vec4<f32> {\n' +
    '  var p = array<vec2<f32>, 3>(vec2<f32>(-1.0,-3.0), vec2<f32>(-1.0,1.0), vec2<f32>(3.0,1.0));\n' +
    '  return vec4<f32>(p[i], 0.0, 1.0);\n' +
    '}\n' +
    '@fragment fn fs(@builtin(position) fc : vec4<f32>) -> @location(0) vec4<f32> {\n' +
    '  if (u.flags.x > 0.5) {\n' +
    '    let d = abs(fc.xy - u.rect.xy);\n' +
    '    if (d.x <= u.rect.z && d.y <= u.rect.w) { return u.gray; }\n' +
    '  }\n' +
    '  if (u.flags.y > 0.5) {\n' +                       // 境界グラデーション（JS側の edgeColorAt と同じ計算）
    '    let x = fc.x / u.size.x;\n' +                   // 0..1（枠の左端→右端）
    '    let y = fc.y / u.size.y;\n' +                   // 0..1（上端→下端）
    '    let ex = min(x, 1.0 - x); let ey = min(y, 1.0 - y);\n' +
    '    let kx = clamp(ex * 2.0 / u.flags.w, 0.0, 1.0);\n' +   // 0=境界, 1=帯の外
    '    let ky = clamp(ey * 2.0 / u.flags.w, 0.0, 1.0);\n' +
    '    var hs = 0u; if (x > 0.5) { hs = 1u; }\n' +
    '    var vs = 2u; if (y > 0.5) { vs = 3u; }\n' +
    '    let hh = max(ex * u.size.x / u.size.y, 0.000001); let hv = max(ey * u.size.y / u.size.x, 0.000001);\n' +
    '    let nh = u32(u.en[hs]); let nv = u32(u.en[vs]);\n' +
    '    let ch = sideCol(hs, nh, kx, y, hh);\n' +
    '    let cv = sideCol(vs, nv, ky, x, hv);\n' +
    '    let hOn = ch.w > 0.000001; let vOn = cv.w > 0.000001;\n' +
    '    if (hOn || vOn) {\n' +
    '      let me = u.lself.rgb;\n' +
    '      var wh = 1.0; var wv = 1.0;\n' +
    '      if (hOn && vOn) {\n' +
    '        let a = (1.0 - kx) * ky; let b = (1.0 - ky) * kx; let d = a + b;\n' +
    '        if (d > 0.00001) { wh = a / d; wv = b / d; } else { wh = 0.5; wv = 0.5; }\n' +
    '      }\n' +
    '      var c = me;\n' +
    '      if (hOn) { c = c + (ch.rgb / ch.w - me) * wh; }\n' +
    '      if (vOn) { c = c + (cv.rgb / cv.w - me) * wv; }\n' +
    '      var ci = 0u; if (x > 0.5) { ci = ci + 1u; } if (y > 0.5) { ci = ci + 2u; }\n' +
    '      if (hOn && vOn && u.cflag[ci] > 0.5) {\n' +     // 4枠が集まる角の面
    '        var ih = 0u; if (y > 0.5) { ih = nh - 1u; }\n' +
    '        var iv = 0u; if (x > 0.5) { iv = nv - 1u; }\n' +
    '        let wc = segW(y, u.seg[hs * ' + EDGE_MAXS + 'u + ih], hh) * segW(x, u.seg[vs * ' + EDGE_MAXS + 'u + iv], hv);\n' +
    '        c = c + (cornerAt(ci, kx, ky) - c) * wc;\n' +
    '      }\n' +
    '      return vec4<f32>(enc(c), 1.0);\n' +
    '    }\n' +
    '  }\n' +
    '  return u.bg;\n' +
    '}\n'
  });
  const UB_SEG = 32, UB_LUT = UB_SEG + 4 * EDGE_MAXS * 4;
  const CL_FLOATS = 4 * EDGE_CN * EDGE_CN * 4;
  const cornerBuf = device.createBuffer({ size: CL_FLOATS * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const UB_FLOATS = UB_LUT + 4 * EDGE_MAXS * (EDGE_N + 1) * 4;
  const uniformBuf = device.createBuffer({ size: UB_FLOATS * 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bgl = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
    { binding: 1, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } }
  ] });
  const bindGroup = device.createBindGroup({ layout: bgl, entries: [
    { binding: 0, resource: { buffer: uniformBuf } },
    { binding: 1, resource: { buffer: cornerBuf } }
  ] });
  const pipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
    vertex: { module: shader, entryPoint: 'vs' },
    fragment: { module: shader, entryPoint: 'fs', targets: [{ format: format }] },
    primitive: { topology: 'triangle-list' }
  });
  resizeGpu();
  return {
    kind: 'HDR',
    draw: function (rgb) {
      // 背景：線形値をhdrGain倍で持ち上げ（グレーと同一スケール＝輝度比較が正しく成立）
      let lr = s2l(constrain(rgb[0], 0, 255) / 255);
      let lg = s2l(constrain(rgb[1], 0, 255) / 255);
      let lb = s2l(constrain(rgb[2], 0, 255) / 255);
      let bgR = encExt(lr * hdrGain), bgG = encExt(lg * hdrGain), bgB = encExt(lb * hdrGain);

      let gR = 0, gG = 0, gB = 0, showGray = 0.0, rcx = 0, rcy = 0, rhw = 0, rhh = 0;
      const gpu = document.getElementById('gpu');
      if (showLumaCheck) {
        showGray = 1.0;
        let gg = grayForMode();  // [0..255] のSDRグレー（R=G=B）
        // グレーは正規化せず、背景と同じ線形スケール(hdrGain倍)で素直に持ち上げる
        let gl = s2l(constrain(gg[0], 0, 255) / 255) * hdrGain;
        let gv = encExt(gl);
        gR = gv; gG = gv; gB = gv;
        let glay = grayLayout();
        let dpr = window.devicePixelRatio || 1;
        rcx = cx * dpr; rcy = glay[1] * dpr; rhw = (glay[0] / 2) * dpr; rhh = (glay[0] / 2) * dpr;
      }
      let luts = edgeLuts(rgb);
      const data = new Float32Array(UB_FLOATS);
      data.set([
        bgR, bgG, bgB, 1.0,
        gR, gG, gB, 1.0,
        rcx, rcy, rhw, rhh,
        showGray, luts ? 1.0 : 0.0, 0.0, blendWidth,
        Math.max(1, gpu.width), Math.max(1, gpu.height), 0.0, 0.0,
        luts ? luts.L.length : 0, luts ? luts.R.length : 0, luts ? luts.T.length : 0, luts ? luts.B.length : 0,
        lr * hdrGain, lg * hdrGain, lb * hdrGain, 1.0,
        (luts && luts.corners.TL) ? 1 : 0, (luts && luts.corners.TR) ? 1 : 0, (luts && luts.corners.BL) ? 1 : 0, (luts && luts.corners.BR) ? 1 : 0
      ], 0);
      if (luts) {
        EDGE_CORNERS.forEach(function (c, ci) {
          if (luts.corners[c]) { device.queue.writeBuffer(cornerBuf, ci * EDGE_CN * EDGE_CN * 16, luts.corners[c]); }
        });
      }
      if (luts) {
        EDGE_SIDES.forEach(function (k, si) {
          luts[k].forEach(function (sg, i) {
            let id = si * EDGE_MAXS + i;
            data.set([sg.a0, sg.a1, 0, 0], UB_SEG + id * 4);
            data.set(sg.lut, UB_LUT + id * (EDGE_N + 1) * 4);
          });
        });
      }
      device.queue.writeBuffer(uniformBuf, 0, data);
      const enc = device.createCommandEncoder();
      const view = ctx.getCurrentTexture().createView();
      const pass = enc.beginRenderPass({ colorAttachments: [{ view: view, loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
      pass.setPipeline(pipeline); pass.setBindGroup(0, bindGroup); pass.draw(3); pass.end();
      device.queue.submit([enc.finish()]);
    }
  };
}

function drawRing(sorted) {
  noFill(); stroke(0, 90); strokeWeight(36); circle(cx, cy, R * 2);
  let steps = 360; strokeWeight(26); strokeCap(ROUND);
  for (let k = 0; k < steps; k++) {
    let a0 = k / steps * TWO_PI, a1 = (k + 1.35) / steps * TWO_PI;
    let c = sampleAt(a0 + 0.0001, sorted);
    stroke(c[0], c[1], c[2]);
    line(cx + cos(a0) * R, cy + sin(a0) * R, cx + cos(a1) * R, cy + sin(a1) * R);
  }
}
function drawPlayhead(a) {
  let x0 = cx + cos(a) * (R - 26), y0 = cy + sin(a) * (R - 26);
  let x1 = cx + cos(a) * (R + 26), y1 = cy + sin(a) * (R + 26);
  stroke(0, 150); strokeWeight(6); line(x0, y0, x1, y1);
  stroke(255); strokeWeight(2.5); line(x0, y0, x1, y1);
  noStroke(); fill(255); circle(x1, y1, 11);
  stroke(0, 150); strokeWeight(1.5); noFill(); circle(x1, y1, 11);
}
function drawPoints() {
  for (let i = 0; i < points.length; i++) {
    let p = points[i];
    let x = cx + cos(p.ang) * R, y = cy + sin(p.ang) * R;
    let hovered = dist(mouseX, mouseY, x, y) < hitR;
    let dragging = (i === dragIdx);
    let base = isCoarse ? 19 : 14;
    let rr = (dragging || hovered) ? base + 3 : base;
    if (dragging && dragDelete) {
      stroke(0, 160); strokeWeight(7); noFill(); circle(x, y, rr * 2 + 4);
      stroke(255, 70, 70); strokeWeight(4); fill(p.r, p.g, p.b, 120); circle(x, y, rr * 2);
      stroke(255); strokeWeight(3);
      line(x - 7, y - 7, x + 7, y + 7); line(x - 7, y + 7, x + 7, y - 7);
      drawOutlinedText('離すと削除', x, y - rr - 16, 13, 255);
    } else {
      stroke(0, 160); strokeWeight(6); noFill(); circle(x, y, rr * 2 + 3);
      stroke(255); strokeWeight(3); fill(p.r, p.g, p.b); circle(x, y, rr * 2);
    }
  }
}
function drawOutlinedText(s, x, y, size, al) {
  push(); textAlign(CENTER, CENTER); textSize(size); textStyle(BOLD);
  fill(0, al * 0.8); noStroke(); text(s, x + 1, y + 1);
  fill(255, al); text(s, x, y); pop();
}

/* ---------------- 操作 ---------------- */
function isCanvasEvent(e) { return !e || !e.target || e.target.tagName === 'CANVAS'; }

function mousePressed(e) {
  if (IS_HOST || !isCanvasEvent(e)) { return; }
  if (playMode) { exitPlay(); return; }
  pressX = mouseX; pressY = mouseY; movedFar = false;
  dragIdx = -1; dragDelete = false; dragPlayhead = false;
  // 再生ヘッド（針先のノブ）のドラッグ判定は色点より優先
  let pha = getPhase() * TWO_PI - HALF_PI;
  let phx = cx + cos(pha) * (R + 26), phy = cy + sin(pha) * (R + 26);
  if (dist(mouseX, mouseY, phx, phy) < hitR) { dragPlayhead = true; return; }
  // xy色度図の色点ドラッグ（xy図のみ表示のとき）
  dragXYIdx = -1;
  if (showXY && !showLumaCheck) {
    let ly = xyLayout();
    for (let i = 0; i < points.length; i++) {
      let xy = xyFromRgb(points[i].r, points[i].g, points[i].b);
      let X = xyPixX(xy[0], ly[0], ly[2]), Y = xyPixY(xy[1], ly[1], ly[3]);
      if (dist(mouseX, mouseY, X, Y) < Math.max(15, hitR * 0.6)) {
        dragXYIdx = i;
        dragXY_Y = rgb2xyz(points[i].r, points[i].g, points[i].b)[1] / 100;
        return;
      }
    }
  }
  for (let i = 0; i < points.length; i++) {
    let x = cx + cos(points[i].ang) * R, y = cy + sin(points[i].ang) * R;
    if (dist(mouseX, mouseY, x, y) < hitR) { dragIdx = i; break; }
  }
}
function mouseDragged(e) {
  if (IS_HOST) { return; }
  if (dragPlayhead) {
    movedFar = true;
    let ang = atan2(mouseY - cy, mouseX - cx);
    setPhase(wrapAng(ang + HALF_PI) / TWO_PI);
    return;
  }
  if (dragXYIdx >= 0) {
    movedFar = true;
    let ly = xyLayout();
    let x = (mouseX - ly[0]) / ly[2] * 0.8;
    let y = (ly[1] + ly[3] - mouseY) / ly[3] * 0.9;
    x = constrain(x, 0.0, 0.8); y = constrain(y, 0.005, 0.9);
    let rgb = xyYfit(x, y, dragXY_Y);   // 輝度Yを保ったまま色度だけ変更
    points[dragXYIdx].r = rgb[0]; points[dragXYIdx].g = rgb[1]; points[dragXYIdx].b = rgb[2];
    return;
  }
  if (dist(mouseX, mouseY, pressX, pressY) > 7) { movedFar = true; }
  if (dragIdx < 0 || !movedFar) { return; }
  points[dragIdx].ang = atan2(mouseY - cy, mouseX - cx);
  dragDelete = dist(mouseX, mouseY, cx, cy) > R * 1.35;
}
function mouseReleased(e) {
  if (IS_HOST) { return; }
  if (dragPlayhead) { dragPlayhead = false; movedFar = false; return; }
  if (dragXYIdx >= 0) { dragXYIdx = -1; movedFar = false; return; }
  let wasTap = !movedFar;
  if (dragIdx >= 0 && dragDelete && points.length > 2) { points.splice(dragIdx, 1); wasTap = false; }
  dragIdx = -1; dragDelete = false;
  if (wasTap && !playMode) { handleTap(mouseX, mouseY); }
}

function handleTap(x, y) {
  for (let i = 0; i < points.length; i++) {
    let px = cx + cos(points[i].ang) * R, py = cy + sin(points[i].ang) * R;
    if (dist(x, y, px, py) < hitR) {
      let now = millis();
      if (now - lastTapT < 400 && dist(x, y, lastTapX, lastTapY) < 40) { lastTapT = -99999; openPickerAt(i, px, py); }
      else { lastTapT = now; lastTapX = x; lastTapY = y; }
      return;
    }
  }
  let d = dist(x, y, cx, cy);
  if (abs(d - R) < hitR + 8) {
    let ang = atan2(y - cy, x - cx);
    let c = sampleAt(ang, sortPoints());
    points.push({ ang: ang, r: c[0], g: c[1], b: c[2] });
  }
}

function touchStarted(e) { if (IS_HOST || !isCanvasEvent(e)) { return; } mousePressed(e); return false; }
function touchMoved(e) { if (IS_HOST || !isCanvasEvent(e)) { return; } mouseDragged(e); return false; }
function touchEnded(e) { if (IS_HOST || !isCanvasEvent(e)) { return; } mouseReleased(e); return false; }

function openPickerAt(i, x, y) {
  pickTarget = i;
  let p = points[i];
  picker.style.left = x + 'px'; picker.style.top = y + 'px';
  picker.value = '#' + hex2(p.r) + hex2(p.g) + hex2(p.b);
  picker.click();
}

function keyPressed() {
  if (IS_HOST) { return; }
  if (key === 'f' || key === 'F') { enterPlay(); }
  if (key === ' ') { togglePause(); }
  if (keyCode === ESCAPE) { exitPlay(); if (infoPanel) { infoPanel.style.display = 'none'; } }
}

// フルスクリーンは親ページが画面全体で行い、全ペインのUIを同時に消す。
// 子は親に依頼するだけ（実際の出し入れは親から届く setPlay → applyPlay）
function enterPlay() {
  // 同一オリジンなら、クリックの流れの中で直接フルスクリーンを要求する（ユーザー操作の要件を確実に満たす）
  let asked = false;
  try {
    let el = window.parent.document.documentElement;
    let fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { let pr = fn.call(el); if (pr && pr.catch) { pr.catch(function () {}); } asked = true; }
  } catch (err) { /* file:// などで親に触れないときは、親側で要求する */ }
  toHost({ type: 'play', on: true, asked: asked });
}
function exitPlay() {
  if (!playMode) { return; }
  toHost({ type: 'play', on: false });
}
function applyPlay(on) {
  if (on === playMode) { return; }
  document.body.classList.toggle('play', on);
  if (on) {
    playMode = true;
    topBar.hide(); timeBar.hide(); colorBar.hide(); viewBar.hide();
    if (infoBtn) { infoBtn.style.display = 'none'; }
    if (infoPanel) { infoPanel.style.display = 'none'; }
    if (modeSwitch) { modeSwitch.style.display = 'none'; }
    if (modeModal) { modeModal.classList.remove('open'); }
    if (fsBtn) { fsBtn.style.display = 'none'; }
    return;
  }
  playMode = false;
  // show()が付与するインラインdisplayはCSSと競合するため、クラス制御に戻す
  [topBar, timeBar, colorBar, viewBar].forEach(function (b) {
    if (b) { b.show(); b.elt.style.display = ''; }
  });
  if (infoBtn) { infoBtn.style.display = 'block'; }
  if (fsBtn) { fsBtn.style.display = 'flex'; }
  if (modeSwitch) { modeSwitch.style.display = ''; }
  // フルスクリーン解除→リサイズ完了を待ってからレイアウトを再計算（崩れ防止）
  setTimeout(function () { layout(); resizeGpu(); applyResponsive(); placeBars(); }, 60);
  setTimeout(function () { layout(); resizeGpu(); applyResponsive(); placeBars(); }, 250);
}

/* ---------------- 親子間のやり取り（子側） ---------------- */
function toHost(msg) { try { window.parent.postMessage(msg, '*'); } catch (err) {} }

function initPaneMessaging() {
  window.addEventListener('message', function (ev) {
    if (ev.source !== window.parent || !ev.data) { return; }
    let d = ev.data;
    if (d.type === 'setPlay') { applyPlay(!!d.on); }
    else if (d.type === 'wake') { setWakeState(d.state); }
    else if (d.type === 'getState') { toHost({ type: 'state', id: d.id, state: getState() }); }
    else if (d.type === 'shared') {
      let was = sharedUI;
      sharedUI = !!d.on; topInset = +d.top || 0;
      document.body.classList.toggle('shared', sharedUI);
      if (sharedUI && d.mode) { setModeById(d.mode); }
      if (was !== sharedUI) {
        if (modeModal) { modeModal.classList.remove('open'); }
        if (infoPanel) { infoPanel.style.display = 'none'; }
      }
      layout(); applyResponsive();
    }
    else if (d.type === 'setMode') { setModeById(d.mode); }
    else if (d.type === 'blend') {
      blendOn = !!d.on; blendWidth = constrain(+d.width || 1, 0.05, 1);
      // 辺ごとの区間の並び。並びが同じなら届いている色を引き継ぐ（設定が来るたびに一瞬つながりが切れないように）
      EDGE_SIDES.forEach(function (k) {
        let segs = (blendOn && d.segs && Array.isArray(d.segs[k])) ? d.segs[k] : [];
        let old = nb[k];
        nb[k] = segs.slice(0, EDGE_MAXS).map(function (sg, i) {
          let keep = (old.length === segs.length && old[i]) ? old[i].c : null;
          return { a0: +sg[0], a1: +sg[1], c: keep };
        });
      });
      EDGE_CORNERS.forEach(function (c) {
        cornerOn[c] = !!(blendOn && d.corners && d.corners[c]);
        if (!cornerOn[c]) { diag[c] = null; }
      });
    }
    else if (d.type === 'nbd' && Array.isArray(d.rgb) && diag.hasOwnProperty(d.corner)) {
      diag[d.corner] = { r: +d.rgb[0], g: +d.rgb[1], b: +d.rgb[2], gain: +d.gain || 1 };
    }
    else if (d.type === 'nb' && Array.isArray(d.rgb) && nb.hasOwnProperty(d.side)) {
      let sg = nb[d.side][d.idx | 0];
      if (sg) { sg.c = { r: +d.rgb[0], g: +d.rgb[1], b: +d.rgb[2], gain: +d.gain || 1 }; }
    }
  });
  toHost({ type: 'ready' });
}

function setModeById(m) {
  for (let i = 0; i < MODE_LIST.length; i++) { if (MODE_LIST[i][1] === m) { mode = m; } }
  updateModeBtns();
}

// 複製用の状態。phase は壁時計 at の時点の位相。複製先は読み込みにかかった時間ぶん進めて、同じ位相で回り始める
function getState() {
  let ph = getPhase();
  return {
    points: points.map(function (q) { return { ang: q.ang, r: q.r, g: q.g, b: q.b }; }),
    mode: mode, loopDur: loopDur, hdrGain: hdrGain,
    paused: paused, reversed: reversed, phase: ph, at: Date.now(),
    showXY: showXY, showLumaCheck: showLumaCheck
  };
}

function applyStateFromHash() {
  let m = /[#&]s=([^&]*)/.exec(location.hash);
  if (!m) { return; }
  let st;
  try { st = JSON.parse(decodeURIComponent(m[1])); } catch (err) { return; }
  if (!st || !Array.isArray(st.points) || st.points.length < 2) { return; }
  points = st.points.map(function (q) { return { ang: +q.ang, r: +q.r, g: +q.g, b: +q.b }; });
  for (let i = 0; i < MODE_LIST.length; i++) { if (MODE_LIST[i][1] === st.mode) { mode = st.mode; } }
  updateModeBtns();
  if (st.loopDur > 0) { setDur(+st.loopDur); }
  if (st.hdrGain > 0) { hdrGain = +st.hdrGain; if (gainSlider) { gainSlider.value(hdrGain); } }
  showXY = !!st.showXY; if (showXY) { xyBtn.addClass('active'); }
  showLumaCheck = !!st.showLumaCheck; if (showLumaCheck) { checkBtn.addClass('active'); }
  let ph = +st.phase || 0;
  if (st.paused) {
    paused = true; pausedAt = millis();
    pauseBtn.html('▶');
  } else if (isFinite(st.at)) {
    ph += (st.reversed ? -1 : 1) * (Date.now() - st.at) / (loopDur * 1000);
    ph -= Math.floor(ph);
  }
  setReversed(!!st.reversed);
  setPhase(ph);
}

/* ---------------- 画面分割（親側） ----------------
   左右の＋で、その側の端にあるタイムラインを複製して並べる。幅は常に均等 */
function buildHost() {
  document.body.classList.add('host');
  let wrap = document.createElement('div');
  wrap.id = 'panes';
  document.body.appendChild(wrap);

  // ---- 共通バー（2つ以上に分割しているあいだだけ出る） ----
  hostBar = document.createElement('div');
  hostBar.id = 'hostBar';
  document.body.appendChild(hostBar);
  buildModeUI(hostBar, function (m) { mode = m; updateModeBtns(); hostBroadcast({ type: 'setMode', mode: m }); });

  fsBtn = document.createElement('button');
  fsBtn.id = 'fsBtn';
  fsBtn.innerHTML = '<span style="font-size:17px">\u26f6</span> フルスクリーン';
  fsBtn.title = 'フルスクリーン';
  hostBar.appendChild(fsBtn);
  fsBtn.addEventListener('click', function () { fsBtn.blur(); hostSetPlay(true, false); });

  blendBtn = document.createElement('button');
  blendBtn.id = 'blendBtn';
  blendBtn.textContent = '境界グラデーション';
  blendBtn.title = '隣り合うタイムラインの境界を、光のグラデーションでつなぐ';
  hostBar.appendChild(blendBtn);
  let bw = document.createElement('input');
  bw.type = 'range'; bw.id = 'blendW'; bw.min = '0.05'; bw.max = '1'; bw.step = '0.05'; bw.value = String(blendWidth);
  bw.title = 'グラデーションの幅（右端＝枠の中央まで）';
  bw.setAttribute('aria-label', 'グラデーションの幅');
  hostBar.appendChild(bw);
  blendBtn.addEventListener('click', function () {
    blendBtn.blur();
    blendOn = !blendOn;
    blendBtn.classList.toggle('active', blendOn);
    hostSyncPanes();
  });
  bw.addEventListener('input', function () { blendWidth = parseFloat(bw.value) || 1; hostSyncPanes(); });

  buildInfoUI(hostBar);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (infoPanel) { infoPanel.style.display = 'none'; }
      if (modeModal) { modeModal.classList.remove('open'); }
    }
  });

  window.addEventListener('message', onHostMessage);
  window.addEventListener('resize', function () { hostLayoutPanes(); hostPanes.forEach(hostSendConfig); });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (n) {
    document.addEventListener(n, function () {
      // Esc などでブラウザ側がフルスクリーンを解いたとき、UIも戻す
      if (!hostFsElement() && playMode) { hostSetPlay(false, true); }
    });
  });
  // 最初の枠（木の根）
  let first = makePane(null);
  hostRoot = { pane: first, parent: null };
  first.node = hostRoot;
  hostSyncPanes();
}

function hostFsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }

// 枠（iframe＋×＋四辺の＋）を1つ作る。置き場所は分割の木が決める
function makePane(state) {
  let wrap = document.getElementById('panes');
  let div = document.createElement('div');
  div.className = 'pane';
  let f = document.createElement('iframe');
  f.setAttribute('allow', 'fullscreen');
  f.title = 'タイムライン';
  f.src = location.pathname.split('/').pop() + '?pane=1' + (NO_HDR ? '&nohdr=1' : '') +
    (state ? '#s=' + encodeURIComponent(JSON.stringify(state)) : '');
  let pane = { div: div, frame: f, node: null, rect: { x: 0, y: 0, w: 0, h: 0 }, nb: {}, top: 0 };
  div.appendChild(f);
  let x = document.createElement('button');
  x.className = 'paneClose'; x.textContent = '×'; x.title = 'このタイムラインを閉じる';
  x.setAttribute('aria-label', 'このタイムラインを閉じる');
  x.addEventListener('click', function () { removePane(pane); });
  div.appendChild(x);
  pane.closeBtn = x;
  [['L', 'left', '左'], ['R', 'right', '右'], ['T', 'top', '上'], ['B', 'bottom', '下']].forEach(function (d) {
    let b = document.createElement('button');
    b.className = 'splitBtn s' + d[0]; b.textContent = '+';
    b.title = 'この枠を二分して、' + d[2] + 'に複製を置く';
    b.setAttribute('aria-label', b.title);
    b.addEventListener('click', function () { b.blur(); addPane(pane, d[1]); });
    div.appendChild(b);
  });
  wrap.appendChild(div);
  hostPanes.push(pane);
  return pane;
}

// pane の領域を二分して、side 側に新しい枠を置く。ほかの枠の大きさは変わらない
function splitPane(pane, side, state) {
  let np = makePane(state);
  let leaf = pane.node, nl = { pane: np, parent: null };
  np.node = nl;
  let firstNew = (side === 'left' || side === 'top');
  let sp = {
    dir: (side === 'left' || side === 'right') ? 'row' : 'col',
    a: firstNew ? nl : leaf, b: firstNew ? leaf : nl, ratio: 0.5, parent: leaf.parent
  };
  hostReplaceNode(leaf, sp);
  leaf.parent = sp; nl.parent = sp;
  hostSyncPanes();
}
function hostReplaceNode(oldNode, newNode) {
  let par = oldNode.parent;
  if (!par) { hostRoot = newNode; }
  else if (par.a === oldNode) { par.a = newNode; }
  else { par.b = newNode; }
}

// 閉じると、二分の相手が領域全体を引き継ぐ
function removePane(pane) {
  if (hostPanes.length <= 1) { return; }
  let leaf = pane.node, sp = leaf.parent;
  let sib = (sp.a === leaf) ? sp.b : sp.a;
  hostReplaceNode(sp, sib);
  sib.parent = sp.parent;
  hostPanes = hostPanes.filter(function (q) { return q !== pane; });
  pane.div.remove();
  hostSyncPanes();
}

function addPane(pane, side) {
  let id = ++hostReqId, done = false;
  function finish(state) {
    if (done) { return; }
    done = true; delete hostStateWaiters[id];
    if (hostPanes.indexOf(pane) < 0) { return; }
    // 分割を始めるときは、複製元の方式を共通の方式にする
    if (state && hostPanes.length === 1) { setModeById(state.mode); }
    splitPane(pane, side, state);
  }
  hostStateWaiters[id] = finish;
  try { pane.frame.contentWindow.postMessage({ type: 'getState', id: id }, '*'); } catch (err) {}
  setTimeout(function () { finish(null); }, 600);   // 返事がなければ初期状態で作る
}

// 節が収まるのに必要な最小の寸法（axis：'w' または 'h'）。枠1つは 220×320
function hostMinSize(node, axis) {
  if (node.pane) { return axis === 'w' ? 220 : 320; }
  let a = hostMinSize(node.a, axis), b = hostMinSize(node.b, axis);
  return ((node.dir === 'row') === (axis === 'w')) ? a + b : Math.max(a, b);
}

// 木をたどって各枠の矩形（整数px）を決める。端数幅だと継ぎ目に線が出るので丸める
function hostLayoutPanes() {
  if (!hostRoot) { return; }
  (function walk(node, r) {
    node.rect = r;
    if (node.pane) {
      node.pane.rect = r;
      let st = node.pane.div.style;
      st.left = r.x + 'px'; st.top = r.y + 'px'; st.width = r.w + 'px'; st.height = r.h + 'px';
      return;
    }
    if (node.dir === 'row') {
      let w1 = Math.round(r.w * node.ratio);
      walk(node.a, { x: r.x, y: r.y, w: w1, h: r.h });
      walk(node.b, { x: r.x + w1, y: r.y, w: r.w - w1, h: r.h });
      if (node.divEl) { let s = node.divEl.style; s.left = (r.x + w1 - 9) + 'px'; s.top = r.y + 'px'; s.width = '18px'; s.height = r.h + 'px'; }
    } else {
      let h1 = Math.round(r.h * node.ratio);
      walk(node.a, { x: r.x, y: r.y, w: r.w, h: h1 });
      walk(node.b, { x: r.x, y: r.y + h1, w: r.w, h: r.h - h1 });
      if (node.divEl) { let s = node.divEl.style; s.left = r.x + 'px'; s.top = (r.y + h1 - 9) + 'px'; s.width = r.w + 'px'; s.height = '18px'; }
    }
  })(hostRoot, { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight });

  // 境界グラデーションの相手：辺を共有する（長さ1px以上重なる）隣を、辺ごとに辺の向きの順で並べる。
  // 各相手には、その辺の上での区間（0..1）を付ける。相手が EDGE_MAXS を超える辺はつながない
  hostPanes.forEach(function (q) { q.nb = { L: [], R: [], T: [], B: [] }; });
  hostPanes.forEach(function (p) {
    hostPanes.forEach(function (q) {
      let a = p.rect, b = q.rect;
      if (b.x === a.x + a.w) {   // q は p の右
        let y0 = Math.max(a.y, b.y), y1 = Math.min(a.y + a.h, b.y + b.h);
        if (y1 - y0 >= 1) {
          p.nb.R.push({ pane: q, a0: (y0 - a.y) / a.h, a1: (y1 - a.y) / a.h });
          q.nb.L.push({ pane: p, a0: (y0 - b.y) / b.h, a1: (y1 - b.y) / b.h });
        }
      }
      if (b.y === a.y + a.h) {   // q は p の下
        let x0 = Math.max(a.x, b.x), x1 = Math.min(a.x + a.w, b.x + b.w);
        if (x1 - x0 >= 1) {
          p.nb.B.push({ pane: q, a0: (x0 - a.x) / a.w, a1: (x1 - a.x) / a.w });
          q.nb.T.push({ pane: p, a0: (x0 - b.x) / b.w, a1: (x1 - b.x) / b.w });
        }
      }
    });
  });
  hostPanes.forEach(function (q) {
    ['L', 'R', 'T', 'B'].forEach(function (k) {
      q.nb[k].sort(function (m, n) { return m.a0 - n.a0; });
      if (q.nb[k].length > EDGE_MAXS) { q.nb[k] = []; }
    });
  });
  // 4枠が集まる角：左右の隣と上下の隣の両方が、ちょうどその角で終わっていれば4枠。対角の枠を覚える
  hostPanes.forEach(function (p) {
    let a = p.rect, R = a.x + a.w, Bm = a.y + a.h;
    function rr(m) { return m && m.pane.rect; }
    function find(f) { return hostPanes.filter(function (q) { return q !== p && f(q.rect); })[0] || null; }
    let L = p.nb.L, Rt = p.nb.R, T = p.nb.T, B = p.nb.B;
    let hTL = rr(L[0]), vTL = rr(T[0]), hTR = rr(Rt[0]), vTR = rr(T[T.length - 1]);
    let hBL = rr(L[L.length - 1]), vBL = rr(B[0]), hBR = rr(Rt[Rt.length - 1]), vBR = rr(B[B.length - 1]);
    p.diag = {
      TL: (hTL && vTL && hTL.y === a.y && vTL.x === a.x) ? find(function (r) { return r.x + r.w === a.x && r.y + r.h === a.y; }) : null,
      TR: (hTR && vTR && hTR.y === a.y && vTR.x + vTR.w === R) ? find(function (r) { return r.x === R && r.y + r.h === a.y; }) : null,
      BL: (hBL && vBL && hBL.y + hBL.h === Bm && vBL.x === a.x) ? find(function (r) { return r.x + r.w === a.x && r.y === Bm; }) : null,
      BR: (hBR && vBR && hBR.y + hBR.h === Bm && vBR.x + vBR.w === R) ? find(function (r) { return r.x === R && r.y === Bm; }) : null
    };
  });
  // 上端が共通バーにかかる枠は、中身と×を下げる
  let multi = hostPanes.length > 1;
  hostPanes.forEach(function (q) {
    q.top = (multi && q.rect.y < 60) ? 46 : 0;
    q.closeBtn.style.top = (q.top + 26) + 'px';
  });
}

// 分割の節ごとに、境界のつまみを作り直す（木の形が変わったとき）
function hostRebuildDividers() {
  hostDividers.forEach(function (d) { d.remove(); });
  hostDividers = [];
  (function walk(node) {
    if (node.pane) { return; }
    makeDivider(node);
    walk(node.a); walk(node.b);
  })(hostRoot);
}
function makeDivider(sp) {
  let d = document.createElement('div');
  d.className = 'paneDivider ' + (sp.dir === 'row' ? 'dv' : 'dh');
  d.title = 'ドラッグで比率を調整（ダブルクリックで半々に戻す）';
  document.body.appendChild(d);
  sp.divEl = d;
  hostDividers.push(d);
  let dragging = false;
  d.addEventListener('pointerdown', function (ev) {
    dragging = true; d.classList.add('drag');
    try { d.setPointerCapture(ev.pointerId); } catch (err) {}
    ev.preventDefault();
  });
  d.addEventListener('pointermove', function (ev) {
    if (!dragging) { return; }
    let r = sp.rect, row = (sp.dir === 'row');
    let size = row ? r.w : r.h, pos = row ? ev.clientX - r.x : ev.clientY - r.y;
    let axis = row ? 'w' : 'h';
    let lo = hostMinSize(sp.a, axis), hi = size - hostMinSize(sp.b, axis);
    if (lo > hi) { lo = hi = size * lo / (lo + (size - hi)); }   // 収まらないときは最小寸法の比で分ける
    sp.ratio = Math.max(lo, Math.min(hi, pos)) / size;
    hostLayoutPanes();
  });
  let end = function () {
    if (!dragging) { return; }
    dragging = false; d.classList.remove('drag');
    hostPanes.forEach(hostSendConfig);   // 辺の重なり方が変わると、境界グラデーションの相手も変わる
  };
  d.addEventListener('pointerup', end);
  d.addEventListener('pointercancel', end);
  d.addEventListener('dblclick', function () {
    sp.ratio = 0.5;
    hostLayoutPanes();
    hostPanes.forEach(hostSendConfig);
  });
}

// 分割数・共通設定を全ペインへ配り直す（追加・削除・設定変更のたびに呼ぶ）
function hostSyncPanes() {
  hostRebuildDividers();
  hostLayoutPanes();
  let multi = hostPanes.length > 1;
  document.body.classList.toggle('multi', multi);
  if (!multi) {
    if (modeModal) { modeModal.classList.remove('open'); }
    if (infoPanel) { infoPanel.style.display = 'none'; }
  }
  hostPanes.forEach(hostSendConfig);
}
function hostSendConfig(q) {
  let multi = hostPanes.length > 1;
  try {
    let w = q.frame.contentWindow;
    w.postMessage({ type: 'shared', on: multi, mode: mode, top: q.top }, '*');
    w.postMessage({ type: 'blend', on: multi && blendOn, width: blendWidth,
      segs: {
        L: q.nb.L.map(function (m) { return [m.a0, m.a1]; }), R: q.nb.R.map(function (m) { return [m.a0, m.a1]; }),
        T: q.nb.T.map(function (m) { return [m.a0, m.a1]; }), B: q.nb.B.map(function (m) { return [m.a0, m.a1]; })
      },
      corners: { TL: !!q.diag.TL, TR: !!q.diag.TR, BL: !!q.diag.BL, BR: !!q.diag.BR } }, '*');
  } catch (err) {}
}

function hostBroadcast(msg) {
  hostPanes.forEach(function (q) { try { q.frame.contentWindow.postMessage(msg, '*'); } catch (err) {} });
}

function onHostMessage(ev) {
  let d = ev.data;
  if (!d || !hostPanes.some(function (q) { return q.frame.contentWindow === ev.source; })) { return; }
  if (d.type === 'color') {
    // 現在色を、辺を共有する隣へ中継する（相手から見た側の名前と、その辺での並び順で送る）
    let me = hostPanes.filter(function (q) { return q.frame.contentWindow === ev.source; })[0];
    if (me) {
      [['L', 'R'], ['R', 'L'], ['T', 'B'], ['B', 'T']].forEach(function (pr) {
        me.nb[pr[0]].forEach(function (m) {
          let o = m.pane, idx = -1;
          o.nb[pr[1]].forEach(function (r, i) { if (r.pane === me) { idx = i; } });
          if (idx >= 0) { try { o.frame.contentWindow.postMessage({ type: 'nb', side: pr[1], idx: idx, rgb: d.rgb, gain: d.gain }, '*'); } catch (err) {} }
        });
      });
      // 4枠が集まる角の対角の枠へも送る
      hostPanes.forEach(function (q) {
        EDGE_CORNERS.forEach(function (c) {
          if (q.diag && q.diag[c] === me) { try { q.frame.contentWindow.postMessage({ type: 'nbd', corner: c, rgb: d.rgb, gain: d.gain }, '*'); } catch (err) {} }
        });
      });
    }
    return;
  }
  if (d.type === 'ready') {
    let me = hostPanes.filter(function (q) { return q.frame.contentWindow === ev.source; })[0];
    if (me) { hostSendConfig(me); }
    ev.source.postMessage({ type: 'wake', state: wakeState }, '*');
    if (playMode) { ev.source.postMessage({ type: 'setPlay', on: true }, '*'); }
  } else if (d.type === 'state') {
    if (hostStateWaiters[d.id]) { hostStateWaiters[d.id](d.state); }
  } else if (d.type === 'play') {
    hostSetPlay(!!d.on, !!d.asked);
  } else if (d.type === 'gesture') {
    requestWakeLock(true);
  }
}

// on=true：全ペインのUIを消してフルスクリーンへ／false：戻す。fsDone は「フルスクリーンの切替は済み（または不要）」
function hostSetPlay(on, fsDone) {
  playMode = on;
  document.body.classList.toggle('playing', on);
  if (on && wakeNotice) { wakeNotice.classList.remove('open'); }
  hostBroadcast({ type: 'setPlay', on: on });
  try {
    if (on && !fsDone && !hostFsElement()) {
      let el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn) { let pr = fn.call(el); if (pr && pr.catch) { pr.catch(function () {}); } }
    } else if (!on && hostFsElement()) {
      let fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (fn) { let pr = fn.call(document); if (pr && pr.catch) { pr.catch(function () {}); } }
    }
  } catch (err) {}
}

function togglePause() {
  if (!paused) { pausedAt = millis(); paused = true; }
  else { t0 += millis() - pausedAt; paused = false; }
  pauseBtn.html(paused ? '▶' : '⏸');
}

/* ---------------- 画面スリープ防止（Screen Wake Lock） ----------------
   画面が光源なので、表示中は常にスリープを止める。
   ・ロックはタブが隠れるとOSに解放される → 再表示のたびに取り直す
   ・読み込み直後の要求が拒否される環境がある → 最初の操作（ユーザー操作）で取り直す
   ・API非対応／拒否のときは、端末側の自動ロックを切るよう案内する */
function initWakeLock() {
  if (IS_PANE) {
    // ロックは親ページが持つ。子は「操作があった」ことだけ伝える（保持中は送らない）
    let ping = function () { if (wakeState !== 'on') { toHost({ type: 'gesture' }); } };
    document.addEventListener('pointerdown', ping, true);
    document.addEventListener('keydown', ping, true);
    return;
  }
  wakeNotice = document.createElement('div');
  wakeNotice.id = 'wakeNotice';
  wakeNotice.innerHTML = '<div class="card"><b>この環境では、画面のスリープを自動で防げません。</b><br>' +
    '制作の前に、端末の自動ロック（画面オフ）を「なし」にしてください。手順は右上の i にあります。' +
    '<span class="closeHint">画面のどこかをタップすると閉じます</span></div>';
  wakeNotice.addEventListener('click', function () { wakeNotice.classList.remove('open'); });
  document.body.appendChild(wakeNotice);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { requestWakeLock(false); }
  });
  // ユーザー操作を起点にした取り直し（保持中は何もしない）
  document.addEventListener('pointerdown', function () { requestWakeLock(true); }, true);
  document.addEventListener('keydown', function () { requestWakeLock(true); }, true);
  requestWakeLock(false);
}

function requestWakeLock(fromGesture) {
  if (!('wakeLock' in navigator)) { setWakeState('unsupported'); showWakeNotice(); return; }
  if (wakeLock || wakeRequesting || document.visibilityState !== 'visible') { return; }
