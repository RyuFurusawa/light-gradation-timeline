<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>光のグラデーション・タイムライン（HDR対応）</title>
<!-- PWA：ホーム画面に追加すると、ブラウザの枠なしで起動できる -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="光タイムライン" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #stage { position: fixed; inset: 0; }
  /* HDRレンダラ用キャンバス（背景を塗る）。CSSレンダラ時は透明のまま */
  #gpu { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 0; }
  /* 非HDR表示のときの境界グラデーション（小さな画像を全面に引き伸ばす） */
  #blend2d { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 0; }
  /* UI・リングを描くキャンバスは透明で、全画面の色の手前に重ねる */
  .bar {
    position: absolute; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 10px; border-radius: 14px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    color: #f2f2f2; z-index: 10; user-select: none;
  }
  .bar button {
    padding: 7px 12px; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 9px; background: rgba(255,255,255,0.08); color: #f2f2f2;
    cursor: pointer; font-size: 13px; line-height: 1;
  }
  .bar button:hover { background: rgba(255,255,255,0.18); }
  .bar button.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  .bar span { font-size: 12.5px; color: #d8d8d8; }
  .bar input[type=number] {
    width: 60px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3);
    color: #fff; font-size: 13px; text-align: right;
  }
  .bar input[type=range] { width: 130px; accent-color: #f5f5f5; }
  #topBar { display: none; }   /* 方式選択はモーダルへ移行 */
  #timeBar { left: 50%; transform: translateX(-50%); }
  #colorBar { left: 50%; transform: translateX(-50%); }
  body:not(.narrowLayout) #colorBar { flex-wrap: nowrap; max-width: 96vw; }
  #viewBar { left: 50%; transform: translateX(-50%); }
  .segGroup { display: flex; border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; overflow: hidden; }
  .segGroup button { border: none !important; border-radius: 0 !important; }
  .segGroup button + button { border-left: 1px solid rgba(255,255,255,0.18) !important; }
  /* リング・色点・xy色度図を描く 2D キャンバス（透明、全画面の色の上に重ねる） */
  canvas.ringCanvas { position: fixed; left: 0; top: 0; z-index: 1; touch-action: none; display: block; }
  @media (pointer: coarse) {
    /* タッチ端末：押しやすさ（高さ 36px 以上）は保ちつつ、文字は控えめに */
    .bar { gap: 8px; padding: 8px 10px; max-width: 94vw; }
    .bar button { padding: 8px 12px; font-size: 13px; border-radius: 10px; min-height: 36px; }
    .bar span { font-size: 12.5px; }
    .bar input[type=number] { width: 56px; padding: 7px 8px; font-size: 14px; }
    .bar input[type=range] { width: 30vw; min-width: 100px; }
  }
  /* 一時停止・再生のアイコン（絵文字にならないよう SVG で描く） */
  .ico { display: inline-block; width: 11px; height: 11px; vertical-align: middle; fill: currentColor; }
  /* 色選びのパネル（キーストーンをタップ／ダブルクリックすると出る） */
  #colorPop {
    position: fixed; z-index: 20; display: none; padding: 10px; border-radius: 14px;
    background: rgba(24,24,28,0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 10px 34px rgba(0,0,0,0.35);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color: #f2f2f2; touch-action: none;
  }
  #colorPop.open { display: block; }
  #colorPop canvas { display: block; border-radius: 8px; cursor: crosshair; touch-action: none; }
  #colorPop .hue { margin-top: 8px; border-radius: 6px; }
  #colorPop .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  #colorPop .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.9); flex: 0 0 auto; }
  #colorPop .hex { font: 12px ui-monospace, Menlo, monospace; color: rgba(255,255,255,0.7); flex: 1 1 auto; }
  #colorPop button { padding: 6px 12px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.08); color: #f2f2f2; font-size: 12.5px; cursor: pointer; }
  /* タッチ端末：画面の下からせり出すシート。幅いっぱいの大きな面と太い色相の帯で、指で編集しやすく */
  #colorPop.sheetMode {
    display: block; left: 0 !important; right: 0; top: auto !important; bottom: 0;
    padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); border-radius: 18px 18px 0 0;
    border-bottom: 0; transform: translateY(105%); transition: transform 0.24s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  #colorPop.sheetMode.open { transform: translateY(0); pointer-events: auto; }
  #colorPop .grab { display: none; width: 40px; height: 5px; border-radius: 3px; margin: 0 auto 10px;
    background: rgba(255,255,255,0.28); }
  #colorPop.sheetMode .grab { display: block; }
  #colorPop.sheetMode canvas { margin-left: auto; margin-right: auto; }
  #colorPop.sheetMode .hue { margin-top: 12px; border-radius: 10px; }
  #colorPop.sheetMode .row { margin-top: 12px; gap: 12px; }
  #colorPop.sheetMode .sw { width: 34px; height: 34px; }
  #colorPop.sheetMode .hex { font-size: 14px; }
  #colorPop.sheetMode button { padding: 10px 20px; font-size: 14px; border-radius: 11px; }
  /* 補間方式スイッチ（サークル上部）とモーダル */
  #modeSwitch {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 13;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 22px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.26); color: #f2f2f2;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    font-size: 14px; line-height: 1; cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #modeSwitch:hover { background: rgba(255,255,255,0.18); }
  #modeSwitch .caret { font-size: 10px; opacity: 0.75; }
  body.narrowLayout #modeSwitch { font-size: 12px; padding: 8px 13px; max-width: 82vw; overflow: hidden; }

  #modeModal {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: rgba(0,0,0,0.62);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  #modeModal.open { display: flex; }
  #modeModal .sheet {
    display: flex; flex-direction: column; gap: 8px;
    padding: 22px; border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 16px 60px rgba(0,0,0,0.5);
    max-height: 86vh; overflow-y: auto; min-width: 280px;
  }
  #modeModal h3 {
    margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.55); font-weight: 600; text-align: center;
  }
  #modeModal button {
    padding: 14px 20px; border-radius: 12px; text-align: left;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.07); color: #f2f2f2;
    font-size: 15px; line-height: 1.2; cursor: pointer; white-space: nowrap;
  }
  #modeModal button:hover { background: rgba(255,255,255,0.2); }
  #modeModal button.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  #fsBtn {
    position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); z-index: 12;
    display: flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 24px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28); color: #fff;
    font-size: 15px; line-height: 1; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  #fsBtn:hover { background: rgba(255,255,255,0.2); }
  body.narrowLayout #fsBtn { padding: 9px 15px; font-size: 13px; }
  #infoBtn {
    position: fixed; top: 14px; right: 14px; z-index: 12;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(15,15,18,0.55); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28); color: #fff;
    font: italic bold 19px Georgia, "Times New Roman", serif;
    cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #infoBtn:hover { background: rgba(255,255,255,0.22); }
  #infoPanel {
    position: fixed; inset: 0; z-index: 30; display: none;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; overflow-y: auto; cursor: pointer;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  #infoPanel .inner {
    max-width: 700px; margin: 5vh auto 8vh; padding: 30px 34px 40px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 22px; box-shadow: 0 12px 60px rgba(0,0,0,0.45);
    cursor: auto;
  }
  #infoPanel h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: 0.06em; font-weight: 600; }
  #infoPanel .sub { font-size: 12px; color: rgba(255,255,255,0.55); margin: 0 0 18px; }
  #infoPanel h3 {
    font-size: 14px; margin: 24px 0 8px; color: #cfe6ff;
    letter-spacing: 0.08em; font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.14); padding-bottom: 6px;
  }
  #infoPanel ul { padding-left: 1.3em; margin: 6px 0; }
  #infoPanel li { font-size: 13.5px; line-height: 1.95; color: rgba(255,255,255,0.92); margin: 2px 0; }
  #infoPanel b { color: #fff; font-weight: 600; }
  #infoPanel a { color: #cfe6ff; text-decoration: underline; text-underline-offset: 2px; }
  #infoPanel .refs li { font-size: 12.5px; line-height: 1.75; }
  #infoPanel .closeHint { text-align: center; font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 26px; }
  #infoPanel .wakeStatus {
    font-size: 13.5px; line-height: 1.8; margin: 8px 0; padding: 8px 12px; border-radius: 10px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
  }
  #infoPanel .wakeStatus.warn { background: rgba(255,170,60,0.16); border-color: rgba(255,190,100,0.5); }
  /* スリープを防げない環境への案内：フルスクリーンにしたとき、画面の下端に小さく出す。5秒で消える（× でも閉じる） */
  #wakeNotice {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 8px); z-index: 40;
    display: flex; align-items: center; gap: 10px; box-sizing: border-box; max-width: calc(100vw - 24px);
    padding: 8px 8px 8px 12px; border-radius: 14px;
    background: rgba(24,24,28,0.82); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 30px rgba(0,0,0,0.28);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; font-size: 12.5px; line-height: 1.5; color: #e8e8e8;
    opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
  }
  #wakeNotice.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  #wakeNotice .bang {
    flex: none; width: 20px; height: 20px; border-radius: 50%; background: #f0b44c; color: #1a1306;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
  }
  #wakeNotice .txt { flex: 1 1 auto; }
  #wakeNotice .x {
    flex: none; width: 28px; height: 28px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(255,255,255,0.1); color: #f2f2f2; font-size: 15px; line-height: 1;
  }
  #wakeNotice .x:hover { background: rgba(255,255,255,0.2); }
  /* ---- 画面分割（親ページ）：タイムラインを iframe で並べる。
     枠は分割の木（hostRoot）から計算した矩形に絶対配置する（iframe は DOM 上で移動すると再読み込みされるため、入れ子にしない） ---- */
  #panes { position: fixed; inset: 0; background: #000; overflow: hidden; }
  #panes .pane { position: absolute; overflow: hidden; }
  #panes iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
  .splitBtn, .paneClose {
    position: absolute; z-index: 25; padding: 0;
    background: rgba(15,15,18,0.5); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.26); color: #fff;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; line-height: 1;
    cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  .splitBtn:hover, .paneClose:hover { background: rgba(255,255,255,0.3); }
  /* ＋は各枠の四辺の中央に貼りつくタブ。押した側に、その枠を二分して複製を置く */
  .splitBtn { font-size: 18px; font-weight: 300; opacity: 0.75; }
  .splitBtn:hover { opacity: 1; }
  .splitBtn.sL, .splitBtn.sR { top: 50%; transform: translateY(-50%); width: 22px; height: 56px; }
  .splitBtn.sT, .splitBtn.sB { left: 50%; transform: translateX(-50%); width: 56px; height: 20px; }
  .splitBtn.sL { left: 0; border-radius: 0 12px 12px 0; border-left: 0; }
  .splitBtn.sR { right: 0; border-radius: 12px 0 0 12px; border-right: 0; }
  .splitBtn.sT { top: 0; border-radius: 0 0 12px 12px; border-top: 0; }
  .splitBtn.sB { bottom: 0; border-radius: 12px 12px 0 0; border-bottom: 0; }
  .paneClose { top: 26px; left: 12px; width: 32px; height: 32px; border-radius: 50%; font-size: 17px; display: none; }
  body.multi .paneClose { display: block; }
  /* 分割中は、ポインタを置いた（タッチでは触れた）枠の＋と×だけを出す。境界に＋が2つ並ばないように */
  .splitBtn, .paneClose { transition: opacity 0.18s; }
  body.multi .pane:not(.active) .splitBtn, body.multi .pane:not(.active) .paneClose { opacity: 0; pointer-events: none; }
  body.playing .splitBtn, body.playing .paneClose { display: none; }
  .pane.picking .splitBtn, .pane.picking .paneClose { display: none; }   /* 色選びのシートを開いている枠 */
  /* 分割の境界：ドラッグで比率を変える（ダブルクリックで半々に戻す）。つまみは境界の1/4の位置（中央は＋が使う） */
  .paneDivider { position: fixed; z-index: 24; touch-action: none; }
  .paneDivider.dv { cursor: col-resize; }
  .paneDivider.dh { cursor: row-resize; }
  .paneDivider::after {
    content: ''; position: absolute; border-radius: 2px;
    background: rgba(255,255,255,0.6); box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
  }
  .paneDivider.dv::after { left: 7px; top: 25%; width: 4px; height: 52px; transform: translateY(-50%); }
  .paneDivider.dh::after { top: 7px; left: 25%; height: 4px; width: 52px; transform: translateX(-50%); }
  .paneDivider:hover::after, .paneDivider.drag::after { background: #fff; }
  body.playing .paneDivider { display: none; }
  /* 共通バー（親）：補間方式・フルスクリーン・境界グラデーション（分割中だけ）・ヘルプを、全タイムライン共通で1つずつ */
  #hostBar {
    position: fixed; top: 26px; left: 0; right: 0; margin: 0 auto; width: max-content; z-index: 26;
    display: none; align-items: center; justify-content: center; gap: 8px;
    flex-wrap: nowrap; max-width: calc(100vw - 16px); white-space: nowrap;
  }
  body.host #hostBar { display: flex; }
  body.host:not(.multi) #blendBtn, body.host:not(.multi) #blendW { display: none !important; }
  /* 細い画面では文字を省いてアイコンだけにし、1段に収める */
  #hostBar #modeSwitchLabel { overflow: hidden; text-overflow: ellipsis; max-width: 13em; }
  @media (max-width: 600px) {
    #hostBar { gap: 6px; }
    #hostBar #modeSwitch { padding: 8px 12px; font-size: 12.5px; }
    #hostBar #modeSwitchLabel { max-width: 8.5em; }
    #hostBar #fsBtn { padding: 8px 11px; }
    #hostBar #fsBtn .lbl, #blendBtn .lbl2 { display: none; }
    #blendBtn, #globalBtn { padding: 8px 12px; font-size: 12.5px; }
    #blendW { width: 56px; }
  }
  body.playing #hostBar { display: none; }
  body.host #modeSwitch, body.host #fsBtn, body.host #infoBtn { position: static; transform: none; }
  body.host #fsBtn { padding: 9px 16px; font-size: 14px; }
  #blendBtn, #globalBtn {
    padding: 9px 16px; border-radius: 22px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.26); color: #f2f2f2;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    font-size: 14px; line-height: 1; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #blendBtn:hover, #globalBtn:hover { background: rgba(255,255,255,0.18); }
  #blendBtn.active, #globalBtn.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  #blendW { width: 80px; accent-color: #f5f5f5; display: none; }
  body.multi #blendBtn.active + #blendW { display: block; }
  /* 全体の色（分割中だけ）：HDR輝度と知覚明度統一を、全部の枠へまとめて適用する */
  #globalBtn { display: none; }
  body.host.multi #globalBtn { display: block; }
  body.host:not(.multi) #globalPop { display: none !important; }
  #globalPop {
    position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100vw - 16px); z-index: 27;
    display: none; flex-direction: column; align-items: stretch; box-sizing: border-box;
    padding: 4px 14px; border-radius: 16px;
    background: rgba(24,24,28,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 30px rgba(0,0,0,0.28);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color: #f2f2f2;
  }
  #globalPop.open { display: flex; }
  body.playing #globalPop { display: none !important; }
  #globalPop > .bar {
    position: static; transform: none; justify-content: center; flex-wrap: wrap;
    background: none; border: 0; border-radius: 0; box-shadow: none; padding: 9px 0;
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  #globalPop > .bar + .bar { border-top: 1px solid rgba(255,255,255,0.09); }
  #globalPop .lumaInfo { width: 30px; height: 30px; min-height: 0; padding: 0; border-radius: 50%; font-style: italic; font-weight: 700; font-family: Georgia, serif; }
  #globalPop .lumaHelp { display: none; max-width: 400px; padding: 4px 2px 10px; border-top: 1px solid rgba(255,255,255,0.09); font-size: 12.5px; line-height: 1.65; color: #d8d8d8; }
  #globalPop .lumaHelp.open { display: block; }
  #globalPop .lumaHelp p { margin: 8px 0 0; }
  #globalPop .lumaHelp b { color: #fff; }
  /* 子ページ側：分割中は色の段（HDR輝度・明度統一）を親の「全体の色」に任せる */
  body.paneMulti #colorBar { display: none !important; }
  /* ---- 子ページ側：共通バーがあるとき（shared）は、そこに任せるボタンを隠す ---- */
  body.shared #modeSwitch, body.shared #fsBtn, body.shared #infoBtn { display: none !important; }
  /* ---- 子ページ側：細い枠の簡略表示（compact）。リング＋秒数＋一時停止だけを出し、残りは「⋯」で開く ---- */
  #moreBtn {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 12; display: none;
    width: 38px; height: 38px; border-radius: 50%; padding: 0;
    background: rgba(15,15,18,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);

<body>
<canvas id="gpu"></canvas>
<canvas id="blend2d" width="96" height="96"></canvas>
<div id="errbox"></div>
<script>
/* =========================================================
   光のグラデーション・タイムライン（HDR対応 / 三段フォールバック）
   第一段 WebGPU + extended tone mapping … 真のHDR（白を超える光）
   第二段 Display P3 … 広色域SDR（CSS背景）
   第三段 sRGB … 通常表示
   起動時に能力検出して最良の一つを選ぶ。補間ロジックは全段共通。
   ========================================================= */

/* ---------------- 基本の道具 ----------------
   ライブラリには頼らない。描画は Canvas 2D、部品は DOM、入力は Pointer Events（マウスとタッチを1つの仕組みで扱う）、
   全画面の色は WebGPU（HDR）か CSS。ここには、そのために使う小さな数学関数とキャンバスの状態を置く */
const PI = Math.PI, TWO_PI = Math.PI * 2, HALF_PI = Math.PI / 2, QUARTER_PI = Math.PI / 4;

// 色の文字列（a は 0..255）
function rgba(r, g, b, a) {
  return 'rgba(' + Math.round(constrain(r, 0, 255)) + ',' + Math.round(constrain(g, 0, 255)) + ',' + Math.round(constrain(b, 0, 255)) + ',' + (a === undefined ? 1 : constrain(a / 255, 0, 1)) + ')';

    return 'color(display-p3 ' + (constrain(r, 0, 255) / 255).toFixed(4) + ' ' + (constrain(g, 0, 255) / 255).toFixed(4) + ' ' +
      (constrain(b, 0, 255) / 255).toFixed(4) + ' / ' + (a === undefined ? 1 : constrain(a / 255, 0, 1)).toFixed(3) + ')';
  }

// HDR の描画では、リングの色の帯と色点の色を WebGPU で背景と同じ明るさの基準（線形×HDR輝度）で描く。

const RING_N = 360, RING_MAXP = 48;
let ringGpu = null;

// 四角の位置・大きさはこの枠の座標（px）。枠をまたぐ四角は、それぞれの枠が自分の中の部分を描く
let gcheck = { on: false, gray: 0, x: 0, y: 0, s: 0 };
function gcheckOn() { return gcheck.on && paneMulti; }
function drawGlobalCheck() {
  if (!gcheckOn() || (renderer && renderer.kind === 'HDR')) { return; }   // HDR はシェーダが描く
  ctx.fillStyle = rgba(gcheck.gray, gcheck.gray, gcheck.gray);
  ctx.fillRect(gcheck.x - gcheck.s / 2, gcheck.y - gcheck.s / 2, gcheck.s, gcheck.s);
}   // { cx, cy, R, band（画素）, lut: Float32Array(RING_N*4), pts: [[x, y, 半径, 不透明度, r, g, b]] }
function gpuRing() { return !!(renderer && renderer.kind === 'HDR' && renderer.ring); }
function hdrEnc(r, g, b) {
  return [encExt(s2l(constrain(r, 0, 255) / 255) * hdrGain), encExt(s2l(constrain(g, 0, 255) / 255) * hdrGain), encExt(s2l(constrain(b, 0, 255) / 255) * hdrGain)];

function disc(x, y, d, style) { ctx.fillStyle = style; ctx.beginPath(); ctx.arc(x, y, d / 2, 0, TWO_PI); ctx.fill(); }
function ringLine(x, y, d, style, w) { ctx.strokeStyle = style; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, d / 2, 0, TWO_PI); ctx.stroke(); }
function seg(x0, y0, x1, y1, style, w) { ctx.strokeStyle = style; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); }
function polyline(pts, style, w) {
  ctx.strokeStyle = style; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.beginPath();
  pts.forEach(function (q, i) { if (i === 0) { ctx.moveTo(q[0], q[1]); } else { ctx.lineTo(q[0], q[1]); } });
  ctx.closePath(); ctx.stroke();
}
// DOM の部品を作る小さな道具：el('button', { id, cls, html, text, title, parent, attrs, style, on: { click: fn } })
function el(tag, o) {
  let e = document.createElement(tag);
  o = o || {};
  if (o.id) { e.id = o.id; }
  if (o.cls) { e.className = o.cls; }
  if (o.html !== undefined) { e.innerHTML = o.html; }
  if (o.text !== undefined) { e.textContent = o.text; }
  if (o.title) { e.title = o.title; e.setAttribute('aria-label', o.title); }
  if (o.attrs) { for (let k in o.attrs) { e.setAttribute(k, o.attrs[k]); } }
  if (o.style) { for (let k in o.style) { e.style[k] = o.style[k]; } }
  if (o.on) { for (let k in o.on) { e.addEventListener(k, o.on[k]); } }
  (o.parent || document.body).appendChild(e);

window.addEventListener('error', function (ev) {
  var b = document.getElementById('errbox');
  b.style.display = 'block';
  b.textContent = 'JSエラー: ' + ev.message + '\n' + (ev.filename || '') + ' : ' + ev.lineno;

// 役割：親（HOST）＝画面分割の管理だけを行う／子（PANE）＝iframe内でタイムライン1つを動かす
// 通常の起動は親で、親が最初の子を1つ作る。file:// でも動くよう、親子のやり取りは postMessage のみ
const IS_PANE = new URLSearchParams(location.search).has('pane') && window.parent !== window;
const IS_HOST = !IS_PANE;
let hostPanes = [], hostStateWaiters = {}, hostReqId = 0;
let gainSlider = null;
let reversed = false, revBtn = null;       // 回転（読み取り）方向の逆転。false＝時計回り
let sharedUI = false, moreBtn = null, miniPause = null, sheetEl = null, panelEl = null;
// キーストーンの出し分け。paneMulti＝2つ以上に分割中、paneActive＝親が選んだ枠（タッチ端末で使う）、
// pointerIn＝マウスがこの枠の上にある。keyA＝色点の見え方、ringA＝白い輪の見え方（0..1、なめらかに追う）
let paneMulti = false, paneActive = true, pointerIn = false, keyA = 0, ringA = 0;
let tapSwallow = false;

let baseR = 0, baseCy = 0, liftGoal = null, sheetT = 0;   // タッチ：キーストーンが隠れている枠への最初の一触りは、枠を選ぶだけにする      // 子：分割中は方式・フルスクリーン・ヘルプを親の共通バーに任せる
// 境界グラデーション。子：隣の現在色（線形×ゲイン）を受け取り、枠の端へ向けて混ぜる
// nb[側] ＝ その辺に接する隣の枠の並び。各要素 { a0, a1：辺の上での区間（0..1）, c：現在色 }
let blendOn = false, blendWidth = 1, nb = { L: [], R: [], T: [], B: [] };
// 4枠が集まる角：cornerOn[角] ＝ その角に4枠が集まっているか、diag[角] ＝ 対角の枠の現在色
let cornerOn = { TL: false, TR: false, BL: false, BR: false }, diag = { TL: null, TR: null, BL: null, BR: null };
let topInset = 0;                          // 子：上端に親の共通バーがあるとき、そのぶん下げる量
let hostRoot = null, hostDividers = [];    // 親：分割の木（葉＝枠、節＝左右または上下の二分割と比率）
const NO_HDR = /[?&]nohdr\b/.test(location.search);
const NO_HALO = !/[?&]halo=1\b/.test(location.search);   // リングの光の縁（影）は既定でなし。?halo=1 で付ける
   // 検証用：HDRを使わず P3／sRGB の経路で描く
let hostBar = null, blendBtn = null;

let points = [];
let mode = 'oklabLin';       // step | hsb | rgbLight | rgbValue | oklch | oklabLin | cielch | cielabLin
let loopDur = 12;
let hdrGain = 1.6;          // HDR時の輝度倍率（SDR白=1.0を超える持ち上げ）
let t0 = 0, paused = false, pausedAt = 0;   // t0・pausedAt は clockMs() の時刻（全枠で共通の絶対時刻 ms）
// 今のコマの時刻。描画中は全枠で同じ値（下の tick() が画面更新ごとに決める）、それ以外は今の時刻
let frameClock = null;
function clockMs() { return frameClock !== null ? frameClock : performance.timeOrigin + performance.now(); }

let cx, cy, R, hitR = 24, isCoarse = false;
/* リングまわりの寸法（ここを変えれば見た目を調整できる）
   それぞれ [リング半径 R に掛ける係数, 最小, 最大]（px）。大きい画面では最大で頭打ち、小さい枠では R に比例して細く小さくなる */
const RING_STYLE = {
  band:      [0.07,  5, 18],   // 帯（色の帯）の太さ
  point:     [0.075, 6, 13],   // 色点の半径
  pointTouch: 4,               // タッチ端末で色点の半径に足す量（最大も同じだけ上がる）
  tick:      [0.06,  5, 12],   // 針が帯の外側へはみ出す長さ
  knob:      [0.045, 6, 11],   // 針先のつまみの直径
  hit:       [0.10, 14, 24],   // 色点・つまみの当たり判定の半径（マウス）
  hitTouch:  [0.15, 22, 36]    // 同（タッチ）

let rd = { band: 18, point: 13, tick: 12, knob: 11, hit: 24 };   // 今の R で計算した寸法（ringDims() が更新）
function ringDims() {
  function f(a, add) { return Math.max(a[1], Math.min(a[2] + (add || 0), R * a[0] + (add || 0))); }
  let t = isCoarse ? RING_STYLE.pointTouch : 0;
  rd = {
    band: f(RING_STYLE.band), point: f(RING_STYLE.point, t), tick: f(RING_STYLE.tick),
    knob: f(RING_STYLE.knob), hit: f(isCoarse ? RING_STYLE.hitTouch : RING_STYLE.hit)

function ringReach() { return R + rd.band / 2 + rd.tick + rd.knob / 2; }
let dragIdx = -1, dragDelete = false, pressX = 0, pressY = 0, movedFar = false;
let lastTapT = -99999, lastTapX = 0, lastTapY = 0;
let dragPlayhead = false;
let dragXYIdx = -1, dragXY_Y = 0;   // xy図上の色点ドラッグ
let playMode = false, playHintT = 0, wasFs = false;

let renderer = null;        // {kind, draw(rgb)}
let pickTarget = -1;
let lumaSnapshot = null;     // 輝度統一前の色スナップショット（元に戻す用）
let showLumaCheck = false;   // 輝度検証：中央にグレー基準面を表示
let showXY = false;          // xy色度図の表示
let xyBuf = null, xyBufKey = '';
let infoBtn = null, infoPanel = null;
let isNarrow = false;
let modeSwitch = null, modeModal = null;
let modalModeBtns = {};

  ['ステップ切替', 'step'],
  ['HSB色相回転', 'hsb'],
  ['RGB中間混色（光量平均）', 'rgbLight'],
  ['RGB中間混色（画素値平均）', 'rgbValue'],
  ['OKLab 色相回転', 'oklch'],
  ['OKLab 中間混色', 'oklabLin'],
  ['CIELab 色相回転', 'cielch'],
  ['CIELab 中間混色', 'cielabLin']
];
let fsBtn = null;
let wakeLock = null;          // WakeLockSentinel（保持中のみ非null）
let wakeState = 'pending';    // pending | on | unsupported | failed
let wakeRequesting = false, wakeNotice = null;
let timeBar, colorBar, viewBar, pauseBtn, durNum, durSlider, gainWrap, restoreBtn = null, checkBtn, xyBtn;

/* ---------------- 起動と配置 ---------------- */
function setup() {
  if (IS_HOST) {
    buildHost();
    initWakeLock();
    registerServiceWorker();

  }

  // P3 の画面では、リングのキャンバスも P3 にする（背景と同じく、色点の値を P3 の座標として描くため）
  try { ctx = cnv.getContext('2d', p3Capable() ? { colorSpace: 'display-p3' } : undefined); } catch (e) { ctx = null; }
  if (!ctx) { ctx = cnv.getContext('2d'); }

  sizeRingCanvas();
  layout();

  // 初期値：光の三原色（赤・緑・青）
  points.push({ ang: -HALF_PI,                r: 255, g: 0,   b: 0   });
  points.push({ ang: -HALF_PI + TWO_PI / 3,   r: 0,   g: 255, b: 0   });
  points.push({ ang: -HALF_PI + TWO_PI * 2/3, r: 0,   g: 0,   b: 255 });

  isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  ringDims();

  buildUI();
  initWakeLock();
  t0 = clockMs();
  initPaneMessaging();

  // レンダラを検出・初期化（非同期）。決まるまではsRGBで暫定描画
  renderer = makeCssRenderer(false);

  // ディスプレイ環境の変化（HDR⇄SDRモニタ間の移動、表示モード変更）を監視して
  // レンダラとHDRスライダーの表示を動的に追従させる
  if (window.matchMedia) {
    try {
      const mq = window.matchMedia('(dynamic-range: high)');
      if (mq.addEventListener) { mq.addEventListener('change', refreshRenderer); }
      else if (mq.addListener) { mq.addListener(refreshRenderer); }
    } catch (e) { /* 監視非対応環境では初回判定のみ */ }
  }

  bindInput();
  window.addEventListener('resize', windowResized);
  // 同じページの枠（iframe）は同じ画面更新で rAF が呼ばれ、時刻もそろう。それを 30 コマ/秒の刻みに丸めて描く。
  // 全枠が同じ時刻で自分と隣の色を計算するので、境界の両側で色がずれない（以前は隣の色が1〜2コマ遅れて届き、境界に段差が出た）
  const TICK_MS = 1000 / 30;
  let lastTick = -1;
  (function tick(ts) {
    requestAnimationFrame(tick);
    if (ts === undefined) { return; }
    let k = Math.floor((performance.timeOrigin + ts) / TICK_MS);
    if (k === lastTick) { return; }
    lastTick = k;
    frameClock = k * TICK_MS;

}

function showErr(err) {
  var b = document.getElementById('errbox');
  b.style.display = 'block';
  b.textContent = 'エラー: ' + (err && err.message ? err.message : String(err)) + '\n' + (err && err.stack ? err.stack.split('\n')[1] : '');
}

// 簡略表示にする条件：分割中で、枠が細いか低いとき
function isCompact() { return sharedUI && (window.innerWidth <= 820 || window.innerHeight <= 700); }
// 簡略表示の時間バーの上端。上辺の＋タブ（20px）と共通バーを避け、細い枠では左上の×の下へ逃がす
// ごく小さい枠：幅が 320px 未満か、パネル（時間の段だけ）の上に収まるリングの半径が 60 未満のとき
function isMini() {
  if (!isCompact()) { return false; }
  let m = 27, A = topInset + 26 + m + 6, B = height - 26 - 58 - 10 - m;
  return width < 320 || Math.min(width / 2 - 22 - m, (B - A) / 2) < 60;
}
function layout() {
  cx = width / 2; cy = height / 2;
  let mini = isMini();
  document.body.classList.toggle('compact', isCompact());
  document.body.classList.toggle('mini', mini);
  syncSheet();
  if (mini) {
    // 上端は＋タブと針のつまみ、下端は＋タブ・⏸⋯の列・つまみのぶん空けて、収まる最大のリング。左右も＋タブを避ける。
    // つまみまでの長さは R で変わるので、小さい枠の寸法（最小値）で見積もる
    let m = RING_STYLE.band[1] / 2 + RING_STYLE.tick[1] + RING_STYLE.knob[1] / 2 + 2;
    let A = topInset + 26 + m, B = height - 26 - 38 - 8 - m;
    R = Math.max(14, Math.min(width / 2 - 22 - m, (B - A) / 2));
    cy = (A + B) / 2;
  } else {
    // 上の共通バー（topInset）と下の操作パネルのあいだに、針のつまみ（m）ごと収まる最大のリング。
    // パネルの高さは開いている段の数で変わるので、実際の高さを測る（ResizeObserver が測り直しを呼ぶ）
    let ph = (panelEl && panelEl.offsetHeight) || 58, m = 27;
    let A = topInset + 26 + m + 6, B = height - 26 - ph - 10 - m;
    R = Math.max(30, Math.min(min(width, height) * 0.38, width / 2 - 22 - m, (B - A) / 2));
    cy = (A + B) / 2;
  }
  ringDims();
  baseR = R; baseCy = cy;   // シートで持ち上げる前の位置（draw() が sheetT に応じて動かす）
  placeBars();
}

// UIをサークルの外周と画面縁の中間に、上下対称・左右中央で均等配置する
function placeBars() {
  if (playMode) { return; }
  // すべてのバーが生成済みでなければ何もしない（setup途中の呼び出しで落ちるのを防ぐ）
  if (!timeBar || !viewBar || !colorBar || !panelEl) { return; }
  // ごく小さい枠：リングの下に ⏸ と ⋯ を並べる（バーはシートの中か、隠れている）
  if (document.body.classList.contains('mini')) {
    // シートを開いているあいだは、列を枠の下端へ寄せる（シートの中身と重ならないように）
    let ry = document.body.classList.contains('moreOpen') ? height - 38 - 10 : Math.round(Math.min(ringReach() + cy + 6, height - 26 - 38));
    if (moreBtn) { moreBtn.style.top = ry + 'px'; moreBtn.style.left = Math.round(cx + 23) + 'px'; }
    if (miniPause) { miniPause.style.top = ry + 'px'; miniPause.style.left = Math.round(cx - 23) + 'px'; }
    return;
  }
  // それ以外：時間・観察・色はリングの下の操作パネル（CSS で下端中央に固定）にまとめてある
}

function windowResized() { if (IS_HOST) { return; } sizeRingCanvas(); layout(); resizeGpu(); applyResponsive(); }

function resizeGpu() {
  let g = document.getElementById('gpu');
  if (renderer && renderer.kind === 'HDR') {
    let dpr = window.devicePixelRatio || 1;
    g.width = Math.floor(window.innerWidth * dpr);
    g.height = Math.floor(window.innerHeight * dpr);
  }
}

function getPhase() {
  let now = paused ? pausedAt : clockMs();
  let p = ((now - t0) / 1000) / loopDur;
  if (reversed) { p = -p; }
  return p - Math.floor(p);
}
// 位相（0..1、円周上の位置）を直接指定する。回転方向によらず同じ位置になる
function setPhase(ph) {
  let now = paused ? pausedAt : clockMs();
  t0 = now - (reversed ? (1 - ph) : ph) * loopDur * 1000;
}
// 回転方向を逆にする（針の位置はそのまま、進む向きだけ変わる）
function setReversed(v) {
  let ph = getPhase();
  reversed = !!v;
  setPhase(ph);
  if (revBtn) {
    revBtn.textContent = reversed ? '\u21ba' : '\u21bb';
    revBtn.classList.toggle('active', reversed);
  }
}

/* ---------------- ループ ---------------- */
function draw() {
  if (IS_HOST) { return; }
  let fs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  if (fs !== wasFs) { sizeRingCanvas(); layout(); resizeGpu(); wasFs = fs; }
  // 分割で枠の幅が変わったとき、resize イベントが遅れて届くことがあるので、描画のたびに実寸と照合する
  if (width !== window.innerWidth || height !== window.innerHeight) { windowResized(); }
  liftRing();

  let sorted = sortPoints();
  let a = getPhase() * TWO_PI - HALF_PI;
  let cur = sampleAt(a, sorted);

  // 境界グラデーション中は、自分のタイムラインの設定が変わったときだけ、親経由で隣へ知らせる。
  // 隣はそれを使って、同じコマの時刻で自分の色を計算する（evalSpec）。隣の色もここで今のコマの時刻で計算する
  // 分割中は、境界グラデーションがなくても設定を送る（親が全体の輝度検証のグレーを計算するのに使う）
  if (blendOn || paneMulti) {
    let sp = JSON.stringify(mySpec());
    if (sp !== lastSpecSent) { lastSpecSent = sp; toHost({ type: 'spec', spec: JSON.parse(sp) }); }
  }
  if (blendOn) {
    EDGE_SIDES.forEach(function (k) { nb[k].forEach(function (sg) { sg.c = evalSpec(sg.spec); }); });
    EDGE_CORNERS.forEach(function (c) { diag[c] = evalSpec(diagSpec[c]); });
  }

  // リングのキャンバスは透明に消してから描く（背景の色はレンダラが担当）
  // 先に 2D を描く：HDR のときは、リングの帯と色点の色（ringGpu）をここで集めて、同じコマのレンダラへ渡す
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, width, height);
  ringGpu = null;
  drawGlobalCheck();
  if (playMode) {
    if (showLumaCheck && !gcheckOn()) { drawLumaCheck(); }
  } else {
    setHalo(cur);
    drawRing(sorted);
    drawPlayhead(a);
    drawPoints();
    if (showLumaCheck && !gcheckOn()) { drawLumaCheck(); }
    if (showXY) { drawXYDiagram(sorted, cur); }
  }

  // 現在色を選ばれたレンダラで画面全体に描く
  // エラーのときは、このコマは描かずに（前のコマの色のまま）準備し直す。すぐに別の方式へは落とさない
  try {
    renderer.draw(cur);
    rendererFails = 0;
  } catch (e) {
    onRenderError(e);
  }
}

/* ---------------- 共通ロジック ---------------- */
function wrapAng(x) { return ((x % TWO_PI) + TWO_PI) % TWO_PI; }

function sortPoints(pts) {
  pts = pts || points;
  let arr = [];
  for (let i = 0; i < pts.length; i++) { arr.push({ i: i, a: wrapAng(pts[i].ang) }); }
  arr.sort(function (x, y) { return x.a - y.a; });
  return arr;
}

function sampleAt(angle, sorted, pts) {
  pts = pts || points;
  let A = wrapAng(angle), n = sorted.length;
  if (n === 1) { let p = pts[sorted[0].i]; return [p.r, p.g, p.b]; }
  let idx = -1;
  for (let k = 0; k < n; k++) { if (sorted[k].a <= A) { idx = k; } }
  let cur, nxt;
  if (idx === -1) { cur = sorted[n - 1]; nxt = sorted[0]; }
  else { cur = sorted[idx]; nxt = sorted[(idx + 1) % n]; }
  let span = wrapAng(nxt.a - cur.a);
  if (span === 0) { span = TWO_PI; }
  let f = wrapAng(A - cur.a) / span;
  return interp(pts[cur.i], pts[nxt.i], f);
}

function interp(pa, pb, f) {
  if (mode === 'step') { return [pa.r, pa.g, pa.b]; }
  if (mode === 'rgbLight') {
    return [
      l2s(lerp(s2l(pa.r/255), s2l(pb.r/255), f)) * 255,
      l2s(lerp(s2l(pa.g/255), s2l(pb.g/255), f)) * 255,
      l2s(lerp(s2l(pa.b/255), s2l(pb.b/255), f)) * 255
    ];
  }
  if (mode === 'rgbValue') { return [lerp(pa.r, pb.r, f), lerp(pa.g, pb.g, f), lerp(pa.b, pb.b, f)]; }
  if (mode === 'hsb') {
    let A = rgb2hsv(pa.r, pa.g, pa.b), B = rgb2hsv(pb.r, pb.g, pb.b);
    // 無彩色（S≈0）の色相は「無力」(CSS Color 4)：相手の色相を引き継ぐ
    if (A[1] < 1e-4) { A[0] = B[0]; }
    if (B[1] < 1e-4) { B[0] = A[0]; }
    let dh = ((B[0] - A[0] + 540) % 360) - 180;
    return hsv2rgb(A[0] + dh * f, lerp(A[1], B[1], f), lerp(A[2], B[2], f));
  }
  if (mode === 'oklabLin') {
    // OKLab空間上の直線補間（中間混色的：補色間は無彩軸近くを通る）
    let A = rgb2oklab(pa.r, pa.g, pa.b), B = rgb2oklab(pb.r, pb.g, pb.b);
    return oklab2rgb(lerp(A[0], B[0], f), lerp(A[1], B[1], f), lerp(A[2], B[2], f));
  }
  if (mode === 'cielabLin') {
    // CIELab空間上の直線補間
    let A = rgb2lab(pa.r, pa.g, pa.b), B = rgb2lab(pb.r, pb.g, pb.b);
    return lab2rgb(lerp(A[0], B[0], f), lerp(A[1], B[1], f), lerp(A[2], B[2], f));
  }
  if (mode === 'cielch') {
    let A = rgb2lch(pa.r, pa.g, pa.b), B = rgb2lch(pb.r, pb.g, pb.b);
    if (A[1] < 0.5) { A[2] = B[2]; }   // 無力色相の修正（C*スケールに合わせたε）
    if (B[1] < 0.5) { B[2] = A[2]; }
    let dh = ((B[2] - A[2] + 540) % 360) - 180;
    return lch2rgb(lerp(A[0], B[0], f), lerp(A[1], B[1], f), A[2] + dh * f);
  }
  // oklch（色相回転）
  let A = rgb2oklch(pa.r, pa.g, pa.b);
  let B = rgb2oklch(pb.r, pb.g, pb.b);
  if (A[1] < 0.002) { A[2] = B[2]; }   // 無力色相の修正
  if (B[1] < 0.002) { B[2] = A[2]; }
  let dh = ((B[2] - A[2] + 540) % 360) - 180;
  return oklch2rgb(lerp(A[0], B[0], f), lerp(A[1], B[1], f), A[2] + dh * f);
}

function s2l(c) { return c <= 0.04045 ? c / 12.92 : pow((c + 0.055) / 1.055, 2.4); }
function l2s(c) { c = constrain(c, 0, 1); return c <= 0.0031308 ? 12.92 * c : 1.055 * pow(c, 1 / 2.4) - 0.055; }

function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  let mx = max(r, g, b), mn = min(r, g, b), d = mx - mn, h = 0;
  if (d !== 0) {
    if (mx === r) { h = ((g - b) / d) % 6; }
    else if (mx === g) { h = (b - r) / d + 2; }
    else { h = (r - g) / d + 4; }
    h *= 60; if (h < 0) { h += 360; }
  }
  return [h, mx === 0 ? 0 : d / mx, mx];
}
function hsv2rgb(h, s, v) {
  h = ((h % 360) + 360) % 360;
  let c = v * s, x = c * (1 - abs((h / 60) % 2 - 1)), m = v - c, r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; }
  else if (h < 180) { g = c; b = x; } else if (h < 240) { g = x; b = c; }
  else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}

/* ---- CIELab / CIELCh (D65) ---- */
function rgb2xyz(r, g, b) {
  let R = s2l(r / 255), G = s2l(g / 255), B = s2l(b / 255);
  let X = (0.4124564 * R + 0.3575761 * G + 0.1804375 * B) * 100;
  let Y = (0.2126729 * R + 0.7151522 * G + 0.0721750 * B) * 100;
  let Z = (0.0193339 * R + 0.1191920 * G + 0.9503041 * B) * 100;
  return [X, Y, Z];
}
function fLab(t) { return t > 0.008856 ? Math.cbrt(t) : (7.787 * t + 16 / 116); }
function finvLab(t) { let t3 = t * t * t; return t3 > 0.008856 ? t3 : (t - 16 / 116) / 7.787; }
function rgb2lab(r, g, b) {
  let xyz = rgb2xyz(r, g, b);
  let fx = fLab(xyz[0] / 95.047), fy = fLab(xyz[1] / 100.0), fz = fLab(xyz[2] / 108.883);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
function lab2rgb(L, A, B) {
  let fy = (L + 16) / 116, fx = fy + A / 500, fz = fy - B / 200;
  let X = 95.047 * finvLab(fx) / 100, Y = 100.0 * finvLab(fy) / 100, Z = 108.883 * finvLab(fz) / 100;
  let R = 3.2404542 * X - 1.5371385 * Y - 0.4985314 * Z;
  let G = -0.9692660 * X + 1.8760108 * Y + 0.0415560 * Z;
  let B2 = 0.0556434 * X - 0.2040259 * Y + 1.0572252 * Z;
  return [l2s(R) * 255, l2s(G) * 255, l2s(B2) * 255];
}
function rgb2lch(r, g, b) {
  let lab = rgb2lab(r, g, b);
  let C = sqrt(lab[1] * lab[1] + lab[2] * lab[2]);
  let h = atan2(lab[2], lab[1]) * 180 / PI; if (h < 0) { h += 360; }
  return [lab[0], C, h];
}
function lch2rgb(L, C, h) {
  return lab2rgb(L, C * cos(h * PI / 180), C * sin(h * PI / 180));
}

function rgb2oklab(r, g, b) {
  let R = s2l(r/255), G = s2l(g/255), B = s2l(b/255);
  let l = 0.4122214708*R + 0.5363325363*G + 0.0514459929*B;
  let m = 0.2119034982*R + 0.6806995451*G + 0.1073969566*B;
  let s = 0.0883024619*R + 0.2817188376*G + 0.6299787005*B;
  let l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
  return [
    0.2104542553*l_ + 0.7936177850*m_ - 0.0040720468*s_,
    1.9779984951*l_ - 2.4285922050*m_ + 0.4505937099*s_,
    0.0259040371*l_ + 0.7827717662*m_ - 0.8086757660*s_
  ];
}
function oklab2rgb(L, a, b) {
  let l_ = L + 0.3963377774*a + 0.2158037573*b;
  let m_ = L - 0.1055613458*a - 0.0638541728*b;
  let s_ = L - 0.0894841775*a - 1.2914855480*b;
  let l = l_*l_*l_, m = m_*m_*m_, s = s_*s_*s_;
  let R = 4.0767416621*l - 3.3077115913*m + 0.2309699292*s;
  let G = -1.2684380046*l + 2.6097574011*m - 0.3413193965*s;
  let B = -0.0041960863*l - 0.7034186147*m + 1.7076147010*s;
  return [l2s(R) * 255, l2s(G) * 255, l2s(B) * 255];
}
function rgb2oklch(r, g, b) {
  let o = rgb2oklab(r, g, b);
  let C = sqrt(o[1]*o[1] + o[2]*o[2]);
  let h = atan2(o[2], o[1]) * 180 / PI; if (h < 0) { h += 360; }
  return [o[0], C, h];
}
function oklch2rgb(L, C, h) { return oklab2rgb(L, C * cos(h*PI/180), C * sin(h*PI/180)); }

// 拡張sRGBエンコード：1.0を超える値にも同じ伝達関数を延長して適用
function encExt(v) {
  v = Math.max(v, 0);
  return v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
}

function hexToRgb(hx) {
  hx = hx.replace('#', '');
  return [parseInt(hx.substr(0,2),16), parseInt(hx.substr(2,2),16), parseInt(hx.substr(4,2),16)];
}
function hex2(n) { let s = Math.round(constrain(n, 0, 255)).toString(16); return s.length < 2 ? '0' + s : s; }

/* ---------------- 隣の枠のタイムライン ----------------
   隣の色は送ってもらわず、隣のタイムラインの設定（色点・秒数・位相の起点・一時停止・向き・ゲイン）から、
   自分の描画と同じコマの時刻で計算する。補間方式は全枠共通 */
let lastSpecSent = '', diagSpec = { TL: null, TR: null, BL: null, BR: null };
let tjs = { L: [], R: [], T: [], B: [] };   // T字の交点（親から）：辺ごとに [位置, 手前の隣の長さ, 奥の隣の長さ]
function mySpec() {
  return {
    pts: points.map(function (q) { return [q.ang, q.r, q.g, q.b]; }),
    dur: loopDur, t0: t0, paused: paused, pausedAt: pausedAt, rev: reversed, gain: outGain()
  };
}
function evalSpec(sp) {
  if (!sp || !Array.isArray(sp.pts) || sp.pts.length < 1) { return null; }
  if (!sp._pts) {
    sp._pts = sp.pts.map(function (a) { return { ang: +a[0], r: +a[1], g: +a[2], b: +a[3] }; });
    sp._sorted = sortPoints(sp._pts);
  }
  let now = sp.paused ? sp.pausedAt : clockMs();
  let p = ((now - sp.t0) / 1000) / sp.dur;
  if (sp.rev) { p = -p; }
  p -= Math.floor(p);
  let c = sampleAt(p * TWO_PI - HALF_PI, sp._sorted, sp._pts);
  return { r: c[0], g: c[1], b: c[2], gain: +sp.gain || 1 };
}

/* ---------------- 境界グラデーション ----------------
   隣り合う枠の現在色どうしを、選択中の補間方式（全枠共通）で空間的につなぐ。左右にも上下にも働く。
   枠の中央＝自分の色（補間の f=0）、境界＝ちょうど中間（f=0.5）、その先は隣の枠が引き継ぐ。
   両側の枠が同じ2色・同じ方式で計算するので、境界で色が一致する（隣の色は1フレーム遅れで届く）。
   幅 blendWidth=1 で枠の中央まで、小さいほど境界付近だけ。ステップ切替は補間しないので、境界は切り替わったまま。
   方式ごとの道筋は曲がるので、EDGE_N 区間の表（線形×ゲイン）にしてレンダラへ渡し、表のあいだは光量で線形補間する。

   T字の境界（1つの辺に複数の枠が接する）：辺の区間ごとに相手を替え、相手ごとの表を持つ。
   区間の切り替わり目は、境界から離れるほど幅広くぼかす（ぼかしの半幅＝境界からの距離、45°の扇形）。
   境界の上ではぼかし幅0なので、各区間で相手の枠と色が一致する。3つの枠が出会う1点だけは不連続になる */
const EDGE_N = 32;
const EDGE_MAXS = 8;                     // 1辺あたりの相手の上限（超えた辺はつながない）
const EDGE_SIDES = ['L', 'R', 'T', 'B'];
const EDGE_FAR = 1e6;                    // 辺の両端の区間は外側へ無限に延ばす（端でぼかさない）
const EDGE_CN = 33;                      // 角の面の表の一辺の点数
const EDGE_CORNERS = ['TL', 'TR', 'BL', 'BR'];   // 並び順＝ (右なら+1) + (下なら+2)
function outGain() { return (renderer && renderer.kind === 'HDR') ? hdrGain : 1; }

/* 4枠が集まる角（中間混色の4方式だけ）
   中間混色はその色空間での直線補間なので、角に集まる4色を同じ空間で双線形に混ぜる面を張れる。
   自分 P・左右の隣 H・上下の隣 V・対角 D、kx, ky（0＝境界、1＝帯の外）で
     c = P + (1-kx)/2 (H-P) + (1-ky)/2 (V-P) + (1-kx)(1-ky)/4 (D-H-V+P)
   角（0,0）は4色の平均、左右の境界上（kx=0）は P と H の中点から伸びる線＝隣と同じ、
   帯の外側（kx=1 や ky=1）は1辺だけの表と同じになる。色相回転系は回る向きが4色で決まらないので使わない */
const LIN_SPACES = {
  rgbValue:  [function (c) { return [c.r, c.g, c.b]; }, function (v) { return v; }],
  rgbLight:  [function (c) { return [s2l(c.r / 255), s2l(c.g / 255), s2l(c.b / 255)]; },
              function (v) { return [l2s(v[0]) * 255, l2s(v[1]) * 255, l2s(v[2]) * 255]; }],
  oklabLin:  [function (c) { return rgb2oklab(c.r, c.g, c.b); }, function (v) { return oklab2rgb(v[0], v[1], v[2]); }],
  cielabLin: [function (c) { return rgb2lab(c.r, c.g, c.b); }, function (v) { return lab2rgb(v[0], v[1], v[2]); }]
};
// 角の面の表（線形×ゲイン）。並びは [ky の段][kx の列]
function cornerLut(P, H, V, D, gP) {
  let sp = LIN_SPACES[mode], f = sp[0];
  let p = f(P), h = f(H), v = f(V), d = f(D);
  let out = new Float32Array(EDGE_CN * EDGE_CN * 4), k = 0;
  for (let jy = 0; jy < EDGE_CN; jy++) {
    let ay = (1 - jy / (EDGE_CN - 1)) / 2;
    for (let jx = 0; jx < EDGE_CN; jx++) {
      let ax = (1 - jx / (EDGE_CN - 1)) / 2, axy = ax * ay;
      let q = [0, 1, 2].map(function (i) { return p[i] + ax * (h[i] - p[i]) + ay * (v[i] - p[i]) + axy * (d[i] - h[i] - v[i] + p[i]); });
      let g = gP + ax * (H.gain - gP) + ay * (V.gain - gP) + axy * (D.gain - H.gain - V.gain + gP);
      let c = sp[1](q);
      out[k++] = s2l(constrain(c[0], 0, 255) / 255) * g;

// 帯の中の位置 k（0＝境界、1＝帯の外）のなだらかな終わり方。f(k) = 2k − k²
// 帯の端（k=1）で傾きが0になるので、グラデーションが急に途切れて線に見える（マッハバンド）ことがない。
// 境界（k=0）では値も傾きも左右対称のままなので、隣の枠とは傾きまでなめらかにつながる。WGSL 側にも同じ式がある
function edgeEase(k) { return k * (2 - k); }

// 隣り合う区間の重みの和は 1 になる。WGSL 側にも同じ式がある
function edgeSegW(pos, a0, a1, h) {
  return constrain((pos - a0 + h) / (2 * h), 0, 1) - constrain((pos - a1 + h) / (2 * h), 0, 1);

// 左右と上下の両方が効く隅の合成の重み。kx, ky は 0＝境界、1＝帯の外。

// 非HDR用：枠内の位置 (x,y)（0..1）の色（線形）を表から求める。W, H は枠の画素数。WGSL の fs と同じ計算

  // T字の交点の近く（隣の枠の帯の幅の内側）では、その交点の面を使う。交点がある辺は区間をぼかさない（面がつなぐ）

        if (kk < 1) { return cornerAt(d <= 0 ? t.lutL : t.lutR, kk, k); }
      }

      if (w > 0) { let c = at(list[i].lut, k); acc[0] += c[0] * w; acc[1] += c[1] * w; acc[2] += c[2] * w; ws += w; }

  let tj = luts.tj || {};
  let ch = side(x > 0.5 ? luts.R : luts.L, kx, y, Math.max(ex * W / H, 1e-6), x > 0.5 ? tj.R : tj.L);
  let cv = side(y > 0.5 ? luts.B : luts.T, ky, x, Math.max(ey * H / W, 1e-6), y > 0.5 ? tj.B : tj.T);
  if (!ch && !cv) { return self; }
  let w = (ch && cv) ? edgeWeights(kx, ky) : [1, 1];
  let out = [self[0], self[1], self[2]];
  for (let i = 0; i < 3; i++) {
    if (ch) { out[i] += (ch[i] - self[i]) * w[0]; }
    if (cv) { out[i] += (cv[i] - self[i]) * w[1]; }
  }
  // 4枠が集まる角：角側の端の区間に入っているぶんだけ（重み wH・wV）、角の面に置き換える
  let ck = (y > 0.5 ? 'B' : 'T') + (x > 0.5 ? 'R' : 'L');
  let cl = luts.corners && luts.corners[ck];
  if (cl && ch && cv) {
    let hl = x > 0.5 ? luts.R : luts.L, vl = y > 0.5 ? luts.B : luts.T;
    let hs = y > 0.5 ? hl[hl.length - 1] : hl[0], vs = x > 0.5 ? vl[vl.length - 1] : vl[0];
    let wc = edgeSegW(y, hs.a0, hs.a1, Math.max(ex * W / H, 1e-6)) * edgeSegW(x, vs.a0, vs.a1, Math.max(ey * H / W, 1e-6));
    let pc = cornerAt(cl, kx, ky);
    for (let i = 0; i < 3; i++) { out[i] += (pc[i] - out[i]) * wc; }

}
// 角の面の表を (kx, ky) で双線形に引く。WGSL 側の cornerAt と同じ
function cornerAt(t, kx, ky) {
  let N = EDGE_CN - 1, px = kx * N, py = ky * N;
  let ix = Math.min(Math.floor(px), N - 1), iy = Math.min(Math.floor(py), N - 1), fx = px - ix, fy = py - iy;
  let a = (iy * EDGE_CN + ix) * 4, b = a + 4, c = a + EDGE_CN * 4, d = c + 4, out = [0, 0, 0];

    let top = t[a + i] + (t[b + i] - t[a + i]) * fx, bot = t[c + i] + (t[d + i] - t[c + i]) * fx;
    out[i] = top + (bot - top) * fy;
  }
  return out;
}

/* ---------------- レンダラ検出 ---------------- */
// ヘルプの「表示」の行。HDR：白を超える光まで出せる／P3広色域／sRGB
function setDispKind(kind, note) {
  let el = document.getElementById('dispKind');
  if (!el) { return; }
  el.textContent = '表示：' + (kind === 'HDR' ? 'HDR（SDRの白を超える光まで出せます）' : kind === 'P3広色域' ? 'P3広色域（HDRではありません）' : 'sRGB（HDRではありません）') + (note || '');
}

/* 描画の方式（HDR／P3広色域／sRGB）
   同じ色の値でも、方式が違うと画面への出方（明るさ・色域の解釈）が違う。分割中に枠ごとに方式が食い違うと、
   境界に段差が出る（iPad で見えた「うっすらした線」）。そこで：
   ・各枠は自分の出せる方式（naturalKind）を親へ知らせ、親が全枠の最低の方式（allowedKind）を決めて配る。
     各枠は min(自分の方式, allowedKind) で描く
   ・描画中のエラーや GPU が失われたときは、すぐに通常の表示へ落とさず、まず WebGPU を準備し直す
     （何度も続けて失敗したときだけ、出せる方式を下げて親へ知らせる） */
const KIND_RANK = { 'sRGB': 0, 'P3広色域': 1, 'HDR': 2 };
let naturalKind = null, allowedKind = 'HDR', rendererFails = 0, reinitTimer = null, hdrBroken = false;
function p3Capable() {
  return !!(window.matchMedia && window.matchMedia('(color-gamut: p3)').matches && window.CSS && CSS.supports('color', 'color(display-p3 1 1 1)'));
}
function useRenderer(r) {
  // 親が許す方式より上なら、許す方式の CSS 表示にそろえる
  if (IS_PANE && KIND_RANK[r.kind] > KIND_RANK[allowedKind]) { r = makeCssRenderer(allowedKind === 'P3広色域'); }
  renderer = r;
  if (gainWrap) { gainWrap.style.display = r.kind === 'HDR' ? 'flex' : 'none'; }
  setDispKind(r.kind);
  resizeGpu();
}
function refreshRenderer() {
  detectAndInitRenderer().then(function (r) {
    naturalKind = r.kind;
    useRenderer(r);
    if (IS_PANE) { toHost({ type: 'kind', kind: naturalKind }); }
  }).catch(function (e) { showErr(e); });
}
// 描画のエラー：少し待って準備し直す。続けて 4 回失敗したら、HDR をあきらめて出せる方式を下げる
function onRenderError(e) {
  rendererFails++;
  if (rendererFails >= 4) {
    hdrBroken = true;
    let r = makeCssRenderer(p3Capable());
    naturalKind = r.kind;
    useRenderer(r);
    if (IS_PANE) { toHost({ type: 'kind', kind: naturalKind }); }
    return;
  }
  if (!reinitTimer) { reinitTimer = setTimeout(function () { reinitTimer = null; refreshRenderer(); }, 250 * rendererFails); }
}

async function detectAndInitRenderer() {
  // ディスプレイ（現在の表示環境）が実際にHDRを表示できるかを最初に判定。
  // WebGPUのHDR設定はSDRディスプレイでも「成功」してしまう（出力が頭打ちになるだけ）ため、
  // dynamic-range メディアクエリでの能力判定が必須。
  const hdrDisplay = !!(window.matchMedia && window.matchMedia('(dynamic-range: high)').matches);
  if (hdrDisplay && navigator.gpu && !NO_HDR && !hdrBroken) {
    try {
      const adapter = await navigator.gpu.requestAdapter();
      if (adapter) {
        const device = await adapter.requestDevice();
        // GPU が失われたら（端末の都合で手放されたなど）準備し直す
        device.lost.then(function () { if (renderer && renderer.device === device) { onRenderError(new Error('device lost')); } });
        const canvas = document.getElementById('gpu');
        const ctx = canvas.getContext('webgpu');
        // HDRには16bit float形式が必須（8bit unormは1.0で頭打ち＝HDRにならない）
        const format = 'rgba16float';
        ctx.configure({ device, format, alphaMode: 'opaque', toneMapping: { mode: 'extended' }, colorSpace: 'srgb' });
        canvas.style.display = 'block';
        return makeWebGPURenderer(device, ctx, format);
      }
    } catch (e) { /* 次段へ */ }
  }
  const p3 = !!(window.matchMedia && window.matchMedia('(color-gamut: p3)').matches
    && window.CSS && CSS.supports('color', 'color(display-p3 1 1 1)'));
  return makeCssRenderer(p3);
}

function makeCssRenderer(wide) {
  document.getElementById('gpu').style.display = 'none';
  // 境界グラデーション用の小さなキャンバス（全面に引き伸ばして表示）。P3時は従来どおり符号値をP3座標として扱う
  const bc = document.getElementById('blend2d');
  const BW = bc.width, BH = bc.height;
  let bctx = null, img = null;
  try { bctx = bc.getContext('2d', wide ? { colorSpace: 'display-p3' } : undefined); } catch (e) { bctx = bc.getContext('2d'); }
  try { img = wide ? bctx.createImageData(BW, BH, { colorSpace: 'display-p3' }) : bctx.createImageData(BW, BH); }
  catch (e) { img = bctx.createImageData(BW, BH); }
  return {
    kind: wide ? 'P3広色域' : 'sRGB',
    draw: function (rgb) {
      let r = constrain(rgb[0], 0, 255), g = constrain(rgb[1], 0, 255), b = constrain(rgb[2], 0, 255);
      if (wide) {
        document.body.style.backgroundColor = 'color(display-p3 ' + (r/255).toFixed(4) + ' ' + (g/255).toFixed(4) + ' ' + (b/255).toFixed(4) + ')';
      } else {
        document.body.style.backgroundColor = 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
      }
      let luts = edgeLuts(rgb);
      if (!luts) {
        if (bc.style.display !== 'none') { bc.style.display = 'none'; }
        return;
      }
      let self = [s2l(r / 255), s2l(g / 255), s2l(b / 255)], d = img.data, k = 0;
      for (let j = 0; j < BH; j++) {
        for (let i = 0; i < BW; i++) {
          // 端の画素がちょうど境界（0 と 1）になるように取る
          let c = edgeColorAt(i / (BW - 1), j / (BH - 1), self, luts, window.innerWidth, window.innerHeight);
          d[k++] = Math.round(l2s(constrain(c[0], 0, 1)) * 255);
          d[k++] = Math.round(l2s(constrain(c[1], 0, 1)) * 255);
          d[k++] = Math.round(l2s(constrain(c[2], 0, 1)) * 255);
          d[k++] = 255;
        }
      }
      bctx.putImageData(img, 0, 0);
      if (bc.style.display !== 'block') { bc.style.display = 'block'; }
    }
  };
}

function makeWebGPURenderer(device, ctx, format) {

    '  bg : vec4<f32>,\n' +

    '  flags : vec4<f32>,\n' +
    '  size : vec4<f32>,\n' +     // xy：キャンバスの画素数
    '  en : vec4<f32>,\n' +       // 各辺の区間の数（x左 y右 z上 w下）
    '  lself : vec4<f32>,\n' +    // 自分の光（線形×ゲイン）
    '  cflag : vec4<f32>,\n' +    // 4枠が集まる角の面の有無（x左上 y右上 z左下 w右下）

    '    if (w > 0.0) {\n' +
    '      let k0 = clamp(abs(d) * 2.0 / (u.flags.w * w), 0.0, 1.0);\n' +
    '      let kk = k0 * (2.0 - k0);\n' +
    '      if (kk < 1.0) { return vec4<f32>(cornerAt(4u + (s * ' + (EDGE_MAXS - 1) + 'u + j) * 2u + q, kk, k), 1.0); }\n' +
    '    }\n' +
    '  }\n' +
    '  if (nt > 0u) { h = 0.000001; }\n' +
    '  var acc = vec3<f32>(0.0); var ws = 0.0;\n' +
    '  for (var i = 0u; i < ' + EDGE_MAXS + 'u; i = i + 1u) {\n' +
    '    if (i >= n) { break; }\n' +
    '    let id = s * ' + EDGE_MAXS + 'u + i;\n' +
    '    let sg = u.seg[id];\n' +
    '    let w = segW(pos, sg, h);\n' +
    '    if (w > 0.0) { acc = acc + lutAt(id * ' + (EDGE_N + 1) + 'u, k) * w; ws = ws + w; }\n' +
    '  }\n' +
    '  return vec4<f32>(acc, ws);\n' +
    '}\n' +
    'fn enc(v0 : vec3<f32>) -> vec3<f32> {\n' +   // 拡張sRGBエンコード（JS側の encExt と同じ）
    '  let v = max(v0, vec3<f32>(0.0));\n' +
    '  return select(12.92 * v, 1.055 * pow(v, vec3<f32>(1.0 / 2.4)) - 0.055, v > vec3<f32>(0.0031308));\n' +
    '}\n' +
    '@vertex fn vs(@builtin(vertex_index) i : u32) -> @builtin(position) vec4<f32> {\n' +
    '  var p = array<vec2<f32>, 3>(vec2<f32>(-1.0,-3.0), vec2<f32>(-1.0,1.0), vec2<f32>(3.0,1.0));\n' +
    '  return vec4<f32>(p[i], 0.0, 1.0);\n' +
    '}\n' +
    // リングの帯と色点（HDR のとき）。2D のリングと同じ場所・同じ太さで、背景の上に重ねる（縁は 1px でなめらかに）
    '@fragment fn fs(@builtin(position) fc : vec4<f32>) -> @location(0) vec4<f32> {\n' +
    '  var c = bgAt(fc);\n' +
    '  if (u.rflag.x > 0.5) {\n' +
    '    let d = fc.xy - u.ring.xy;\n' +
    '    let r = length(d);\n' +
    '    let cov = clamp(u.ring.w - abs(r - u.ring.z) + 0.5, 0.0, 1.0);\n' +
    '    if (cov > 0.0) {\n' +
    '      var a = atan2(d.y, d.x); if (a < 0.0) { a = a + 6.28318530718; }\n' +
    '      let p = a / 6.28318530718 * ' + RING_N + '.0;\n' +
    '      let i0 = u32(floor(p)) % ' + RING_N + 'u; let i1 = (i0 + 1u) % ' + RING_N + 'u;\n' +
    '      let rc = mix(cl[RB + i0].rgb, cl[RB + i1].rgb, p - floor(p));\n' +
    '      c = vec4<f32>(mix(c.rgb, rc, cov), 1.0);\n' +
    '    }\n' +
    '    let np = u32(u.rflag.y);\n' +
    '    for (var i = 0u; i < ' + RING_MAXP + 'u; i = i + 1u) {\n' +
    '      if (i >= np) { break; }\n' +
    '      let q0 = cl[PB + i * 2u]; let q1 = cl[PB + i * 2u + 1u];\n' +
    '      let cv = clamp(q0.z - length(fc.xy - q0.xy) + 0.5, 0.0, 1.0) * q0.w;\n' +
    '      if (cv > 0.0) { c = vec4<f32>(mix(c.rgb, q1.rgb, cv), 1.0); }\n' +
    '    }\n' +
    '  }\n' +
    '  return c;\n' +
    '}\n' +
    'fn bgAt(fc : vec4<f32>) -> vec4<f32> {\n' +
    '  if (u.flags.x > 0.5) {\n' +
    '    let d = abs(fc.xy - u.rect.xy);\n' +
    '    if (d.x <= u.rect.z && d.y <= u.rect.w) { return u.gray; }\n' +
    '  }\n' +
    '  if (u.flags.y > 0.5) {\n' +                       // 境界グラデーション（JS側の edgeColorAt と同じ計算）
    '    let x = fc.x / u.size.x;\n' +                   // 0..1（枠の左端→右端）
    '    let y = fc.y / u.size.y;\n' +                   // 0..1（上端→下端）
    '    let ex = min(x, 1.0 - x); let ey = min(y, 1.0 - y);\n' +
    '    let kx0 = clamp(ex * 2.0 / u.flags.w, 0.0, 1.0);\n' +   // 0=境界, 1=帯の外
    '    let ky0 = clamp(ey * 2.0 / u.flags.w, 0.0, 1.0);\n' +
    '    let kx = kx0 * (2.0 - kx0); let ky = ky0 * (2.0 - ky0);\n' +   // なだらかな終わり方（JS側の edgeEase と同じ）
    '    var hs = 0u; if (x > 0.5) { hs = 1u; }\n' +
    '    var vs = 2u; if (y > 0.5) { vs = 3u; }\n' +
    '    let hh = max(ex * u.size.x / u.size.y, 0.000001); let hv = max(ey * u.size.y / u.size.x, 0.000001);\n' +
    '    let nh = u32(u.en[hs]); let nv = u32(u.en[vs]);\n' +
    '    let ch = sideCol(hs, nh, kx, y, hh);\n' +
    '    let cv = sideCol(vs, nv, ky, x, hv);\n' +
    '    let hOn = ch.w > 0.000001; let vOn = cv.w > 0.000001;\n' +
    '    if (hOn || vOn) {\n' +
    '      let me = u.lself.rgb;\n' +
    '      var wh = 1.0; var wv = 1.0;\n' +
    '      if (hOn && vOn) {\n' +
    '        let a = (1.0 - kx) * ky; let b = (1.0 - ky) * kx; let d = a + b;\n' +
    '        if (d > 0.00001) { wh = a / d; wv = b / d; } else { wh = 0.5; wv = 0.5; }\n' +
    '      }\n' +
    '      var c = me;\n' +
    '      if (hOn) { c = c + (ch.rgb / ch.w - me) * wh; }\n' +
    '      if (vOn) { c = c + (cv.rgb / cv.w - me) * wv; }\n' +
    '      var ci = 0u; if (x > 0.5) { ci = ci + 1u; } if (y > 0.5) { ci = ci + 2u; }\n' +
    '      if (hOn && vOn && u.cflag[ci] > 0.5) {\n' +     // 4枠が集まる角の面
    '        var ih = 0u; if (y > 0.5) { ih = nh - 1u; }\n' +
    '        var iv = 0u; if (x > 0.5) { iv = nv - 1u; }\n' +
    '        let wc = segW(y, u.seg[hs * ' + EDGE_MAXS + 'u + ih], hh) * segW(x, u.seg[vs * ' + EDGE_MAXS + 'u + iv], hv);\n' +
    '        c = c + (cornerAt(ci, kx, ky) - c) * wc;\n' +
    '      }\n' +
    '      return vec4<f32>(enc(c), 1.0);\n' +
    '    }\n' +
    '  }\n' +
    '  return u.bg;\n' +
    '}\n'
  });
  const UB_SEG = 36, UB_LUT = UB_SEG + 4 * EDGE_MAXS * 4, UB_TJ = UB_LUT + 4 * EDGE_MAXS * (EDGE_N + 1) * 4;
  // 面の表：4つの角 ＋ T字の交点（辺ごとに EDGE_MAXS−1 個 × 左右の2面）
  const CL_COUNT = 4 + 4 * (EDGE_MAXS - 1) * 2, CL_ONE = EDGE_CN * EDGE_CN * 4;
  const CL_FLOATS = CL_COUNT * CL_ONE + (RING_N + RING_MAXP * 2) * 4;
  const cornerBuf = device.createBuffer({ size: CL_FLOATS * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const UB_RING = UB_TJ + 4 * (EDGE_MAXS - 1) * 4;
  const UB_FLOATS = UB_RING + 8;
  const uniformBuf = device.createBuffer({ size: UB_FLOATS * 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const bgl = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
    { binding: 1, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'read-only-storage' } }
  ] });
  const bindGroup = device.createBindGroup({ layout: bgl, entries: [
    { binding: 0, resource: { buffer: uniformBuf } },
    { binding: 1, resource: { buffer: cornerBuf } }
  ] });
  const pipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
    vertex: { module: shader, entryPoint: 'vs' },
    fragment: { module: shader, entryPoint: 'fs', targets: [{ format: format }] },
    primitive: { topology: 'triangle-list' }
  });
  resizeGpu();
  return {
    kind: 'HDR',
    device: device,
    ring: true,
    draw: function (rgb) {
      // 背景：線形値をhdrGain倍で持ち上げ（グレーと同一スケール＝輝度比較が正しく成立）
      let lr = s2l(constrain(rgb[0], 0, 255) / 255);
      let lg = s2l(constrain(rgb[1], 0, 255) / 255);
      let lb = s2l(constrain(rgb[2], 0, 255) / 255);
      let bgR = encExt(lr * hdrGain), bgG = encExt(lg * hdrGain), bgB = encExt(lb * hdrGain);

      let gR = 0, gG = 0, gB = 0, showGray = 0.0, rcx = 0, rcy = 0, rhw = 0, rhh = 0;
      const gpu = document.getElementById('gpu');
      if (gcheckOn()) {
        // 全体の輝度検証が出ている間は、そちらを優先（四角は1つだけ描ける）
        showGray = 1.0;
        let gv = encExt(s2l(constrain(gcheck.gray, 0, 255) / 255) * hdrGain);
        gR = gv; gG = gv; gB = gv;
        let dpr = window.devicePixelRatio || 1;
        rcx = gcheck.x * dpr; rcy = gcheck.y * dpr; rhw = rhh = gcheck.s / 2 * dpr;
      } else if (showLumaCheck) {
        showGray = 1.0;
        let gg = grayForMode();  // [0..255] のSDRグレー（R=G=B）
        // グレーは正規化せず、背景と同じ線形スケール(hdrGain倍)で素直に持ち上げる
        let gl = s2l(constrain(gg[0], 0, 255) / 255) * hdrGain;
        let gv = encExt(gl);
        gR = gv; gG = gv; gB = gv;
        let glay = grayLayout();
        let dpr = window.devicePixelRatio || 1;
        rcx = cx * dpr; rcy = glay[1] * dpr; rhw = (glay[0] / 2) * dpr; rhh = (glay[0] / 2) * dpr;
      }
      let luts = edgeLuts(rgb);
      const data = new Float32Array(UB_FLOATS);
      data.set([
        bgR, bgG, bgB, 1.0,
        gR, gG, gB, 1.0,
        rcx, rcy, rhw, rhh,
        showGray, luts ? 1.0 : 0.0, 0.0, blendWidth,
        Math.max(1, gpu.width), Math.max(1, gpu.height), 0.0, 0.0,
        luts ? luts.L.length : 0, luts ? luts.R.length : 0, luts ? luts.T.length : 0, luts ? luts.B.length : 0,
        lr * hdrGain, lg * hdrGain, lb * hdrGain, 1.0,
        (luts && luts.corners.TL) ? 1 : 0, (luts && luts.corners.TR) ? 1 : 0, (luts && luts.corners.BL) ? 1 : 0, (luts && luts.corners.BR) ? 1 : 0,
        luts ? luts.tj.L.length : 0, luts ? luts.tj.R.length : 0, luts ? luts.tj.T.length : 0, luts ? luts.tj.B.length : 0
      ], 0);
      if (luts) {
        EDGE_SIDES.forEach(function (k, si) {
          luts.tj[k].forEach(function (t, j) {
            let id = si * (EDGE_MAXS - 1) + j;
            data.set([t.pos, t.wp, t.wn, 0], UB_TJ + id * 4);
            device.queue.writeBuffer(cornerBuf, (4 + id * 2) * CL_ONE * 4, t.lutL);
            device.queue.writeBuffer(cornerBuf, (4 + id * 2 + 1) * CL_ONE * 4, t.lutR);
          });
        });
      }
      if (luts) {
        EDGE_CORNERS.forEach(function (c, ci) {
          if (luts.corners[c]) { device.queue.writeBuffer(cornerBuf, ci * EDGE_CN * EDGE_CN * 16, luts.corners[c]); }
        });
      }
      if (luts) {
        EDGE_SIDES.forEach(function (k, si) {
          luts[k].forEach(function (sg, i) {
            let id = si * EDGE_MAXS + i;
            data.set([sg.a0, sg.a1, 0, 0], UB_SEG + id * 4);
            data.set(sg.lut, UB_LUT + id * (EDGE_N + 1) * 4);
          });
        });
      }
      if (ringGpu) {
        data.set([ringGpu.cx, ringGpu.cy, ringGpu.R, ringGpu.band / 2, 1, ringGpu.pts.length, 0, 0], UB_RING);
        device.queue.writeBuffer(cornerBuf, RING_BASE * 16, ringGpu.lut);
        if (ringGpu.pts.length) {
          let pd = new Float32Array(ringGpu.pts.length * 8);
          ringGpu.pts.forEach(function (q, i) { pd.set([q[0], q[1], q[2], q[3], q[4], q[5], q[6], 1], i * 8); });
          device.queue.writeBuffer(cornerBuf, (RING_BASE + RING_N) * 16, pd);
        }
      }
      device.queue.writeBuffer(uniformBuf, 0, data);
      const enc = device.createCommandEncoder();
      const view = ctx.getCurrentTexture().createView();
      const pass = enc.beginRenderPass({ colorAttachments: [{ view: view, loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }] });
      pass.setPipeline(pipeline); pass.setBindGroup(0, bindGroup); pass.draw(3); pass.end();
      device.queue.submit([enc.finish()]);
    }
  };
}

/* リング・色点・針の見た目
   縁取りの線は使わず、柔らかい光の縁（ぼかした影）で背景から浮かせる。
   背景（＝今の光の色）が暗いときは白い光の縁、明るいときは黒い影にして、帯や色点が背景と同じ色でも見分けられるようにする。
   暗い⇄明るいは輝度でなめらかに切り替える（切り替わりの瞬間にちらつかないように） */
let haloT = 0;   // 0＝背景が暗い（白い光の縁）、1＝背景が明るい（黒い影）
function setHalo(rgb) {
  let Y = 0.2126 * s2l(constrain(rgb[0], 0, 255) / 255) + 0.7152 * s2l(constrain(rgb[1], 0, 255) / 255) + 0.0722 * s2l(constrain(rgb[2], 0, 255) / 255);
  let t = constrain((Y - 0.05) / (0.22 - 0.05), 0, 1);
  haloT = t * t * (3 - 2 * t);
}
function haloOn(blur, strength) {
  if (NO_HALO) { return; }
  let k = (strength === undefined) ? 1 : strength;
  let v = Math.round(255 * (1 - haloT)), al = ((1 - haloT) * 0.6 + haloT * 0.45) * k;
  ctx.shadowColor = 'rgba(' + v + ',' + v + ',' + v + ',' + al.toFixed(3) + ')';
  ctx.shadowBlur = blur * dpr;   // shadowBlur は座標変換の影響を受けないので画素の密度を掛ける
  ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
}
function haloOff() { ctx.shadowBlur = 0; ctx.shadowColor = 'rgba(0,0,0,0)'; }

function drawRing(sorted) {
  // 光の縁は、帯の下に1本だけ描いた円から出す（360本の線それぞれに影を付けると重い）
  if (!NO_HALO) {
    haloOn(rd.band * 0.8 + 6);
    ringLine(cx, cy, R * 2, '#000', Math.max(1, rd.band - 1.5));
    haloOff();
  }
  if (gpuRing()) {
    // 色の帯は WebGPU へ。光の縁を描いたときは、帯の場所だけ 2D を透かす
    if (!NO_HALO) {
      ctx.globalCompositeOperation = 'destination-out';
      ringLine(cx, cy, R * 2, '#000', rd.band);
      ctx.globalCompositeOperation = 'source-over';
    }
    let lut = new Float32Array(RING_N * 4);
    for (let k = 0; k < RING_N; k++) {
      let c = sampleAt(k / RING_N * TWO_PI + 0.0001, sorted), e = hdrEnc(c[0], c[1], c[2]);
      lut[k * 4] = e[0]; lut[k * 4 + 1] = e[1]; lut[k * 4 + 2] = e[2]; lut[k * 4 + 3] = 1;
    }
    ringGpu = { cx: cx * dpr, cy: cy * dpr, R: R * dpr, band: rd.band * dpr, lut: lut, pts: [] };
    return;
  }
  let steps = 360;
  ctx.lineWidth = rd.band; ctx.lineCap = 'round';
  for (let k = 0; k < steps; k++) {
    let a0 = k / steps * TWO_PI, a1 = (k + 1.35) / steps * TWO_PI;
    let c = sampleAt(a0 + 0.0001, sorted);
    ctx.strokeStyle = ptCol(c[0], c[1], c[2]);
    ctx.beginPath(); ctx.moveTo(cx + cos(a0) * R, cy + sin(a0) * R); ctx.lineTo(cx + cos(a1) * R, cy + sin(a1) * R); ctx.stroke();
  }
}
function drawPlayhead(a) {
  let L = rd.band / 2 + rd.tick, s = rd.knob / 11;
  let x0 = cx + cos(a) * (R - L), y0 = cy + sin(a) * (R - L);
  let x1 = cx + cos(a) * (R + L), y1 = cy + sin(a) * (R + L);
  haloOn(5 + 3 * s, 0.9);
  seg(x0, y0, x1, y1, '#fff', Math.max(1.5, 2.4 * s));
  // つまみ：マウスはリングに近づいたとき（白い輪と同じ ringA）だけ、タッチは選んでいる枠だけに出す。ほかは線だけ
  updateKeyVisibility();
  let ka = dragPlayhead ? 1 : (isCoarse ? keyA : ringA);
  if (ka > 0) { disc(x1, y1, rd.knob, rgba(255, 255, 255, 255 * ka)); }
  haloOff();
}
// (mx, my) が i 番目のキーストーン（色点）に当たっているか
function keyHit(i, mx, my) {
  let p = points[i];
  return dist(mx, my, cx + cos(p.ang) * R, cy + sin(p.ang) * R) < hitR;
}
/* キーストーン（色点）の出し分け
   マウス：この枠にマウスが入ったら色点だけが現れ、リングの上か内側に来たら白い輪が付く。離れると消えてリングだけになる。
   タッチ（iPhone・iPad）：ホバーがないので常に表示。ただし分割中は、触れた枠（親が選んだ枠）だけ表示し、ほかの枠はリングだけ。
   つかんでいる間は常に表示 */
function updateKeyVisibility() {
  let grab = (dragIdx >= 0 || dragPlayhead);
  let dotT, ringT;
  if (isCoarse) {
    dotT = ringT = (!paneMulti || paneActive || grab) ? 1 : 0;
  } else {
    let near = pointerIn && dist(mouseX, mouseY, cx, cy) < R + rd.band / 2 + rd.point + 8;
    dotT = (pointerIn || grab) ? 1 : 0;
    ringT = (near || grab) ? 1 : 0;
  }
  keyA += (dotT - keyA) * 0.3; ringA += (ringT - ringA) * 0.3;
  if (Math.abs(dotT - keyA) < 0.01) { keyA = dotT; }
  if (Math.abs(ringT - ringA) < 0.01) { ringA = ringT; }
}
function drawPoints() {   // 見え方（keyA・ringA）は drawPlayhead で更新済み
  if (keyA <= 0 && dragIdx < 0) { return; }
  for (let i = 0; i < points.length; i++) {
    let p = points[i];
    let hovered = keyHit(i, mouseX, mouseY);
    let dragging = (i === dragIdx);
    let base = rd.point;
    let rr = (dragging || hovered) ? base * 1.18 : base;
    let ring = Math.max(1.5, rd.point * 0.17);   // キーストーンを囲む白い細い縁
    let x = cx + cos(p.ang) * R, y = cy + sin(p.ang) * R;
    if (dragging && dragDelete) {
      haloOn(rr * 0.9 + 4);
      disc(x, y, (rr + ring) * 2, rgba(255, 90, 90));
      haloOff();
      disc(x, y, rr * 2, ptCol(p.r, p.g, p.b, 110));
      let q = rr * 0.45, w = Math.max(1.5, ring);
      seg(x - q, y - q, x + q, y + q, '#fff', w); seg(x - q, y + q, x + q, y - q, '#fff', w);
      drawOutlinedText('離すと削除', x, y - rr - 16, 13, 255);
    } else {
      // 白い輪（リングに近づいたときだけ）の上に色を置く。つかんでいるときは縁（光の縁）を強く
      let ra = (dragging || hovered) ? 1 : ringA;
      if (ringGpu) {
        // 色は WebGPU で描く。2D は色の場所を透かし（針がかからないように）、白い縁だけを輪で描く
        ctx.globalCompositeOperation = 'destination-out';
        disc(x, y, rr * 2, rgba(0, 0, 0, 255 * keyA));
        ctx.globalCompositeOperation = 'source-over';
        if (ra > 0) {
          haloOn(rr * 0.9 + 4, dragging ? 1.3 : 1);
          ringLine(x, y, (rr + ring * ra / 2) * 2, rgba(255, 255, 255, 255 * ra * keyA), ring * ra);
          haloOff();
        }
        if (ringGpu.pts.length < RING_MAXP) {
          let e = hdrEnc(p.r, p.g, p.b);
          ringGpu.pts.push([x * dpr, y * dpr, rr * dpr, keyA, e[0], e[1], e[2]]);
        }
        continue;
      }
      if (ra > 0) {
        haloOn(rr * 0.9 + 4, dragging ? 1.3 : 1);
        disc(x, y, (rr + ring * ra) * 2, rgba(255, 255, 255, 255 * ra * keyA));
        haloOff();
      }
      disc(x, y, rr * 2, ptCol(p.r, p.g, p.b, 255 * keyA));
    }
  }
}
// 縁取りつきの文字（どんな背景の上でも読めるよう、黒い影の上に白）
function drawOutlinedText(str, x, y, size, al, weight) {
  ctx.font = (weight || 'bold') + ' ' + size + 'px system-ui, -apple-system, "Hiragino Sans", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = rgba(0, 0, 0, al * 0.8); ctx.fillText(str, x + 1, y + 1);
  ctx.fillStyle = rgba(255, 255, 255, al); ctx.fillText(str, x, y);
}

/* ---------------- 操作 ---------------- */
// リングを描くキャンバスへの操作か。色選びの面など、ほかの canvas 要素への操作は含めない

  if (colorPop && colorPop.classList.contains('open')) { closePicker(); tapSwallow = true; return; }
  if (playMode) { exitPlay(); return; }
  pressX = mouseX; pressY = mouseY; movedFar = false;
  dragIdx = -1; dragDelete = false; dragPlayhead = false;
  // 再生ヘッド（針先のノブ）のドラッグ判定は色点より優先
  let pha = getPhase() * TWO_PI - HALF_PI;
  let phx = cx + cos(pha) * (R + rd.band / 2 + rd.tick), phy = cy + sin(pha) * (R + rd.band / 2 + rd.tick);
  if (dist(mouseX, mouseY, phx, phy) < hitR) { dragPlayhead = true; return; }
  // xy色度図の色点ドラッグ（xy図のみ表示のとき）
  dragXYIdx = -1;
  if (showXY && !showLumaCheck) {
    let ly = xyLayout();
    for (let i = 0; i < points.length; i++) {
      let xy = xyFromRgb(points[i].r, points[i].g, points[i].b);
      let X = xyPixX(xy[0], ly[0], ly[2]), Y = xyPixY(xy[1], ly[1], ly[3]);
      if (dist(mouseX, mouseY, X, Y) < Math.max(15, hitR * 0.6)) {
        dragXYIdx = i;
        dragXY_Y = xyzOfPoint(points[i].r, points[i].g, points[i].b)[1] / 100;
        return;

}
function mouseDragged(e) {

    return;

    movedFar = true;
    let ly = xyLayout();
    let x = (mouseX - ly[0]) / ly[2] * 0.8;
    let y = (ly[1] + ly[3] - mouseY) / ly[3] * 0.9;
    x = constrain(x, 0.0, 0.8); y = constrain(y, 0.005, 0.9);

    return;
  }
  if (dist(mouseX, mouseY, pressX, pressY) > 7) { movedFar = true; }
  if (dragIdx < 0 || !movedFar) { return; }

}

  dragIdx = -1; dragDelete = false;

}

function handleTap(x, y) {
  for (let i = 0; i < points.length; i++) {
    let px = cx + cos(points[i].ang) * R, py = cy + sin(points[i].ang) * R;
    if (keyHit(i, x, y)) {

      else { lastTapT = now; lastTapX = x; lastTapY = y; }

  if (abs(d - R) < rd.band / 2 + rd.hit * 0.5 + 4) {   // 帯の上（とその少し外）をタップしたら追加
    let ang = atan2(y - cy, x - cx);
    let c = sampleAt(ang, sortPoints());
    points.push({ ang: ang, r: c[0], g: c[1], b: c[2] });

}

// 入力：Pointer Events でマウスとタッチを同じに扱う。押している1本の指（ポインタ）だけを追う
let activePointer = null;
function bindInput() {
  function setXY(ev) { mouseX = ev.clientX; mouseY = ev.clientY; }
  window.addEventListener('pointermove', setXY, true);   // ホバーの判定（キーストーンの出し分け）にも使う
  cnv.addEventListener('pointerdown', function (ev) {
    if (activePointer !== null) { return; }
    setXY(ev);
    activePointer = ev.pointerId;
    try { cnv.setPointerCapture(ev.pointerId); } catch (err) {}
    mousePressed(ev);
    ev.preventDefault();
  });
  cnv.addEventListener('pointermove', function (ev) {
    if (ev.pointerId !== activePointer) { return; }
    setXY(ev);
    mouseDragged(ev);
  });
  function end(ev) {
    if (ev.pointerId !== activePointer) { return; }
    setXY(ev);
    activePointer = null;
    mouseReleased(ev);
    // タッチは指を離すとホバーの位置が残らないよう、画面の外へ
    if (ev.pointerType !== 'mouse') { mouseX = mouseY = -9999; }
  }
  cnv.addEventListener('pointerup', end);
  cnv.addEventListener('pointercancel', end);

}

// シートの開閉に合わせて、リングを持ち上げる／戻す（シートのせり出しと同じくらいの速さで、少し弾むように）
function liftRing() {
  let open = !!(isCoarse && colorPop && colorPop.classList.contains('open') && liftGoal);
  let goal = open ? 1 : 0;
  if (sheetT === goal && !open) { return; }
  sheetT += (goal - sheetT) * 0.32;
  if (Math.abs(goal - sheetT) < 0.004) { sheetT = goal; }
  let t = sheetT * (1 + 0.12 * Math.sin(Math.PI * sheetT));   // 行き過ぎて戻る、ささやかな弾み
  let g = liftGoal || { R: baseR, cy: baseCy };
  R = baseR + (g.R - baseR) * t;
  cy = baseCy + (g.cy - baseCy) * t;
  ringDims();
  if (sheetT === 0 && !open) { R = baseR; cy = baseCy; ringDims(); liftGoal = null; }
}
// 持ち上げた先（大きさは変えない）：
//  ・シートの上の空きにリング（針のつまみまで）がまるごと入るなら、そこへ移す（もともと入っていればそのまま）
//  ・入らなければ（分割した低い枠など）、編集しているキーストーンとその周りのグラデーションがシートの上に見える所まで持ち上げる。
//    リングの上側は枠の外へ出てもよい
function computeLift(i) {
  let sheetTop = height - colorPop.offsetHeight;
  let m = ringReach() - R + 4, top = topInset + 26, bottom = sheetTop - 10;
  if (baseCy + baseR + m <= bottom) { return { R: baseR, cy: baseCy }; }
  if (2 * (baseR + m) <= bottom - top) { return { R: baseR, cy: (top + bottom) / 2 }; }
  let ky = baseCy + sin(points[i].ang) * baseR;           // キーストーンの高さ（ふだんの位置で）
  let need = ky + rd.point + 28 - bottom;                  // シートの上端から 28px 以上あける
  return { R: baseR, cy: baseCy - Math.max(0, need) };
}

/* 色選びのパネル
   ブラウザ標準の色選び（隠した input type=color をプログラムから開く方式）は iPhone で開かないことがあったので、
   アプリ内のパネルにした：彩度×明度の面（HSB の S・B）と色相の帯。動かすとすぐキーストーンの色が変わる */
let colorPop = null, popSV = null, popHue = null, popSw = null, popHex = null, popHSV = [0, 1, 1];
let POP_W = 176, POP_H = 120, HUE_H = 16;
// 面と帯の大きさ。マウスは小さなパネル、タッチは幅いっぱいのシート（高さは画面の 4 割まで）
function sizePicker() {
  if (isCoarse) {
    POP_W = Math.round(Math.min(width - 32, 520));
    POP_H = Math.round(Math.min(POP_W * 0.56, height * 0.4));
    HUE_H = 34;
  } else { POP_W = 176; POP_H = 120; HUE_H = 16; }
  let dpr = window.devicePixelRatio || 1;
  [[popSV, POP_W, POP_H], [popHue, POP_W, HUE_H]].forEach(function (c) {
    c[0].width = Math.round(c[1] * dpr); c[0].height = Math.round(c[2] * dpr);
    c[0].style.width = c[1] + 'px'; c[0].style.height = c[2] + 'px';
  });
}
function buildColorPop() {
  colorPop = document.createElement('div');
  colorPop.id = 'colorPop';
  if (isCoarse) { colorPop.classList.add('sheetMode'); }
  let grab = document.createElement('div'); grab.className = 'grab';
  colorPop.appendChild(grab);
  popSV = document.createElement('canvas'); popHue = document.createElement('canvas'); popHue.className = 'hue';
  let row = document.createElement('div'); row.className = 'row';
  popSw = document.createElement('span'); popSw.className = 'sw';
  popHex = document.createElement('span'); popHex.className = 'hex';
  let close = document.createElement('button'); close.textContent = '閉じる';
  close.addEventListener('click', closePicker);
  row.appendChild(popSw); row.appendChild(popHex); row.appendChild(close);
  colorPop.appendChild(popSV); colorPop.appendChild(popHue); colorPop.appendChild(row);
  document.body.appendChild(colorPop);

    let on = false;
    el.addEventListener('pointerdown', function (ev) { on = true; try { el.setPointerCapture(ev.pointerId); } catch (e) {} fn(ev); ev.preventDefault(); });
    el.addEventListener('pointermove', function (ev) { if (on) { fn(ev); } });
    el.addEventListener('pointerup', function () { on = false; });
    el.addEventListener('pointercancel', function () { on = false; });
  }
  drag(popSV, function (ev) {
    let r = popSV.getBoundingClientRect();
    popHSV[1] = constrain((ev.clientX - r.left) / r.width, 0, 1);
    popHSV[2] = constrain(1 - (ev.clientY - r.top) / r.height, 0, 1);
    applyPicker();
  });

    let r = popHue.getBoundingClientRect();

  // タッチ・マウスの知らせも止める

  gx.addColorStop(0, '#fff'); gx.addColorStop(1, 'rgb(' + hc.map(Math.round).join(',') + ')');
  g.fillStyle = gx; g.fillRect(0, 0, W, H);

  gy.addColorStop(0, 'rgba(0,0,0,0)'); gy.addColorStop(1, '#000');
  g.fillStyle = gy; g.fillRect(0, 0, W, H);

  g.lineWidth = 2 * dpr; g.strokeStyle = '#fff'; g.beginPath(); g.arc(mx, my, 6 * dpr, 0, Math.PI * 2); g.stroke();

  for (let k = 0; k <= 6; k++) { gh.addColorStop(k / 6, 'rgb(' + hsv2rgb(k * 60, 1, 1).map(Math.round).join(',') + ')'); }
  h.fillStyle = gh; h.fillRect(0, 0, HW, HH);

  h.lineWidth = 2 * dpr; h.strokeStyle = '#fff'; h.strokeRect(hx - 3 * dpr, 1 * dpr, 6 * dpr, HH - 2 * dpr);
}
function applyPicker() {
  if (pickTarget < 0 || pickTarget >= points.length) { closePicker(); return; }
  let c = hsv2rgb(popHSV[0], popHSV[1], popHSV[2]).map(function (v) { return Math.round(constrain(v, 0, 255)); });
  points[pickTarget].r = c[0]; points[pickTarget].g = c[1]; points[pickTarget].b = c[2];
  popSw.style.background = 'rgb(' + c.join(',') + ')';

}
function openPickerAt(i, x, y) {

  // 無彩色のときは色相が決まらないので、前の色相を引き継ぐ
  popHSV = [hsv[1] < 1e-4 ? popHSV[0] : hsv[0], hsv[1], hsv[2]];
  if (isCoarse) {
    // タッチ：下からせり出す（位置は CSS が決める）。描いてから開くと、せり出す途中から色が見える
    applyPicker();

    requestAnimationFrame(function () { colorPop.classList.add('open'); });

    return;
  }

  let pw = colorPop.offsetWidth, ph = colorPop.offsetHeight, gap = rd.point + 14;

  if ((x >= cx && fitR) || (x < cx && !fitL && fitR)) { ox = right; }
  else if (fitL) { ox = left; }
  else {
    ox = x - pw / 2;
    oy = (y < cy) ? y + gap : y - gap - ph;   // 上半分のキーストーンなら下へ、下半分なら上へ
  }
  colorPop.style.left = Math.round(constrain(ox, 8, Math.max(8, width - pw - 8))) + 'px';
  colorPop.style.top = Math.round(constrain(oy, 8, Math.max(8, height - ph - 8))) + 'px';

function closePicker() {
  if (colorPop && colorPop.classList.contains('open') && isCoarse) { toHost({ type: 'picker', on: false }); }
  if (colorPop) { colorPop.classList.remove('open'); }
  pickTarget = -1;
}

function keyPressed(ev) {
  if (IS_HOST) { return; }
  if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA')) { return; }   // 秒数の入力中は無視
  if (ev.key === 'f' || ev.key === 'F') { enterPlay(); }
  if (ev.key === ' ') { togglePause(); ev.preventDefault(); }
  if (ev.key === 'Escape') { exitPlay(); closePicker(); if (infoPanel) { infoPanel.style.display = 'none'; } }
}

// フルスクリーンは親ページが画面全体で行い、全ペインのUIを同時に消す。
// 子は親に依頼するだけ（実際の出し入れは親から届く setPlay → applyPlay）
function enterPlay() {
  // 同一オリジンなら、クリックの流れの中で直接フルスクリーンを要求する（ユーザー操作の要件を確実に満たす）
  let asked = false;
  try {
    let el = window.parent.document.documentElement;
    let fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { let pr = fn.call(el); if (pr && pr.catch) { pr.catch(function () {}); } asked = true; }
  } catch (err) { /* file:// などで親に触れないときは、親側で要求する */ }
