<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>光のグラデーション・タイムライン（HDR対応）</title>
<!-- PWA：ホーム画面に追加すると、ブラウザの枠なしで起動できる -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#000000" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="光タイムライン" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #stage { position: fixed; inset: 0; }
  /* HDRレンダラ用キャンバス（背景を塗る）。CSSレンダラ時は透明のまま */
  #gpu { position: fixed; inset: 0; width: 100%; height: 100%; display: none; z-index: 0; }
  /* UI・リングを描くp5キャンバスは透明で最前面手前に重ねる */
  .bar {
    position: absolute; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 8px 10px; border-radius: 14px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 6px 24px rgba(0,0,0,0.3);
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    color: #f2f2f2; z-index: 10; user-select: none;
  }
  .bar button {
    padding: 7px 12px; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 9px; background: rgba(255,255,255,0.08); color: #f2f2f2;
    cursor: pointer; font-size: 13px; line-height: 1;
  }
  .bar button:hover { background: rgba(255,255,255,0.18); }
  .bar button.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  .bar span { font-size: 12.5px; color: #d8d8d8; }
  .bar input[type=number] {
    width: 60px; padding: 6px 8px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3);
    color: #fff; font-size: 13px; text-align: right;
  }
  .bar input[type=range] { width: 130px; accent-color: #f5f5f5; }
  #topBar { display: none; }   /* 方式選択はモーダルへ移行 */
  #timeBar { left: 50%; transform: translateX(-50%); }
  #colorBar { left: 50%; transform: translateX(-50%); }
  body:not(.narrowLayout) #colorBar { flex-wrap: nowrap; max-width: 96vw; }
  #viewBar { left: 50%; transform: translateX(-50%); }
  .segGroup { display: flex; border: 1px solid rgba(255,255,255,0.25); border-radius: 10px; overflow: hidden; }
  .segGroup button { border: none !important; border-radius: 0 !important; }
  .segGroup button + button { border-left: 1px solid rgba(255,255,255,0.18) !important; }
  canvas.p5Canvas { position: relative; z-index: 1; touch-action: none; }
  @media (pointer: coarse) {
    .bar { gap: 10px; padding: 10px 12px; max-width: 94vw; }
    .bar button { padding: 12px 16px; font-size: 15px; border-radius: 11px; }
    .bar span { font-size: 14px; }
    .bar input[type=number] { width: 72px; padding: 10px; font-size: 15px; }
    .bar input[type=range] { width: 30vw; min-width: 100px; }
  }
  /* 補間方式スイッチ（サークル上部）とモーダル */
  #modeSwitch {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 13;
    display: flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 22px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.26); color: #f2f2f2;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    font-size: 14px; line-height: 1; cursor: pointer; white-space: nowrap;
    box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #modeSwitch:hover { background: rgba(255,255,255,0.18); }
  #modeSwitch .caret { font-size: 10px; opacity: 0.75; }
  body.narrowLayout #modeSwitch { font-size: 12px; padding: 8px 13px; max-width: 82vw; overflow: hidden; }

  #modeModal {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: rgba(0,0,0,0.62);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  #modeModal.open { display: flex; }
  #modeModal .sheet {
    display: flex; flex-direction: column; gap: 8px;
    padding: 22px; border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 16px 60px rgba(0,0,0,0.5);
    max-height: 86vh; overflow-y: auto; min-width: 280px;
  }
  #modeModal h3 {
    margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em;
    color: rgba(255,255,255,0.55); font-weight: 600; text-align: center;
  }
  #modeModal button {
    padding: 14px 20px; border-radius: 12px; text-align: left;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.07); color: #f2f2f2;
    font-size: 15px; line-height: 1.2; cursor: pointer; white-space: nowrap;
  }
  #modeModal button:hover { background: rgba(255,255,255,0.2); }
  #modeModal button.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  #fsBtn {
    position: fixed; left: 50%; bottom: 128px; transform: translateX(-50%); z-index: 12;
    display: flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 24px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28); color: #fff;
    font-size: 15px; line-height: 1; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  #fsBtn:hover { background: rgba(255,255,255,0.2); }
  body.narrowLayout #fsBtn { padding: 9px 15px; font-size: 13px; }
  #infoBtn {
    position: fixed; top: 14px; right: 14px; z-index: 12;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(15,15,18,0.55); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28); color: #fff;
    font: italic bold 19px Georgia, "Times New Roman", serif;
    cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #infoBtn:hover { background: rgba(255,255,255,0.22); }
  #infoPanel {
    position: fixed; inset: 0; z-index: 30; display: none;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; overflow-y: auto; cursor: pointer;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  #infoPanel .inner {
    max-width: 700px; margin: 5vh auto 8vh; padding: 30px 34px 40px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 22px; box-shadow: 0 12px 60px rgba(0,0,0,0.45);
    cursor: auto;
  }
  #infoPanel h2 { font-size: 18px; margin: 0 0 4px; letter-spacing: 0.06em; font-weight: 600; }
  #infoPanel .sub { font-size: 12px; color: rgba(255,255,255,0.55); margin: 0 0 18px; }
  #infoPanel h3 {
    font-size: 14px; margin: 24px 0 8px; color: #cfe6ff;
    letter-spacing: 0.08em; font-weight: 600;
    border-bottom: 1px solid rgba(255,255,255,0.14); padding-bottom: 6px;
  }
  #infoPanel ul { padding-left: 1.3em; margin: 6px 0; }
  #infoPanel li { font-size: 13.5px; line-height: 1.95; color: rgba(255,255,255,0.92); margin: 2px 0; }
  #infoPanel b { color: #fff; font-weight: 600; }
  #infoPanel .closeHint { text-align: center; font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 26px; }
  #infoPanel .wakeStatus {
    font-size: 13.5px; line-height: 1.8; margin: 8px 0; padding: 8px 12px; border-radius: 10px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
  }
  #infoPanel .wakeStatus.warn { background: rgba(255,170,60,0.16); border-color: rgba(255,190,100,0.5); }
  /* スリープを防げない環境への案内（一度だけ出る。どこかをタップで閉じる）
     他のUIと重ならないよう、方式モーダルと同じ暗転オーバーレイにする */
  #wakeNotice {
    position: fixed; inset: 0; z-index: 35; display: none;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    align-items: center; justify-content: center; cursor: pointer;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
  }
  #wakeNotice.open { display: flex; }
  #wakeNotice .card {
    max-width: min(440px, 84vw); box-sizing: border-box;
    padding: 20px 22px; border-radius: 18px;
    background: rgba(40,28,10,0.85);
    border: 1px solid rgba(255,190,100,0.55); color: #ffe9c8;
    font-size: 14px; line-height: 1.8;
    box-shadow: 0 16px 60px rgba(0,0,0,0.5);
  }
  #wakeNotice .card b { color: #fff; }
  #wakeNotice .card .closeHint { display: block; margin-top: 10px; font-size: 12px; color: rgba(255,233,200,0.6); text-align: center; }
  /* ---- 画面分割（親ページ）：タイムラインを iframe で横に並べる ---- */
  #panes { position: fixed; inset: 0; display: flex; background: #000; }
  #panes .pane { position: relative; flex: 1 1 0; min-width: 0; height: 100%; }
  #panes iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
  .splitBtn, .paneClose {
    position: fixed; z-index: 25; border-radius: 50%; padding: 0;
    background: rgba(15,15,18,0.55); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28); color: #fff;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; line-height: 1;
    cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  .splitBtn:hover, .paneClose:hover { background: rgba(255,255,255,0.22); }
  /* ＋は画面の縁に貼りつくタブ形（細いペインでもリングに重ならないよう幅を抑える） */
  .splitBtn { top: 50%; transform: translateY(-50%); width: 28px; height: 64px; font-size: 22px; font-weight: 300; }
  #splitLeft { left: 0; border-radius: 0 14px 14px 0; border-left: 0; }
  #splitRight { right: 0; border-radius: 14px 0 0 14px; border-right: 0; }
  .paneClose { position: absolute; top: 62px; left: 12px; width: 32px; height: 32px; font-size: 17px; display: none; }
  /* 分割中の共通バー（親）：補間方式・フルスクリーン・境界グラデーション・ヘルプを全タイムライン共通で1つずつ */
  #hostBar {
    position: fixed; top: 10px; left: 0; right: 0; margin: 0 auto; width: max-content; z-index: 25;
    display: none; align-items: center; justify-content: center; gap: 8px;
    flex-wrap: wrap; max-width: 96vw; white-space: nowrap;
  }
  body.multi #hostBar { display: flex; }
  body.playing #hostBar { display: none; }
  body.host #modeSwitch, body.host #fsBtn, body.host #infoBtn { position: static; transform: none; }
  body.host #fsBtn { padding: 9px 16px; font-size: 14px; }
  #blendBtn {
    padding: 9px 16px; border-radius: 22px;
    background: rgba(15,15,18,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.26); color: #f2f2f2;
    font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif;
    font-size: 14px; line-height: 1; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #blendBtn:hover { background: rgba(255,255,255,0.18); }
  #blendBtn.active { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  #blendW { width: 80px; accent-color: #f5f5f5; display: none; }
  #blendBtn.active + #blendW { display: block; }
  /* ---- 子ページ側：分割中（shared）は共通バーに任せるボタンを隠す ---- */
  body.shared #modeSwitch, body.shared #fsBtn, body.shared #infoBtn { display: none !important; }
  /* ---- 子ページ側：細い枠の簡略表示（compact）。リング＋秒数＋一時停止だけを出し、残りは「⋯」で開く ---- */
  #moreBtn {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 12; display: none;
    width: 38px; height: 38px; border-radius: 50%; padding: 0;
    background: rgba(15,15,18,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.28); color: #fff;
    font: 20px/1 system-ui, -apple-system, sans-serif; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #moreBtn:hover { background: rgba(255,255,255,0.22); }
  body.compact #moreBtn { display: block; }
  body.compact.moreOpen #moreBtn { background: #f5f5f5; color: #111; border-color: #f5f5f5; }
  body.play #moreBtn { display: none; }
  body.compact:not(.moreOpen) #viewBar, body.compact:not(.moreOpen) #colorBar { display: none; }
  body.compact #timeBar, body.compact #viewBar { flex-wrap: nowrap; }
  body.compact #timeBar input[type=range] { display: none; }
  body.compact .bar button, body.compact .bar span { white-space: nowrap; }
  body.compact #colorBar { max-width: calc(100vw - 16px); justify-content: center; box-sizing: border-box; }
  body.multi .paneClose { display: block; }
  body.playing .splitBtn, body.playing .paneClose { display: none; }
  /* 枠の境界のつまみ：左右にドラッグして幅の配分を変える（ダブルクリックで均等に戻す） */
  .paneDivider {
    position: fixed; top: 0; bottom: 0; width: 18px; margin-left: -9px; z-index: 24;
    cursor: col-resize; touch-action: none;
  }
  .paneDivider::after {
    content: ''; position: absolute; left: 7px; top: 50%; width: 4px; height: 52px;
    transform: translateY(-50%); border-radius: 2px;
    background: rgba(255,255,255,0.6); box-shadow: 0 0 0 1px rgba(0,0,0,0.35);
  }
  .paneDivider:hover::after, .paneDivider.drag::after { background: #fff; height: 72px; }
  body.playing .paneDivider { display: none; }
  #errbox {
    position: absolute; left: 12px; top: 12px; z-index: 99; display: none;
    max-width: 60vw; padding: 10px 12px; border-radius: 10px;
    background: rgba(120,0,0,0.85); color: #fff;
    font: 12px/1.5 monospace; white-space: pre-wrap;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
