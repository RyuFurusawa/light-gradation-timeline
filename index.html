}
function exitPlay() {
  if (!playMode) { return; }
  toHost({ type: 'play', on: false });
}
function applyPlay(on) {
  if (on === playMode) { return; }
  document.body.classList.toggle('play', on);
  if (on) {
    playMode = true;
    closePicker();
    document.body.classList.remove('moreOpen');
    syncSheet();
    // 操作パネルは CSS（body.play）で隠れる
    if (infoBtn) { infoBtn.style.display = 'none'; }
    if (infoPanel) { infoPanel.style.display = 'none'; }
    if (modeSwitch) { modeSwitch.style.display = 'none'; }
    if (modeModal) { modeModal.classList.remove('open'); }
    if (fsBtn) { fsBtn.style.display = 'none'; }
    return;
  }
  playMode = false;
  // show()が付与するインラインdisplayはCSSと競合するため、クラス制御に戻す

  if (infoBtn) { infoBtn.style.display = 'block'; }
  if (fsBtn) { fsBtn.style.display = 'flex'; }
  if (modeSwitch) { modeSwitch.style.display = ''; }
  // フルスクリーン解除→リサイズ完了を待ってからレイアウトを再計算（崩れ防止）
  setTimeout(function () { layout(); resizeGpu(); applyResponsive(); placeBars(); }, 60);
  setTimeout(function () { layout(); resizeGpu(); applyResponsive(); placeBars(); }, 250);
}

/* ---------------- 親子間のやり取り（子側） ---------------- */
function toHost(msg) { try { window.parent.postMessage(msg, '*'); } catch (err) {} }

function initPaneMessaging() {
  window.addEventListener('message', function (ev) {
    if (ev.source !== window.parent || !ev.data) { return; }
    let d = ev.data;
    if (d.type === 'setPlay') { applyPlay(!!d.on); }
    else if (d.type === 'wake') { setWakeState(d.state); }
    else if (d.type === 'getState') { toHost({ type: 'state', id: d.id, state: getState() }); }
    else if (d.type === 'shared') {
      let was = sharedUI;
      sharedUI = !!d.on; topInset = +d.top || 0;
      document.body.classList.toggle('shared', sharedUI);
      if (sharedUI && d.mode) { setModeById(d.mode); }
      if (was !== sharedUI) {
        if (modeModal) { modeModal.classList.remove('open'); }
        if (infoPanel) { infoPanel.style.display = 'none'; }
      }
      layout(); applyResponsive();
    }
    else if (d.type === 'setMode') { setModeById(d.mode); }
    else if (d.type === 'allowKind' && KIND_RANK.hasOwnProperty(d.kind)) {
      let before = allowedKind;
      allowedKind = d.kind;
      if (!renderer || before === allowedKind) { return; }
      if (KIND_RANK[renderer.kind] > KIND_RANK[allowedKind]) { useRenderer(makeCssRenderer(allowedKind === 'P3広色域')); }
      else if (naturalKind && KIND_RANK[renderer.kind] < Math.min(KIND_RANK[naturalKind], KIND_RANK[allowedKind])) { refreshRenderer(); }
    }
    else if (d.type === 'retryRenderer') { hdrBroken = false; rendererFails = 0; refreshRenderer(); }
    else if (d.type === 'active') {

      document.body.classList.toggle('paneMulti', paneMulti);
    }
    else if (d.type === 'gain' && +d.value > 0) {
      hdrGain = constrain(+d.value, 1, 4);
      if (gainSlider) { gainSlider.value = String(hdrGain); }
    }
    else if (d.type === 'lumaCommit') { commitLuma(); }
    else if (d.type === 'gcheck') {
      gcheck = { on: !!d.on, gray: +d.gray || 0, x: +d.x || 0, y: +d.y || 0, s: +d.s || 0 };
    }

      // 親の「全体の色」：常に元の色から適用し直す。target は全枠の色点から親が決めた明度

      EDGE_SIDES.forEach(function (k) {
        let segs = (blendOn && d.segs && Array.isArray(d.segs[k])) ? d.segs[k] : [];
        let old = nb[k];

          let keep = (old.length === segs.length && old[i]) ? old[i].spec : null;
          return { a0: +sg[0], a1: +sg[1], spec: keep, c: null };
        });
      });
      EDGE_CORNERS.forEach(function (c) {
        cornerOn[c] = !!(blendOn && d.corners && d.corners[c]);
        if (!cornerOn[c]) { diag[c] = null; diagSpec[c] = null; }
      });
      tjs = (blendOn && d.tj) ? d.tj : { L: [], R: [], T: [], B: [] };
      lastSpecSent = '';   // 隣の顔ぶれが変わったかもしれないので、自分の設定を送り直す
    }

  document.addEventListener('pointermove', function (ev) { if (ev.pointerType === 'mouse') { pointerIn = true; } }, true);

}

function setModeById(m) {
  for (let i = 0; i < MODE_LIST.length; i++) { if (MODE_LIST[i][1] === m) { mode = m; } }
  updateModeBtns();
}

// 複製用の状態。phase は壁時計 at の時点の位相。複製先は読み込みにかかった時間ぶん進めて、同じ位相で回り始める
function getState() {
  let ph = getPhase();
  return {
    points: points.map(function (q) { return { ang: q.ang, r: q.r, g: q.g, b: q.b }; }),
    mode: mode, loopDur: loopDur, hdrGain: hdrGain,
    base: (lumaSnapshot || points).map(function (q) { return [q.r, q.g, q.b]; }),   // 明度統一する前の色
    paused: paused, reversed: reversed, phase: ph, at: Date.now(),
    showXY: showXY, showLumaCheck: showLumaCheck
  };
}

function applyStateFromHash() {
  let m = /[#&]s=([^&]*)/.exec(location.hash);
  if (!m) { return; }
  let st;
  try { st = JSON.parse(decodeURIComponent(m[1])); } catch (err) { return; }
  if (!st || !Array.isArray(st.points) || st.points.length < 2) { return; }
  points = st.points.map(function (q) { return { ang: +q.ang, r: +q.r, g: +q.g, b: +q.b }; });
  for (let i = 0; i < MODE_LIST.length; i++) { if (MODE_LIST[i][1] === st.mode) { mode = st.mode; } }
  updateModeBtns();
  if (st.loopDur > 0) { setDur(+st.loopDur); }
  if (st.hdrGain > 0) { hdrGain = +st.hdrGain; if (gainSlider) { gainSlider.value = String(hdrGain); } }
  showXY = !!st.showXY; xyBtn.classList.toggle('active', showXY);
  showLumaCheck = !!st.showLumaCheck; checkBtn.classList.toggle('active', showLumaCheck);
  let ph = +st.phase || 0;
  if (st.paused) {
    paused = true; pausedAt = clockMs();
    syncPauseIcon();
  } else if (isFinite(st.at)) {
    ph += (st.reversed ? -1 : 1) * (Date.now() - st.at) / (loopDur * 1000);
    ph -= Math.floor(ph);
  }
  setReversed(!!st.reversed);
  setPhase(ph);
}

/* ---------------- 画面分割（親側） ----------------
   左右の＋で、その側の端にあるタイムラインを複製して並べる。幅は常に均等 */
function buildHost() {
  document.body.classList.add('host');
  let wrap = document.createElement('div');
  wrap.id = 'panes';
  document.body.appendChild(wrap);

  // ---- 共通バー（境界グラデーションは2つ以上に分割しているときだけ出る） ----
  hostBar = document.createElement('div');
  hostBar.id = 'hostBar';
  document.body.appendChild(hostBar);
  buildModeUI(hostBar, function (m) { mode = m; updateModeBtns(); hostBroadcast({ type: 'setMode', mode: m }); if (hostGCheck) { hostSendGCheck(); } });

  fsBtn = document.createElement('button');
  fsBtn.id = 'fsBtn';
  fsBtn.innerHTML = '<span style="font-size:17px">\u26f6</span><span class="lbl"> フルスクリーン</span>';
  fsBtn.title = 'フルスクリーン（クリックか Esc で戻る）';
  fsBtn.setAttribute('aria-label', 'フルスクリーン');
  hostBar.appendChild(fsBtn);
  fsBtn.addEventListener('click', function () { fsBtn.blur(); hostSetPlay(true, false); });

  blendBtn = document.createElement('button');
  blendBtn.id = 'blendBtn';
  blendBtn.innerHTML = '境界<span class="lbl2">グラデーション</span>';
  blendBtn.title = '隣り合うタイムラインの境界を、光のグラデーションでつなぐ';
  hostBar.appendChild(blendBtn);
  let bw = document.createElement('input');
  bw.type = 'range'; bw.id = 'blendW'; bw.min = '0.05'; bw.max = '1'; bw.step = '0.05'; bw.value = String(blendWidth);
  bw.title = 'グラデーションの幅（右端＝枠の中央まで）';
  bw.setAttribute('aria-label', 'グラデーションの幅');
  hostBar.appendChild(bw);
  blendBtn.addEventListener('click', function () {
    blendBtn.blur();
    blendOn = !blendOn;
    blendBtn.classList.toggle('active', blendOn);
    hostSyncPanes();
  });
  bw.addEventListener('input', function () { blendWidth = parseFloat(bw.value) || 1; hostSyncPanes(); });

  buildGlobalUI();
  buildInfoUI(hostBar);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (globalPop) { globalPop.classList.remove('open'); globalBtn.classList.remove('active'); }
      if (infoPanel) { infoPanel.style.display = 'none'; }
      if (modeModal) { modeModal.classList.remove('open'); }
    }
  });

  window.addEventListener('message', onHostMessage);
  window.addEventListener('resize', function () { hostLayoutPanes(); hostPanes.forEach(hostSendConfig); });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (n) {
    document.addEventListener(n, function () {
      // Esc などでブラウザ側がフルスクリーンを解いたとき、UIも戻す
      if (!hostFsElement() && playMode) { hostSetPlay(false, true); }
    });
  });
  // 最初の枠（木の根）
  let first = makePane(null);
  hostRoot = { pane: first, parent: null };
  first.node = hostRoot;
  hostSyncPanes();
}

/* ---------------- 全体の色（親側・分割中だけ） ----------------
   HDR輝度は全部の枠で1つ。知覚明度統一は、全部の枠の色点の OKLab L から基準（最低・平均）を決めて、全枠へ同じ基準で適用する */
function buildGlobalUI() {
  globalBtn = document.createElement('button');
  globalBtn.id = 'globalBtn';
  globalBtn.textContent = '全体の色';
  globalBtn.title = 'HDR輝度と明度の統一を、全部のタイムラインへまとめて適用する';
  hostBar.appendChild(globalBtn);
  globalPop = el('div', { id: 'globalPop' });
  hostGainRow = el('div', { cls: 'bar', parent: globalPop });
  el('span', { text: 'HDR輝度', parent: hostGainRow });
  hostGainSlider = el('input', { parent: hostGainRow, attrs: { type: 'range', min: '1', max: '4', step: '0.1', value: String(hostGain) },
    on: { input: function () { hostGain = parseFloat(hostGainSlider.value) || 1; hostBroadcast({ type: 'gain', value: hostGain }); } } });
  hostGainRow.style.display = hostAllowedKind === 'HDR' ? 'flex' : 'none';
  let lr = el('div', { cls: 'bar', parent: globalPop });
  el('span', { text: '知覚明度統一', parent: lr });
  let seg = el('div', { cls: 'segGroup', parent: lr });
  [['最低', 'min'], ['平均', 'avg']].forEach(function (b) {
    hostLumaBtns[b[1]] = el('button', { text: b[0], parent: seg, on: { click: function (ev) { ev.currentTarget.blur(); hostApplyLuma(b[1]); } } });
  });
  hostLumaBtns.maxc = el('button', { text: '彩度最大', parent: lr, on: { click: function (ev) { ev.currentTarget.blur(); hostApplyLuma('maxc'); } } });
  hostRestoreBtn = el('button', { text: '戻る', parent: lr, style: { display: 'none' }, on: { click: function (ev) { ev.currentTarget.blur(); hostApplyLuma('none'); } } });
  hostCommitBtn = el('button', { text: 'この色で確定', parent: lr, style: { display: 'none' },
    title: '明度をそろえた今の色を、全部のタイムラインの色点の色として上書きする（戻るで元に戻せなくなる）',
    on: { click: function (ev) { ev.currentTarget.blur(); hostLumaMode = 'none'; hostSetLumaActive(); hostBroadcast({ type: 'lumaCommit' }); } } });
  // 全体の輝度検証：全部の枠の色点から、選択中の方式の明度の平均でグレーを決め、画面の中央に四角を出す
  let cr = el('div', { cls: 'bar', parent: globalPop });
  hostGCheckBtn = el('button', { text: '輝度検証', parent: cr, title: '全部のタイムラインの色点から決めたグレーの四角を、画面の中央に出す',
    on: { click: function (ev) {
      ev.currentTarget.blur();
      hostGCheck = !hostGCheck; hostGCheckBtn.classList.toggle('active', hostGCheck);
      hostSendGCheck();
    } } });
  // 明度統一の方針の説明（i で開閉）
  let help = el('div', { cls: 'lumaHelp', parent: globalPop, html:
    '<p><b>最低</b>：全部のタイムラインの色点のうち、いちばん暗い色の明度（OKLab の L）に、すべての色をそろえます。</p>' +
    '<p><b>平均</b>：全部の色点の明度の平均に、すべての色をそろえます。</p>' +
    '<p>どちらも色相はそのままで、明度だけを動かします。明度を動かすと画面に出せる色の範囲（sRGB）からはみ出す色は、色相を保ったまま彩度を下げて収めます（とくに明るくする側の青など）。</p>' +
    '<p><b>彩度最大</b>：明度と色相はそのままで、彩度だけを出せる上限まで上げます。</p>' +
    '<p>どのボタンも、明度をそろえる前の<b>元の色</b>から毎回計算し直します（今の色に重ねてはかけません）。そのため「最低」のあとに「平均」を押すと、元の色の平均にそろいます。<b>戻る</b>で元の色に戻ります。</p>' +
    '<p><b>この色で確定</b>：そろえた今の色を、各タイムラインの色点の色として上書きします。以後のボタンは、確定した色を元の色として計算します（戻るでは確定前に戻せません）。</p>' });
  let infoB = el('button', { text: 'i', cls: 'lumaInfo', parent: lr, title: '明度統一の方針を表示する', on: { click: function (ev) {
    ev.currentTarget.blur();
    let open = !help.classList.contains('open');
    help.classList.toggle('open', open); infoB.classList.toggle('active', open);
  } } });
  globalBtn.addEventListener('click', function () {
    globalBtn.blur();
    let open = !globalPop.classList.contains('open');
    globalPop.classList.toggle('open', open);
    globalBtn.classList.toggle('active', open);
    if (open) { placeGlobalPop(); }
  });
  // 外側を押したら閉じる（枠の中は iframe なので、親には届かない＝閉じない）
  document.addEventListener('pointerdown', function (ev) {
    if (!globalPop.classList.contains('open')) { return; }
    if (globalPop.contains(ev.target) || globalBtn.contains(ev.target)) { return; }
    globalPop.classList.remove('open'); globalBtn.classList.remove('active');
  });
  window.addEventListener('resize', placeGlobalPop);
}
// 全体の輝度検証の四角：画面全体の中央、短辺の 28%。グレーは全部の枠の色点（設定 spec の色）から
function hostGCheckMsg(q) {
  let on = hostGCheck && hostPanes.length > 1, gray = 0;
  if (on) {
    let pts = [];
    hostPanes.forEach(function (p) {
      if (p.spec && Array.isArray(p.spec.pts)) { p.spec.pts.forEach(function (a) { pts.push({ r: +a[1], g: +a[2], b: +a[3] }); }); }
    });
    gray = pts.length ? grayForMode(pts)[0] : 0;
  }
  let W = window.innerWidth, H = window.innerHeight;
  return { type: 'gcheck', on: on, gray: gray, x: W / 2 - q.rect.x, y: H / 2 - q.rect.y, s: Math.round(Math.min(W, H) * 0.28) };
}
function hostSendGCheck() {
  hostPanes.forEach(function (q) { try { q.frame.contentWindow.postMessage(hostGCheckMsg(q), '*'); } catch (err) {} });
}
function placeGlobalPop() {
  if (!globalPop) { return; }
  let r = hostBar.getBoundingClientRect();
  globalPop.style.top = Math.round(r.bottom + 10) + 'px';
}
function hostSetLumaActive() {
  for (let k in hostLumaBtns) { hostLumaBtns[k].classList.toggle('active', k === hostLumaMode); }
  if (hostRestoreBtn) { hostRestoreBtn.style.display = hostLumaMode === 'none' ? 'none' : 'inline-block'; }
  if (hostCommitBtn) { hostCommitBtn.style.display = hostLumaMode === 'none' ? 'none' : 'inline-block'; }
}
// 全部の枠から元の色（明度統一する前）を集め、基準の明度を決めて配る
function hostApplyLuma(kind) {
  if (kind !== 'none' && kind === hostLumaMode) { return; }
  hostLumaMode = kind; hostSetLumaActive();
  if (kind !== 'min' && kind !== 'avg') { hostBroadcast({ type: 'luma', kind: kind }); return; }
  let panes = hostPanes.slice();
  Promise.all(panes.map(function (q) {
    return new Promise(function (res) {
      let id = ++hostReqId, done = false;
      hostStateWaiters[id] = function (st) { if (!done) { done = true; delete hostStateWaiters[id]; res(st); } };
      setTimeout(function () { if (!done) { done = true; delete hostStateWaiters[id]; res(null); } }, 800);
      try { q.frame.contentWindow.postMessage({ type: 'getState', id: id }, '*'); } catch (err) { res(null); }
    });
  })).then(function (sts) {
    if (hostLumaMode !== kind) { return; }   // 待つ間に別の操作をした
    let Ls = [];
    sts.forEach(function (st) {
      if (!st || !Array.isArray(st.base)) { return; }
      st.base.forEach(function (c) { Ls.push(rgb2oklch(+c[0], +c[1], +c[2])[0]); });
    });
    if (!Ls.length) { return; }
    let target = kind === 'min' ? Math.min.apply(null, Ls) : Ls.reduce(function (a, b) { return a + b; }, 0) / Ls.length;
    hostBroadcast({ type: 'luma', kind: kind, target: target });
  });
}

// ＋と×を出す枠（ポインタを置いた／触れた枠）
let hostActive = null;
function hostSetActive(q) {
  if (!q || q === hostActive) { return; }
  hostActive = q;
  hostPanes.forEach(function (p) { p.div.classList.toggle('active', p === q); });
  hostPanes.forEach(hostSendActive);
}
// 子へ「選ばれているか・分割中か」を知らせる（タッチ端末でキーストーンを出す枠を決める）
function hostSendActive(p) {
  try { p.frame.contentWindow.postMessage({ type: 'active', on: p === hostActive, multi: hostPanes.length > 1 }, '*'); } catch (err) {}
}

function hostFsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }

// 枠（iframe＋×＋四辺の＋）を1つ作る。置き場所は分割の木が決める
function makePane(state) {
  let wrap = document.getElementById('panes');
  let div = document.createElement('div');
  div.className = 'pane';
  let f = document.createElement('iframe');
  f.setAttribute('allow', 'fullscreen');
  f.title = 'タイムライン';
  f.src = location.pathname.split('/').pop() + '?pane=1' + (NO_HDR ? '&nohdr=1' : '') + (NO_HALO ? '' : '&halo=1') +
    (state ? '#s=' + encodeURIComponent(JSON.stringify(state)) : '');
  let pane = { div: div, frame: f, node: null, rect: { x: 0, y: 0, w: 0, h: 0 }, nb: {}, top: 0 };
  div.appendChild(f);
  let x = document.createElement('button');
  x.className = 'paneClose'; x.textContent = '×'; x.title = 'このタイムラインを閉じる';
  x.setAttribute('aria-label', 'このタイムラインを閉じる');
  x.addEventListener('click', function () { removePane(pane); });
  div.appendChild(x);
  pane.closeBtn = x;
  [['L', 'left', '左'], ['R', 'right', '右'], ['T', 'top', '上'], ['B', 'bottom', '下']].forEach(function (d) {
    let b = document.createElement('button');
    b.className = 'splitBtn s' + d[0]; b.textContent = '+';
    b.title = 'この枠を二分して、' + d[2] + 'に複製を置く';
    b.setAttribute('aria-label', b.title);
    b.addEventListener('click', function () { b.blur(); addPane(pane, d[1]); });
    div.appendChild(b);
    pane['split' + d[0]] = b;
  });
  wrap.appendChild(div);
  hostPanes.push(pane);
  // ＋や×の上にポインタがあるとき（iframe の外）も、その枠を選んだままにする
  div.addEventListener('pointerenter', function () { hostSetActive(pane); });
  return pane;
}

// pane の領域を二分して、side 側に新しい枠を置く。ほかの枠の大きさは変わらない
function splitPane(pane, side, state) {
  let np = makePane(state);
  let leaf = pane.node, nl = { pane: np, parent: null };
  np.node = nl;
  let firstNew = (side === 'left' || side === 'top');
  let sp = {
    dir: (side === 'left' || side === 'right') ? 'row' : 'col',
    a: firstNew ? nl : leaf, b: firstNew ? leaf : nl, ratio: 0.5, parent: leaf.parent
  };
  hostReplaceNode(leaf, sp);
  leaf.parent = sp; nl.parent = sp;
  hostSetActive(np);
  hostSyncPanes();
}
function hostReplaceNode(oldNode, newNode) {
  let par = oldNode.parent;
  if (!par) { hostRoot = newNode; }
  else if (par.a === oldNode) { par.a = newNode; }
  else { par.b = newNode; }
}

// 閉じると、二分の相手が領域全体を引き継ぐ
function removePane(pane) {
  if (hostPanes.length <= 1) { return; }
  let leaf = pane.node, sp = leaf.parent;
  let sib = (sp.a === leaf) ? sp.b : sp.a;
  hostReplaceNode(sp, sib);
  sib.parent = sp.parent;
  hostPanes = hostPanes.filter(function (q) { return q !== pane; });
  pane.div.remove();
  hostUpdateKinds();
  hostSyncPanes();
}

function addPane(pane, side) {
  let id = ++hostReqId, done = false;
  function finish(state) {
    if (done) { return; }
    done = true; delete hostStateWaiters[id];
    if (hostPanes.indexOf(pane) < 0) { return; }
    // 分割を始めるときは、複製元の方式を共通の方式にする
    if (state && hostPanes.length === 1) {
      setModeById(state.mode);
      if (state.hdrGain > 0) { hostGain = +state.hdrGain; if (hostGainSlider) { hostGainSlider.value = String(hostGain); } }
    }
    splitPane(pane, side, state);
  }
  hostStateWaiters[id] = finish;
  try { pane.frame.contentWindow.postMessage({ type: 'getState', id: id }, '*'); } catch (err) {}
  setTimeout(function () { finish(null); }, 600);   // 返事がなければ初期状態で作る
}

// 節が収まるのに必要な最小の寸法（axis：'w' または 'h'）。枠1つは 220×320
// 枠の最小寸法（＋で二分できる下限、境界のドラッグの下限）
const PANE_MIN_W = 120, PANE_MIN_H = 150;
function hostMinSize(node, axis) {
  if (node.pane) { return axis === 'w' ? PANE_MIN_W : PANE_MIN_H; }
  let a = hostMinSize(node.a, axis), b = hostMinSize(node.b, axis);
  return ((node.dir === 'row') === (axis === 'w')) ? a + b : Math.max(a, b);
}

// 木をたどって各枠の矩形（整数px）を決める。端数幅だと継ぎ目に線が出るので丸める
function hostLayoutPanes() {
  if (!hostRoot) { return; }
  (function walk(node, r) {
    node.rect = r;
    if (node.pane) {
      node.pane.rect = r;
      let st = node.pane.div.style;
      st.left = r.x + 'px'; st.top = r.y + 'px'; st.width = r.w + 'px'; st.height = r.h + 'px';
      return;
    }
    if (node.dir === 'row') {
      let w1 = Math.round(r.w * node.ratio);
      walk(node.a, { x: r.x, y: r.y, w: w1, h: r.h });
      walk(node.b, { x: r.x + w1, y: r.y, w: r.w - w1, h: r.h });
      if (node.divEl) { let s = node.divEl.style; s.left = (r.x + w1 - 9) + 'px'; s.top = r.y + 'px'; s.width = '18px'; s.height = r.h + 'px'; }
    } else {
      let h1 = Math.round(r.h * node.ratio);
      walk(node.a, { x: r.x, y: r.y, w: r.w, h: h1 });
      walk(node.b, { x: r.x, y: r.y + h1, w: r.w, h: r.h - h1 });
      if (node.divEl) { let s = node.divEl.style; s.left = r.x + 'px'; s.top = (r.y + h1 - 9) + 'px'; s.width = r.w + 'px'; s.height = '18px'; }
    }
  })(hostRoot, { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight });

  // 境界グラデーションの相手：辺を共有する（長さ1px以上重なる）隣を、辺ごとに辺の向きの順で並べる。
  // 各相手には、その辺の上での区間（0..1）を付ける。相手が EDGE_MAXS を超える辺はつながない
  hostPanes.forEach(function (q) { q.nb = { L: [], R: [], T: [], B: [] }; });
  hostPanes.forEach(function (p) {
    hostPanes.forEach(function (q) {
      let a = p.rect, b = q.rect;
      if (b.x === a.x + a.w) {   // q は p の右
        let y0 = Math.max(a.y, b.y), y1 = Math.min(a.y + a.h, b.y + b.h);
        if (y1 - y0 >= 1) {
          p.nb.R.push({ pane: q, a0: (y0 - a.y) / a.h, a1: (y1 - a.y) / a.h });
          q.nb.L.push({ pane: p, a0: (y0 - b.y) / b.h, a1: (y1 - b.y) / b.h });
        }
      }
      if (b.y === a.y + a.h) {   // q は p の下
        let x0 = Math.max(a.x, b.x), x1 = Math.min(a.x + a.w, b.x + b.w);
        if (x1 - x0 >= 1) {
          p.nb.B.push({ pane: q, a0: (x0 - a.x) / a.w, a1: (x1 - a.x) / a.w });
          q.nb.T.push({ pane: p, a0: (x0 - b.x) / b.w, a1: (x1 - b.x) / b.w });
        }
      }
    });
  });
  hostPanes.forEach(function (q) {
    ['L', 'R', 'T', 'B'].forEach(function (k) {
      q.nb[k].sort(function (m, n) { return m.a0 - n.a0; });
      if (q.nb[k].length > EDGE_MAXS) { q.nb[k] = []; }
    });
  });
  // 角の対角の枠を覚える（中間混色で角の面を張るため）。
  //  ・4枠の角：左右の隣と上下の隣の両方がちょうどその角で終わる → 対角の枠
  //  ・T字の交点：片方の隣はその角で終わり、もう片方はその先へ続く → 続いている枠を対角の枠とみなす
  //    （3枠の点は「対角が続いている枠そのもの」の4枠の角と同じ式で、なめらかにつながる）
  hostPanes.forEach(function (p) {
    let a = p.rect, R = a.x + a.w, Bm = a.y + a.h;
    function find(f) { return hostPanes.filter(function (q) { return q !== p && f(q.rect); })[0] || null; }
    function corner(h, v, hEnd, vEnd, f) {
      if (!h || !v) { return null; }
      if (hEnd && vEnd) { return find(f); }
      if (hEnd) { return v.pane; }
      if (vEnd) { return h.pane; }
      return null;
    }
    let L = p.nb.L, Rt = p.nb.R, T = p.nb.T, B = p.nb.B;
    let hTL = L[0], vTL = T[0], hTR = Rt[0], vTR = T[T.length - 1];
    let hBL = L[L.length - 1], vBL = B[0], hBR = Rt[Rt.length - 1], vBR = B[B.length - 1];
    function r(m) { return m.pane.rect; }
    p.diag = {
      TL: corner(hTL, vTL, hTL && r(hTL).y === a.y, vTL && r(vTL).x === a.x, function (q) { return q.x + q.w === a.x && q.y + q.h === a.y; }),
      TR: corner(hTR, vTR, hTR && r(hTR).y === a.y, vTR && r(vTR).x + r(vTR).w === R, function (q) { return q.x === R && q.y + q.h === a.y; }),
      BL: corner(hBL, vBL, hBL && r(hBL).y + r(hBL).h === Bm, vBL && r(vBL).x === a.x, function (q) { return q.x + q.w === a.x && q.y === Bm; }),
      BR: corner(hBR, vBR, hBR && r(hBR).y + r(hBR).h === Bm, vBR && r(vBR).x + r(vBR).w === R, function (q) { return q.x === R && q.y === Bm; })
    };
    // T字の交点（この枠の1つの辺に、2つ以上の隣が接している所の境目）。
    // [辺に沿った位置, 手前の隣の辺に沿った長さ, 奥の隣の長さ]（どれもこの枠の辺の長さで割った値）
    p.tj = {};
    ['L', 'R', 'T', 'B'].forEach(function (k) {
      let list = p.nb[k], along = (k === 'T' || k === 'B') ? 'w' : 'h', len = a[along];
      p.tj[k] = [];
      for (let i = 0; i + 1 < list.length; i++) {
        p.tj[k].push([list[i].a1, list[i].pane.rect[along] / len, list[i + 1].pane.rect[along] / len]);
      }
    });
  });
  // 上端が共通バーにかかる枠は、中身と×を下げる（バーの下端＋8px から時間バーが始まるように）
  // 横方向にもバーと重なる枠だけ（左右の端の細い枠はバーの下にないので下げない）
  let br = hostBar ? hostBar.getBoundingClientRect() : null;
  let barBottom = (br && br.bottom) ? Math.round(br.bottom) : 66;
  let barL = (br && br.width) ? br.left - 8 : 0, barR = (br && br.width) ? br.right + 8 : window.innerWidth;
  hostPanes.forEach(function (q) {
    let under = q.rect.y < barBottom && q.rect.x < barR && q.rect.x + q.rect.w > barL;
    q.top = under ? Math.max(0, barBottom + 8 - 26 - q.rect.y) : 0;
    q.closeBtn.style.top = (q.top + 26) + 'px';
    // 二分すると最小寸法を下回る側の＋は出さない
    q.splitL.style.display = q.splitR.style.display = (q.rect.w / 2 < PANE_MIN_W) ? 'none' : '';
    q.splitT.style.display = q.splitB.style.display = (q.rect.h / 2 < PANE_MIN_H) ? 'none' : '';
  });
}

// 分割の節ごとに、境界のつまみを作り直す（木の形が変わったとき）
function hostRebuildDividers() {
  hostDividers.forEach(function (d) { d.remove(); });
  hostDividers = [];
  (function walk(node) {
    if (node.pane) { return; }
    makeDivider(node);
    walk(node.a); walk(node.b);
  })(hostRoot);
}
function makeDivider(sp) {
  let d = document.createElement('div');
  d.className = 'paneDivider ' + (sp.dir === 'row' ? 'dv' : 'dh');
  d.title = 'ドラッグで比率を調整（ダブルクリックで半々に戻す）';
  document.body.appendChild(d);
  sp.divEl = d;
  hostDividers.push(d);
  let dragging = false;
  d.addEventListener('pointerdown', function (ev) {
    dragging = true; d.classList.add('drag');
    try { d.setPointerCapture(ev.pointerId); } catch (err) {}
    ev.preventDefault();
  });
  d.addEventListener('pointermove', function (ev) {
    if (!dragging) { return; }
    let r = sp.rect, row = (sp.dir === 'row');
    let size = row ? r.w : r.h, pos = row ? ev.clientX - r.x : ev.clientY - r.y;
    let axis = row ? 'w' : 'h';
    let lo = hostMinSize(sp.a, axis), hi = size - hostMinSize(sp.b, axis);
    if (lo > hi) { lo = hi = size * lo / (lo + (size - hi)); }   // 収まらないときは最小寸法の比で分ける
    sp.ratio = Math.max(lo, Math.min(hi, pos)) / size;
    hostLayoutPanes();
  });
  let end = function () {
    if (!dragging) { return; }
    dragging = false; d.classList.remove('drag');
    hostPanes.forEach(hostSendConfig);   // 辺の重なり方が変わると、境界グラデーションの相手も変わる
  };
  d.addEventListener('pointerup', end);
  d.addEventListener('pointercancel', end);
  d.addEventListener('dblclick', function () {
    sp.ratio = 0.5;
    hostLayoutPanes();
    hostPanes.forEach(hostSendConfig);
  });
}

// 分割数・共通設定を全ペインへ配り直す（追加・削除・設定変更のたびに呼ぶ）
// 全枠の描画の方式をそろえる。低い枠には一度だけ準備し直させ、それでも低ければ全枠をその方式にそろえる
function hostUpdateKinds() {
  let ks = hostPanes.map(function (q) { return q.kind; }).filter(function (k) { return !!k; });
  if (!ks.length) { return; }
  let best = ks.reduce(function (a, b) { return KIND_RANK[a] >= KIND_RANK[b] ? a : b; });
  let low = ks.reduce(function (a, b) { return KIND_RANK[a] <= KIND_RANK[b] ? a : b; });
  if (low !== best) {
    hostPanes.forEach(function (q) {
      if (q.kind && KIND_RANK[q.kind] < KIND_RANK[best] && !q.retried) {
        q.retried = true;
        try { q.frame.contentWindow.postMessage({ type: 'retryRenderer' }, '*'); } catch (err) {}
      }
    });
  }
  hostAllowedKind = low;
  hostPanes.forEach(function (q) { try { q.frame.contentWindow.postMessage({ type: 'allowKind', kind: low }, '*'); } catch (err) {} });
  if (hostGainRow) { hostGainRow.style.display = low === 'HDR' ? 'flex' : 'none'; }
  setDispKind(low, low !== best ? '。一部の枠で ' + best + ' を使えなかったため、境界がそろうよう全部の枠を ' + low + ' にそろえています' : '');
}
let hostAllowedKind = 'HDR';
let hostGain = 1.6, hostGainSlider = null, hostGainRow = null, hostLumaMode = 'none', hostLumaBtns = {}, hostRestoreBtn = null, hostCommitBtn = null, hostGCheck = false, hostGCheckBtn = null, globalPop = null, globalBtn = null;

function hostSyncPanes() {
  hostRebuildDividers();
  hostLayoutPanes();
  let multi = hostPanes.length > 1;
  document.body.classList.toggle('multi', multi);
  if (hostPanes.indexOf(hostActive) < 0) { hostSetActive(hostPanes[hostPanes.length - 1]); }
  hostLayoutPanes();   // multi の切り替わりでバーの幅が変わるので測り直す
  hostPanes.forEach(hostSendConfig);
}
function hostSendConfig(q) {
  let multi = hostPanes.length > 1;
  try {
    let w = q.frame.contentWindow;
    w.postMessage({ type: 'shared', on: true, mode: mode, top: q.top }, '*');
    w.postMessage({ type: 'allowKind', kind: hostAllowedKind }, '*');
    if (multi) { w.postMessage({ type: 'gain', value: hostGain }, '*'); }
    w.postMessage(hostGCheckMsg(q), '*');
    hostSendActive(q);
    w.postMessage({ type: 'blend', on: multi && blendOn, width: blendWidth,
      segs: {
        L: q.nb.L.map(function (m) { return [m.a0, m.a1]; }), R: q.nb.R.map(function (m) { return [m.a0, m.a1]; }),
        T: q.nb.T.map(function (m) { return [m.a0, m.a1]; }), B: q.nb.B.map(function (m) { return [m.a0, m.a1]; })
      },
      corners: { TL: !!q.diag.TL, TR: !!q.diag.TR, BL: !!q.diag.BL, BR: !!q.diag.BR },
      tj: q.tj }, '*');
  } catch (err) {}
}

// 読み込みが済んだ枠へ、隣と対角の枠の最新の設定を渡す。
// 分割した直後に隣が送った設定は、新しい枠がまだ読み込み中で届かないため（隣は設定が変わるまで送り直さない）
function hostSendNeighborSpecs(q) {
  let w = q.frame.contentWindow;
  EDGE_SIDES.forEach(function (k) {
    (q.nb[k] || []).forEach(function (m, i) {
      if (m.pane && m.pane.spec) { try { w.postMessage({ type: 'nb', side: k, idx: i, spec: m.pane.spec }, '*'); } catch (err) {} }
    });
  });
  EDGE_CORNERS.forEach(function (c) {
    let o = q.diag && q.diag[c];
    if (o && o.spec) { try { w.postMessage({ type: 'nbd', corner: c, spec: o.spec }, '*'); } catch (err) {} }
  });
}

function hostBroadcast(msg) {
  hostPanes.forEach(function (q) { try { q.frame.contentWindow.postMessage(msg, '*'); } catch (err) {} });
}

function onHostMessage(ev) {
  let d = ev.data;
  if (!d || !hostPanes.some(function (q) { return q.frame.contentWindow === ev.source; })) { return; }
  if (d.type === 'spec') {
    // タイムラインの設定を、辺を共有する隣へ中継する（相手から見た側の名前と、その辺での並び順で送る）
    let me = hostPanes.filter(function (q) { return q.frame.contentWindow === ev.source; })[0];
    if (me) {
      me.spec = d.spec;   // 後から読み込まれる枠へ渡せるよう、最新の設定を覚えておく
      if (hostGCheck) { hostSendGCheck(); }
      [['L', 'R'], ['R', 'L'], ['T', 'B'], ['B', 'T']].forEach(function (pr) {
        me.nb[pr[0]].forEach(function (m) {
          let o = m.pane, idx = -1;
          o.nb[pr[1]].forEach(function (r, i) { if (r.pane === me) { idx = i; } });
          if (idx >= 0) { try { o.frame.contentWindow.postMessage({ type: 'nb', side: pr[1], idx: idx, spec: d.spec }, '*'); } catch (err) {} }
        });
      });
      // 4枠が集まる角の対角の枠へも送る
      hostPanes.forEach(function (q) {
        EDGE_CORNERS.forEach(function (c) {
          if (q.diag && q.diag[c] === me) { try { q.frame.contentWindow.postMessage({ type: 'nbd', corner: c, spec: d.spec }, '*'); } catch (err) {} }
        });
      });
    }
    return;
  }
  if (d.type === 'ready') {
    let me = hostPanes.filter(function (q) { return q.frame.contentWindow === ev.source; })[0];
    if (me) { hostSendConfig(me); hostSendNeighborSpecs(me); }
    ev.source.postMessage({ type: 'wake', state: wakeState }, '*');
    if (playMode) { ev.source.postMessage({ type: 'setPlay', on: true }, '*'); }
  } else if (d.type === 'state') {
    if (hostStateWaiters[d.id]) { hostStateWaiters[d.id](d.state); }
  } else if (d.type === 'play') {
    hostSetPlay(!!d.on, !!d.asked);
  } else if (d.type === 'picker') {
    let me = hostPanes.filter(function (q) { return q.frame.contentWindow === ev.source; })[0];
    if (me) { me.div.classList.toggle('picking', !!d.on); }
  } else if (d.type === 'hover') {
    hostSetActive(hostPanes.filter(function (q) { return q.frame.contentWindow === ev.source; })[0]);
  } else if (d.type === 'kind') {
    let me = hostPanes.filter(function (q) { return q.frame.contentWindow === ev.source; })[0];
    if (me) { me.kind = d.kind; hostUpdateKinds(); }
  } else if (d.type === 'gesture') {

  }
}

// on=true：全ペインのUIを消してフルスクリーンへ／false：戻す。fsDone は「フルスクリーンの切替は済み（または不要）」
function hostSetPlay(on, fsDone) {
  playMode = on;
  document.body.classList.toggle('playing', on);
  if (on) { maybeShowWakeNotice(); } else { hideWakeNotice(); }
  hostBroadcast({ type: 'setPlay', on: on });
  try {
    if (on && !fsDone && !hostFsElement()) {
      let el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn) { let pr = fn.call(el); if (pr && pr.catch) { pr.catch(function () {}); } }
    } else if (!on && hostFsElement()) {
      let fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (fn) { let pr = fn.call(document); if (pr && pr.catch) { pr.catch(function () {}); } }
    }

}

/* ---------------- 画面スリープ防止（Screen Wake Lock） ----------------
   画面が光源なので、表示中は常にスリープを止める。
   ・ロックはタブが隠れるとOSに解放される → 再表示のたびに取り直す
   ・読み込み直後の要求が拒否される環境がある → 最初の操作（ユーザー操作）で取り直す
   ・API非対応／拒否のときは、端末側の自動ロックを切るよう案内する */
function initWakeLock() {
  if (IS_PANE) {
    // ロックは親ページが持つ。子は「操作があった」ことだけ伝える（保持中は送らない）
    let ping = function () { if (wakeState !== 'on') { toHost({ type: 'gesture' }); } };
    document.addEventListener('pointerdown', ping, true);
    document.addEventListener('keydown', ping, true);
    return;
  }
  wakeNotice = document.createElement('div');
  wakeNotice.id = 'wakeNotice';
  wakeNotice.setAttribute('role', 'status');
  wakeNotice.innerHTML = '<span class="bang" aria-hidden="true">!</span>' +
    '<span class="txt">この環境では、画面のスリープを自動で防げません。端末の自動ロック（画面オフ）を「なし」にしてください（手順は i）</span>' +
    '<button class="x" type="button" aria-label="閉じる" title="閉じる">×</button>';
  // 通知の上の操作は、フルスクリーンの解除（画面のタップ）にしない
  wakeNotice.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); });
  wakeNotice.querySelector('.x').addEventListener('click', function (ev) { ev.stopPropagation(); hideWakeNotice(); });
  document.body.appendChild(wakeNotice);

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { requestWakeLock(false); }
  });
  // ユーザー操作を起点にした取り直し（保持中は何もしない）
  document.addEventListener('pointerdown', function () { requestWakeLock(true); }, true);
  document.addEventListener('keydown', function () { requestWakeLock(true); }, true);
  requestWakeLock(false);
}

function requestWakeLock(fromGesture) {
  if (!('wakeLock' in navigator)) { setWakeState('unsupported'); showWakeNotice(); return; }
  if (wakeLock || wakeRequesting || document.visibilityState !== 'visible') { return; }
  wakeRequesting = true;
  navigator.wakeLock.request('screen').then(function (sentinel) {
    wakeRequesting = false;
    wakeLock = sentinel;
    setWakeState('on');
    hideWakeNotice();
    sentinel.addEventListener('release', function () {
      wakeLock = null;
      // 表示中なのに解放された（省電力モードなど）。次の操作で取り直す
      setWakeState(document.visibilityState === 'visible' ? 'failed' : 'pending');
    });
  }).catch(function () {
    wakeRequesting = false;
    // 操作なしの要求が拒否されただけなら、最初の操作での取り直しを待つ
    setWakeState(fromGesture ? 'failed' : 'pending');
    if (fromGesture) { showWakeNotice(); }
  });
}

function setWakeState(s) {
  wakeState = s;
  if (IS_HOST) { hostBroadcast({ type: 'wake', state: s }); }
  let el = document.getElementById('wakeStatus');
  if (!el) { return; }
  let ok = (s === 'on');
  el.classList.toggle('warn', !ok && s !== 'pending');
  el.textContent =
    ok ? '現在の状態：有効（このページを表示しているあいだ、画面は消えません）' :
    s === 'unsupported' ? '現在の状態：この環境では使えません。下の手順で端末の自動ロックを切ってください' :
    s === 'failed' ? '現在の状態：無効（省電力モードなどで拒否されました）。下の手順で端末の自動ロックを切ってください' :
    '現在の状態：確認中（画面を一度タップすると有効になります）';
}

// 防げないと分かった時点では出さず、フルスクリーンにしたときに下端へ小さく出す（5秒で消える）
let wakeNoticeTimer = null;
// 防げないと分かったのがフルスクリーンの最中（フルスクリーンにした操作で確かめた場合など）なら、そのとき出す
function showWakeNotice() { if (playMode) { maybeShowWakeNotice(); } }

  clearTimeout(wakeNoticeTimer);
  wakeNoticeTimer = setTimeout(hideWakeNotice, 5000);
}
function hideWakeNotice() {
  clearTimeout(wakeNoticeTimer); wakeNoticeTimer = null;
  if (wakeNotice) { wakeNotice.classList.remove('open'); }
}

/* ---------------- PWA（オフライン起動用のサービスワーカー） ---------------- */
function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) { return; }

  navigator.serviceWorker.register('sw.js').catch(function () { /* 登録できなくても本体は動く */ });

/* ---------------- UI ---------------- */
function setDur(v) {
  if (isNaN(v)) { return; }

  let p = getPhase();

  setPhase(p);

// target を渡すと、その明度にそろえる（親が全部の枠の色点から決めたとき）
function equalizeLuma(kind, target) {
  if (!lumaSnapshot) {
    lumaSnapshot = points.map(function (p) { return { r: p.r, g: p.g, b: p.b }; });
  }
  let Ls = [];
  for (let i = 0; i < points.length; i++) {
    let o = rgb2oklch(points[i].r, points[i].g, points[i].b);
    Ls.push(o[0]);
  }
  if (kind === 'maxc') {
    // 各色点：色相Hはそのまま、彩度Cだけを色域上限へ。明度Lは変えない。
    // 黒・白・グレー系（彩度がごく小さい無彩色）は彩度0のまま触らない。
    for (let i = 0; i < points.length; i++) {
      let o = rgb2oklch(points[i].r, points[i].g, points[i].b);
      if (o[1] < 0.004) { continue; }   // 無彩色はスキップ
      let maxC = maxChromaAt(o[0], o[2]);
      let rgb = oklch2rgb(o[0], maxC, o[2]);
      points[i].r = rgb[0]; points[i].g = rgb[1]; points[i].b = rgb[2];
    }
    updateLumaButtons();
    return;
  }
  if (isFinite(target)) { /* 渡された明度を使う */ }
  else if (kind === 'min') {
    target = Ls[0];
    for (let i = 1; i < Ls.length; i++) { if (Ls[i] < target) { target = Ls[i]; } }
  } else {
    let sum = 0;
    for (let i = 0; i < Ls.length; i++) { sum += Ls[i]; }
    target = sum / Ls.length;
  }
  for (let i = 0; i < points.length; i++) {
    let o = rgb2oklch(points[i].r, points[i].g, points[i].b);
    let rgb = fitToGamut(target, o[1], o[2]);
    points[i].r = rgb[0]; points[i].g = rgb[1]; points[i].b = rgb[2];
  }
  updateLumaButtons();
}

function fitToGamut(L, C, H) {
  if (inGamut(L, C, H)) { return oklch2rgb(L, C, H); }
  let lo = 0, hi = C;
  for (let k = 0; k < 24; k++) {
    let mid = (lo + hi) / 2;
    if (inGamut(L, mid, H)) { lo = mid; } else { hi = mid; }
  }
  return oklch2rgb(L, lo, H);
}
// L・Hを保ったまま、その色相で色域内に収まる最大のCを探す（彩度最大化）
function maxChromaAt(L, H) {
  let lo = 0, hi = 0.5;
  // まず域外に出る上限hiを見つける（既にCmaxが小さい色相にも対応）
  while (inGamut(L, hi, H) && hi < 2.0) { hi *= 1.5; }
  for (let k = 0; k < 28; k++) {
    let mid = (lo + hi) / 2;
    if (inGamut(L, mid, H)) { lo = mid; } else { hi = mid; }
  }
  return lo;
}
function inGamut(L, C, H) {
  let a = C * cos(H * PI / 180), b = C * sin(H * PI / 180);
  let l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  let m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  let s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  let l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  let R = 4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
  let G = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
  let B = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
  let eps = 0.0005;
  return R >= -eps && R <= 1 + eps && G >= -eps && G <= 1 + eps && B >= -eps && B <= 1 + eps;
}

// 明度統一の結果を、そのまま色点の色として確定する（元の色を上書き）。以後のボタンはこの色から計算する
function commitLuma() {
  lumaSnapshot = null; lumaMode = 'none';
  setLumaSegActive(); updateLumaButtons();
}

function restoreLuma() {
  if (!lumaSnapshot) { return; }
  for (let i = 0; i < points.length && i < lumaSnapshot.length; i++) {
    points[i].r = lumaSnapshot[i].r;
    points[i].g = lumaSnapshot[i].g;
    points[i].b = lumaSnapshot[i].b;
  }
  lumaSnapshot = null;
  updateLumaButtons();
}

function updateLumaButtons() {
  if (!restoreBtn) { return; }
  restoreBtn.style.display = lumaSnapshot ? 'inline-block' : 'none';
  if (commitBtn) { commitBtn.style.display = lumaSnapshot ? 'inline-block' : 'none'; }
}
let commitBtn = null;

// グレー基準面とxy図の共有レイアウト：両方表示なら円内を上下に等分
function grayLayout() {
  let both = showXY && !playMode;
  let s = both ? R * 0.5 : R * 0.7;
  let gy = both ? cy - R * 0.34 : cy;
  return [s, gy];
}

function drawLumaCheck() {
  let g = grayForMode();
  let gl = grayLayout();
  let s = gl[0], gy = gl[1];
  // HDRレンダラのときは矩形をWebGPU側で描くので、ここでは文字だけ
  if (!renderer || renderer.kind !== 'HDR') {
    ctx.fillStyle = rgba(g[0], g[1], g[2]);
    ctx.fillRect(cx - s / 2, gy - s / 2, s, s);
  }
  // 説明の文字は四角の下に、四角の幅を超えない大きさで（分割中は小さくなりすぎるので出さない）
  if (!playMode && !paneMulti) {
    let fam = 'px system-ui, -apple-system, "Hiragino Sans", sans-serif';
    ctx.font = '12' + fam;
    // 1行で幅に収めた大きさ。小さくなりすぎるときは「（」の前で2行に分ける
    let lines = [grayLabel];
    let fit = function (ls) { return Math.min(12, 12 * s / Math.max(1, Math.max.apply(null, ls.map(function (t) { return ctx.measureText(t).width; })))); };
    let fz = fit(lines), k = grayLabel.indexOf('（');
    if (fz < 9 && k > 0) {
      let two = [grayLabel.slice(0, k), grayLabel.slice(k)];
      if (fit(two) > fz) { lines = two; fz = fit(two); }
    }
    if (fz >= 6) {
      ctx.font = fz.toFixed(1) + fam;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      let ty = gy + s / 2 + Math.max(4, fz * 0.6);
      lines.forEach(function (t, i) {
        let y = ty + i * fz * 1.3;
        ctx.fillStyle = rgba(0, 0, 0, 130); ctx.fillText(t, cx + 1, y + 1);
        ctx.fillStyle = rgba(255, 255, 255, 210); ctx.fillText(t, cx, y);
      });
    }
  }
}

let grayLabel = '';
// 現在の補間方式の「明度」定義に沿った平均から無彩色グレーを返す
function grayForMode(pts) {
  let P = pts || points;   // 親が全部の枠の色点で計算するときは pts を渡す
  let n = P.length;
  if (!n) { return [0, 0, 0]; }
  if (mode === 'hsb') {
    // HSBのB（明度値）平均。無彩色なのでR=G=B=V*255
    let sum = 0;
    for (let i = 0; i < n; i++) { sum += rgb2hsv(P[i].r, P[i].g, P[i].b)[2]; }
    let v = sum / n;
    grayLabel = 'HSB基準グレー（平均B=' + (v * 100).toFixed(1) + '%）';
    let c = v * 255;
    return [c, c, c];
  }
  if (mode === 'rgbLight') {
    // 線形光の相対輝度の平均 → 線形グレー → sRGB化
    let sum = 0;
    for (let i = 0; i < n; i++) {
      let Y = 0.2126 * s2l(P[i].r/255) + 0.7152 * s2l(P[i].g/255) + 0.0722 * s2l(P[i].b/255);
      sum += Y;
    }
    let Y = sum / n;
    grayLabel = '光量基準グレー（平均輝度Y=' + Y.toFixed(3) + '）';
    let c = l2s(Y) * 255;
    return [c, c, c];
  }
  if (mode === 'rgbValue') {
    // sRGB画素値そのままの平均（R,G,Bの単純平均を明度とみなす）
    let sum = 0;
    for (let i = 0; i < n; i++) { sum += (P[i].r + P[i].g + P[i].b) / 3; }
    let c = sum / n;
    grayLabel = '画素値基準グレー（平均=' + Math.round(c) + '/255）';
    return [c, c, c];
  }
  if (mode === 'cielch' || mode === 'cielabLin') {
    let sum = 0;
    for (let i = 0; i < n; i++) { sum += rgb2lab(P[i].r, P[i].g, P[i].b)[0]; }
    let L = sum / n;
    grayLabel = 'CIELab基準グレー（平均L*=' + L.toFixed(1) + '）';
    return lab2rgb(L, 0, 0);
  }
  // oklch / step：OKLab-L 平均
  let sum = 0;
  for (let i = 0; i < n; i++) { sum += rgb2oklch(P[i].r, P[i].g, P[i].b)[0]; }
  let L = sum / n;
  grayLabel = 'OKLab基準グレー（平均L=' + L.toFixed(3) + '）';
  return oklch2rgb(L, 0, 0);
}

/* ---- CIE xy 色度図 ---- */
const XY_LOCUS = [
  [0.1741,0.0050],[0.1738,0.0049],[0.1733,0.0048],[0.1726,0.0048],[0.1714,0.0051],
  [0.1689,0.0069],[0.1644,0.0109],[0.1566,0.0177],[0.1440,0.0297],[0.1241,0.0578],
  [0.0913,0.1327],[0.0454,0.2950],[0.0082,0.5384],[0.0139,0.7502],[0.0743,0.8338],
  [0.1547,0.8059],[0.2296,0.7543],[0.3016,0.6923],[0.3731,0.6245],[0.4441,0.5547],
  [0.5125,0.4866],[0.5752,0.4242],[0.6270,0.3725],[0.6658,0.3340],[0.6915,0.3083],
  [0.7079,0.2920],[0.7190,0.2809],[0.7260,0.2740],[0.7300,0.2700],[0.7320,0.2680],
  [0.7334,0.2666],[0.7344,0.2656],[0.7347,0.2653]
];

// 背景が P3 の描画のときは、色点の値を P3 の座標として扱う（背景・リングと同じ）。それ以外は sRGB
function xyIsP3() { return !!(renderer && renderer.kind === 'P3広色域'); }
function xyzOfPoint(r, g, b) {
  if (!xyIsP3()) { return rgb2xyz(r, g, b); }
  let R = s2l(r / 255), G = s2l(g / 255), B = s2l(b / 255);
  return [(0.4865709 * R + 0.2656677 * G + 0.1982173 * B) * 100,
          (0.2289746 * R + 0.6917385 * G + 0.0792869 * B) * 100,
          (0.0451134 * G + 1.0439444 * B) * 100];
}
// XYZ（Y=1 基準）→ 線形の RGB（sRGB か P3）
function xyzToLin(X, Y, Z, p3) {
  if (p3) {
    return [2.4934969 * X - 0.9313836 * Y - 0.4027108 * Z,
            -0.8294890 * X + 1.7626641 * Y + 0.0236247 * Z,
            0.0358458 * X - 0.0761724 * Y + 0.9568845 * Z];
  }
  return [3.2404542 * X - 1.5371385 * Y - 0.4985314 * Z,
          -0.9692660 * X + 1.8760108 * Y + 0.0415560 * Z,
          0.0556434 * X - 0.2040259 * Y + 1.0572252 * Z];
}
function xyFromRgb(r, g, b) {
  let xyz = xyzOfPoint(r, g, b);
  let s = xyz[0] + xyz[1] + xyz[2];
  if (s < 1e-6) { return [0.3127, 0.3290]; }  // 黒は色度が定義できないのでD65へ
  return [xyz[0] / s, xyz[1] / s];
}

function insideLocus(x, y) {
  let n = XY_LOCUS.length, inside = false;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    let xi = XY_LOCUS[i][0], yi = XY_LOCUS[i][1];
    let xj = XY_LOCUS[j][0], yj = XY_LOCUS[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) { inside = !inside; }
  }
  return inside;
}

function xyPixX(x, dx, dw) { return dx + x / 0.8 * dw; }
function xyPixY(y, dy, dh) { return dy + dh - y / 0.9 * dh; }

// 馬蹄形の色（線形→sRGB）を塗った下地を、別のキャンバスに1回だけ描いておく（大きさが変わったら描き直す）
function buildXYBuffer(dw, dh) {
  let g = document.createElement('canvas');
  let p3 = xyIsP3();
  g.width = dw; g.height = dh;
  let gc = null;
  try { gc = g.getContext('2d', p3 ? { colorSpace: 'display-p3' } : undefined); } catch (e) { gc = null; }
  if (!gc) { gc = g.getContext('2d'); p3 = false; }
  let img;
  try { img = p3 ? gc.createImageData(dw, dh, { colorSpace: 'display-p3' }) : gc.createImageData(dw, dh); } catch (e) { img = gc.createImageData(dw, dh); }
  let px4 = img.data;   // 背景は透明のまま（馬蹄形の外は描かない）
  for (let py = 0; py < dh; py++) {
    for (let px = 0; px < dw; px++) {
      let x = px / dw * 0.8, y = (dh - py) / dh * 0.9;
      if (y <= 0.002) { continue; }
      if (!insideLocus(x, y)) { continue; }
      let X = x / y, Z = (1 - x - y) / y;
      let lin = xyzToLin(X, 1, Z, p3), R = lin[0], G = lin[1], B = lin[2];
      let mx = Math.max(R, G, B);
      if (mx <= 0) { continue; }
      R = Math.max(R / mx, 0); G = Math.max(G / mx, 0); B = Math.max(B / mx, 0);
      let idx = (py * dw + px) * 4;
      px4[idx] = l2s(R) * 255; px4[idx + 1] = l2s(G) * 255; px4[idx + 2] = l2s(B) * 255; px4[idx + 3] = 255;
    }
  }
  gc.putImageData(img, 0, 0);
  // 馬蹄形の輪郭（どんな背景色の上でも読めるよう黒＋白の二重線）
  let loc = XY_LOCUS.map(function (q) { return [xyPixX(q[0], 0, dw), xyPixY(q[1], 0, dh)]; });
  let keep = ctx; ctx = gc;   // 線の道具（polyline・seg）をこの下地に使う
  polyline(loc, 'rgba(0,0,0,0.51)', 2.5);
  polyline(loc, 'rgba(255,255,255,0.59)', 1);
  // 色域の三角形（sRGB か P3）とD65白色点
  let tr = p3 ? [[0.680, 0.320], [0.265, 0.690], [0.150, 0.060]] : [[0.64, 0.33], [0.30, 0.60], [0.15, 0.06]];
  polyline(tr.map(function (q) { return [xyPixX(q[0], 0, dw), xyPixY(q[1], 0, dh)]; }), 'rgba(255,255,255,0.67)', 1.2);
  let wx = xyPixX(0.3127, 0, dw), wy = xyPixY(0.3290, 0, dh);
  seg(wx - 4, wy, wx + 4, wy, '#fff', 1.2); seg(wx, wy - 4, wx, wy + 4, '#fff', 1.2);
  ctx = keep;
  return g;
}

// xy図の現在レイアウト（描画とドラッグ判定で共有）
function xyLayout() {
  let dw, dh, dx, dy;
  if (showLumaCheck) {
    dh = Math.round(R * 0.60);
    dw = Math.round(dh * 0.8 / 0.9);
    dx = cx - dw / 2;
    dy = Math.round(cy + R * 0.36 - dh / 2);
  } else {
    let Ru = R - 26;
    dw = Math.round(Math.min(Ru * 1.32, 340));
    dh = Math.round(dw * 0.9 / 0.8);
    dx = cx - dw / 2;
    dy = cy - Math.round(dh / 2);
  }
  return [dx, dy, dw, dh];
}

// xyY → linear sRGB（Y=輝度を保ったまま色度を動かすための変換）
function xyYtoRgbLin(x, y, Y) {
  if (y < 1e-4) { y = 1e-4; }
  let X = x / y * Y, Z = (1 - x - y) / y * Y;
  return xyzToLin(X, Y, Z, xyIsP3());
}
function inGamutLin(c) {
  let e = 0.0005;
  return c[0] >= -e && c[0] <= 1 + e && c[1] >= -e && c[1] <= 1 + e && c[2] >= -e && c[2] <= 1 + e;
}
// 輝度Yを保ったまま、色域外ならD65方向へ寄せて収める
function xyYfit(x, y, Y) {
  const wx = 0.3127, wy = 0.3290;
  let t = 1.0;
  if (!inGamutLin(xyYtoRgbLin(x, y, Y))) {
    let lo = 0, hi = 1;
    for (let k = 0; k < 24; k++) {
      let m = (lo + hi) / 2;
      if (inGamutLin(xyYtoRgbLin(wx + (x - wx) * m, wy + (y - wy) * m, Y))) { lo = m; } else { hi = m; }
    }
    t = lo;
  }
  let lin = xyYtoRgbLin(wx + (x - wx) * t, wy + (y - wy) * t, Y);
  return [l2s(Math.max(lin[0], 0)) * 255, l2s(Math.max(lin[1], 0)) * 255, l2s(Math.max(lin[2], 0)) * 255];
}

function drawXYDiagram(sorted, cur) {
  let ly0 = xyLayout();
  let dx = ly0[0], dy = ly0[1], dw = ly0[2], dh = ly0[3];
  let key = dw + 'x' + dh + (xyIsP3() ? 'p3' : '');
  if (!xyBuf || xyBufKey !== key) { xyBuf = buildXYBuffer(dw, dh); xyBufKey = key; }
  ctx.drawImage(xyBuf, dx, dy);
  // ループ一周分の軌跡（補間方式の幾何学がここに出る）
  let path = [];
  for (let k = 0; k <= 120; k++) {
    let c = sampleAt(k / 120 * TWO_PI + 0.0001, sorted);
    let xy = xyFromRgb(c[0], c[1], c[2]);
    path.push([xyPixX(xy[0], dx, dw), xyPixY(xy[1], dy, dh)]);
  }
  polyline(path, rgba(255, 255, 255, 170), 1.5);
  // 色点
  for (let i = 0; i < points.length; i++) {
    let p = points[i];
    let xy = xyFromRgb(p.r, p.g, p.b);
    let X = xyPixX(xy[0], dx, dw), Y = xyPixY(xy[1], dy, dh);
    let interactive = showXY && !showLumaCheck;
    let msz = (interactive && (i === dragXYIdx || dist(mouseX, mouseY, X, Y) < Math.max(15, hitR * 0.6))) ? 16 : 11;
    ringLine(X, Y, msz, rgba(0, 0, 0, 160), 4);
    if (ringGpu) {
      // HDR：色は WebGPU で（リングの色点と同じ）。2D はその場所を透かす
      ctx.globalCompositeOperation = 'destination-out';
      disc(X, Y, msz, '#000');
      ctx.globalCompositeOperation = 'source-over';
      if (ringGpu.pts.length < RING_MAXP) {
        let e = hdrEnc(p.r, p.g, p.b);
        ringGpu.pts.push([X * dpr, Y * dpr, msz / 2 * dpr, 1, e[0], e[1], e[2]]);
      }
    } else {
      disc(X, Y, msz, ptCol(p.r, p.g, p.b));
    }
    ringLine(X, Y, msz, '#fff', 1.5);
  }
  // 現在再生中の色（動く白リング）
  let xy = xyFromRgb(cur[0], cur[1], cur[2]);
  let X = xyPixX(xy[0], dx, dw), Y = xyPixY(xy[1], dy, dh);
  ringLine(X, Y, 17, rgba(0, 0, 0, 180), 5);
  ringLine(X, Y, 17, '#fff', 2.5);
  drawOutlinedText('CIE xy 色度図', dx + dw / 2, dy + dh + 12, 12, 230);
}

function applyResponsive() {
  if (playMode) { return; }
  isNarrow = window.innerWidth <= 820;
  if (isNarrow) { document.body.classList.add('narrowLayout'); }
  else { document.body.classList.remove('narrowLayout'); }
  // 分割中の細い枠は簡略表示に、ごく小さい枠はさらに簡略にする
  document.body.classList.toggle('compact', isCompact());
  document.body.classList.toggle('mini', isMini());
  syncSheet();
  placeBars();
}

function addLumaSeg(label, m, parentEl) {
  lumaSegBtns[m] = el('button', { text: label, parent: parentEl, on: { click: function (ev) { ev.currentTarget.blur(); setLumaMode(m); } } });
}
function setLumaSegActive() {
  for (let k in lumaSegBtns) { lumaSegBtns[k].classList.toggle('active', k === lumaMode); }
}
function setLumaMode(m) {
  if (m === lumaMode) { return; }
  if (lumaSnapshot) { restoreLuma(); }        // 常に元の色を基準に適用し直す
  if (m === 'min' || m === 'avg' || m === 'maxc') { equalizeLuma(m); }
  lumaMode = m;
  setLumaSegActive();
}

    on: { click: function (ev) { ev.currentTarget.blur(); commitLuma(); } } });
  el('button', { text: '彩度最大', parent: colorBar, on: { click: function (ev) { ev.currentTarget.blur(); equalizeLuma('maxc'); } } });

  // 段の出し入れ（戻る・HDR輝度の表示など）でパネルの高さが変わったら、リングの大きさを測り直す
  if (window.ResizeObserver) {
    let lastH = 0;
    new ResizeObserver(function () {
      let h = panelEl.offsetHeight;
      if (h !== lastH && !playMode) { lastH = h; layout(); }
    }).observe(panelEl);
  }

  buildModeUI(document.body, function (m) { mode = m; updateModeBtns(); });

  // ---- フルスクリーン（独立の固定ボタン） ----
  fsBtn = document.createElement('button');
  fsBtn.id = 'fsBtn';
  fsBtn.innerHTML = '<span style="font-size:18px">\u26f6</span> フルスクリーン';
  fsBtn.title = 'フルスクリーン';
  document.body.appendChild(fsBtn);
  fsBtn.addEventListener('click', function () { enterPlay(); });

  buildInfoUI(document.body);

  // ---- 簡略表示のときだけ出る「⋯」（観察トグルと色設定の出し入れ） ----
  moreBtn = document.createElement('button');
  moreBtn.id = 'moreBtn';
  moreBtn.textContent = '\u22ef';
  moreBtn.title = '観察・色の設定を開く／閉じる';
  moreBtn.setAttribute('aria-label', '観察・色の設定を開く／閉じる');
  document.body.appendChild(moreBtn);
  moreBtn.addEventListener('click', function () {
    document.body.classList.toggle('moreOpen');
    layout();   // パネルのぶんリングの大きさが変わる（ごく小さい枠ではシートを出し入れする）
  });

  // ---- ごく小さい枠：一時停止の丸ボタンと、設定のシート ----
  miniPause = document.createElement('button');
  miniPause.id = 'miniPause';
  miniPause.innerHTML = ICON_PAUSE;
  miniPause.title = '一時停止／再開'; miniPause.setAttribute('aria-label', '一時停止／再開');
  document.body.appendChild(miniPause);
  miniPause.addEventListener('click', function () { miniPause.blur(); togglePause(); });
  sheetEl = document.createElement('div');
  sheetEl.id = 'sheet';
  document.body.appendChild(sheetEl);
  // シートの何もない所を押すと閉じる
  sheetEl.addEventListener('click', function (ev) {
    if (ev.target === sheetEl) { document.body.classList.remove('moreOpen'); layout(); }
  });

  // すべてのUIが揃ってから配置を確定する（生成前に呼ぶと位置が決まらない）
  applyResponsive();
  placeBars();
}
// 補間方式スイッチ＋選択モーダル。子ではサークル上、親では共通バーに置く
function buildModeUI(parentEl, onPick) {
  modeSwitch = document.createElement('button');
  modeSwitch.id = 'modeSwitch';
  modeSwitch.innerHTML = '<span id="modeSwitchLabel"></span><span class="caret">\u25bc</span>';
  parentEl.appendChild(modeSwitch);
  modeSwitch.addEventListener('click', function () { modeModal.classList.add('open'); });

  modeModal = document.createElement('div');
  modeModal.id = 'modeModal';
  let sheet = document.createElement('div');
  sheet.className = 'sheet';
  let h = document.createElement('h3');
  h.textContent = '補間方式';
  sheet.appendChild(h);
  modeModal.appendChild(sheet);
  document.body.appendChild(modeModal);
  // 背景クリックで閉じる（シート内クリックは閉じない）
  modeModal.addEventListener('click', function (ev) {
    if (ev.target === modeModal) { modeModal.classList.remove('open'); }
  });
  MODE_LIST.forEach(function (item) {
    let b = document.createElement('button');
    b.textContent = item[0];
    b.dataset.mode = item[1];
    b.addEventListener('click', function () {
      onPick(item[1]);
      modeModal.classList.remove('open');
    });
    sheet.appendChild(b);
    modalModeBtns[item[1]] = b;
  });
  updateModeBtns();
}

function buildInfoUI(parentEl) {
  // ---- インフォメーション（丸i） ----
  infoBtn = document.createElement('button');
  infoBtn.id = 'infoBtn';
  infoBtn.textContent = 'i';
  infoBtn.title = '使い方';
  parentEl.appendChild(infoBtn);

  infoPanel = document.createElement('div');
  infoPanel.id = 'infoPanel';
  infoPanel.innerHTML =
    '<div class="inner">' +
    '<h2>光のグラデーション・タイムライン</h2>' +
    '<p class="sub">色の点をサークル（時間の輪）に置き、色と色のあいだを光がどう渡るかを観察する装置です。</p>' +
    '<p class="wakeStatus" id="dispKind">表示：確認中</p>' +
    '<h3>基本操作</h3>' +
    '<ul>' +
    '<li><b>色点の表示</b> — マウスでは、カーソルを画面に入れると色点が現れ、サークルに近づけると白い輪が付きます。iPhone・iPad では常に表示（分割中は、最後に触れたタイムラインだけ）</li>' +
    '<li><b>色点をドラッグ</b> — タイミング（円周上の位置）を変える</li>' +
    '<li><b>色点を円の外へドラッグ</b> — 削除（最低2点は残ります）</li>' +
    '<li><b>色点をタップ（マウスはダブルクリック）</b> — 色選びで色を変更（面で彩度と明るさ、帯で色相）。iPhone・iPad では画面の下からせり出し、上の何もない所を押すと閉じます</li>' +
    '<li><b>リングの帯をタップ</b> — その位置に色点を追加</li>' +
    '<li><b>白い針（再生ヘッド）をドラッグ</b> — 再生位置を動かす</li>' +
    '<li><b>スペースキー／⏸ボタン</b> — 一時停止・再開　<b>1周◯秒</b> — 一周の速さ　<b>↻ボタン</b> — 回転の向きを逆にする（針の位置はそのまま）</li>' +
    '<li><b>フルスクリーン</b> — UIを消して色だけを全画面表示（クリックか Esc で戻る）</li>' +
    '<li><b>枠の四辺にある ＋</b> — その枠を二分して、押した側に複製を置く（左右にも上下にも、何度でも分けられます。ほかの枠の大きさは変わりません）。<b>左上の ×</b> でその枠を閉じる。<b>境界の白いつまみ</b>をドラッグすると比率を変えられます（ダブルクリックで半々に戻す）。分割中は、ポインタを置いた（タッチでは触れた）枠の ＋ と × だけが出ます</li>' +
    '<li><b>上端のバー</b> — 補間方式・フルスクリーン・このヘルプは全タイムライン共通です。<b>境界グラデーション</b>で、隣り合うタイムラインの境界を、選択中の補間方式でつなぎます（ステップ切替ではつなぎません）。1つの辺に複数のタイムラインが接するところは、区間ごとに相手を替えてつなぎます。中間混色の方式では、3つ・4つのタイムラインが集まる点も色をなめらかに混ぜます（色相回転の方式では、その点だけ色が切り替わります）。横のスライダーは幅（右端＝枠の中央まで）</li>' +
    '<li><b>全体の色</b>（分割中だけ）— HDR輝度と知覚明度統一（最低・平均・彩度最大・戻る・この色で確定）を、全部のタイムラインへまとめて適用します。明度の基準は全タイムラインの色点から決めます。分割中は各タイムラインのパネルの色の段を隠します。<b>輝度検証</b>は、全タイムラインの色点から決めたグレーの四角を画面の中央に出します（出ている間は、各タイムラインの輝度検証の四角より優先）</li>' +
    '<li><b>サークルの下のパネル</b> — 秒数・一時停止・回転の逆転、xy色度図・輝度検証、色の設定がまとまっています</li>' +
    '<li><b>⋯</b>（画面や枠が小さいとき）— xy色度図・輝度検証・色の設定を開閉。ごく小さい枠では、リングの下の <b>⏸</b> で一時停止、<b>⋯</b> で秒数・逆転も含めた設定を枠全体に開きます</li>' +
    '</ul>' +
    '<h3>パネル</h3>' +
    '<ul>' +
    '<li><b>輝度検証</b> — 中央に基準グレーを表示。グレーの明度は、選択中の方式が主張する「明度」の平均です</li>' +
    '<li><b>xy色度図</b> — 色点と現在色をCIE xy平面に写します。<b>xy図のみ表示のとき、図上の点をドラッグして色を直接編集</b>できます（明るさYは保たれます）</li>' +
    '<li><b>知覚明度(OKLab)で統一</b> — 全色点のOKLab明度を最低／平均に揃えます（「元に戻す」で復元）</li>' +
    '<li><b>HDR輝度</b>（HDR対応環境のみ）— SDRの白(1.0)を超える光の持ち上げ量</li>' +
    '</ul>' +
    '<h3>画面を消さないために</h3>' +
    '<p class="wakeStatus" id="wakeStatus">現在の状態：確認中</p>' +
    '<ul>' +
    '<li>このページは、表示しているあいだ<b>画面のスリープを自動で止めます</b>（Screen Wake Lock）。別のタブやアプリに切り替えると解除され、戻ると再び有効になります</li>' +
    '<li>「使えません／無効」と出る環境では、<b>端末側の自動ロックを切って</b>ください。iPhone・iPad：設定 → 画面表示と明るさ → 自動ロック → なし／Android：設定 → ディスプレイ → 画面消灯（スリープ）を最長に／Mac：システム設定 → ロック画面 → ディスプレイをオフにする → しない／Windows：設定 → システム → 電源 → 画面の電源を切る → なし</li>' +
    '<li>省電力（低電力）モードでは無効になることがあります。長時間の制作は<b>電源につないで</b>行ってください</li>' +
    '<li><b>ホーム画面に追加</b>（iPhone・iPad：共有 → ホーム画面に追加／Chrome・Edge：アドレスバーのインストール）すると、ブラウザの枠なしで起動でき、一度開いた後はオフラインでも動きます</li>' +
    '</ul>' +
    '<h3>色の変換についての注意</h3>' +
    '<ul>' +
    '<li>補間方式とは<b>「2色のあいだにどんな道を引くか」の選択</b>です。同じ色点でも、方式が違えば全く別の光になります</li>' +
    '<li>HSBの「明度(B)」は知覚的な明るさではありません。<b>B一定でも画面は明滅します</b>（色相環は等明度ではない）</li>' +
    '<li><b>RGB中間混色（画素値平均）</b>は符号値の平均であり、光の量の平均ではありません（中間が暗く濁ります）。<b>（光量平均）</b>はガンマを解き、物理的な光の量で平均します</li>' +
    '<li>補色どうしの中間混色は<b>無彩色（グレー）</b>に近づきます。xy色度図では、白色点の近くを通る直線として見えます</li>' +
    '<li>白・黒・グレーに<b>色相はありません</b>。無彩色を経由する補間では、相手側の色相を引き継ぎます</li>' +
    '<li><b>CIELab</b>は青の領域で色相が曲がる既知の癖があります。<b>OKLab</b>（2020）はその修正版です</li>' +
    '<li>「知覚明度(OKLab)で統一」はOKLabの物差しで揃えます。基準グレーは方式ごとの物差しなので、方式によっては一致しません——<b>「明度」の定義が違えば「揃った」の意味も違う</b>ということです</li>' +
    '<li>xy色度図は<b>明るさを捨てた座標</b>です。黒は色度が定義できないため、便宜上D65白色点の位置に表示しています</li>' +
    '</ul>' +
    '<h3>参考</h3>' +
    '<ul class="refs">' +
    '<li><a href="https://bottosson.github.io/posts/oklab/" target="_blank" rel="noopener">A perceptual color space for image processing</a> — Björn Ottosson（2020）。OKLab の原典</li>' +
    '<li><a href="https://raphlinus.github.io/color/2021/01/18/oklab-critique.html" target="_blank" rel="noopener">An interactive review of Oklab</a> — Raph Levien（2021）。CIELab で青の色相が紫へ曲がる癖と、OKLab での改善の比較</li>' +
    '<li><a href="https://ja.wikipedia.org/wiki/Lab%E8%89%B2%E7%A9%BA%E9%96%93" target="_blank" rel="noopener">Lab色空間（Wikipedia）</a> — CIELab（1976）の定義と L*・a*・b*</li>' +
    '<li><a href="https://www.w3.org/TR/css-color-4/#powerless" target="_blank" rel="noopener">CSS Color Module Level 4：Powerless color components</a> — W3C。無彩色の色相を「無力」とし、補間で相手の色相を引き継ぐ決まり</li>' +
    '<li><a href="https://en.wikipedia.org/wiki/Helmholtz%E2%80%93Kohlrausch_effect" target="_blank" rel="noopener">Helmholtz–Kohlrausch effect（Wikipedia 英語版）</a> — 輝度が同じでも、彩度の高い色ほど明るく見える効果</li>' +
    '</ul>' +
    '<p class="closeHint">画面のどこかをクリックすると閉じます（Escでも可）</p>' +
    '</div>';
  document.body.appendChild(infoPanel);

  infoBtn.addEventListener('click', function () { infoPanel.style.display = 'block'; });
  // どこかを押すと閉じる（参考のリンクを押したときは、リンクを開くだけで閉じない）
  infoPanel.addEventListener('click', function (ev) {
    if (ev.target.closest && ev.target.closest('a')) { return; }
    infoPanel.style.display = 'none';
  });
}

function updateModeBtns() {
  // モーダル内のボタンの選択状態
  for (let k in modalModeBtns) {
    if (k === mode) { modalModeBtns[k].classList.add('active'); }
    else { modalModeBtns[k].classList.remove('active'); }
  }
  // サークル上のスイッチに現在の方式名を表示
  let lab = document.getElementById('modeSwitchLabel');
  if (lab) {
    let name = '';
    for (let i = 0; i < MODE_LIST.length; i++) {
      if (MODE_LIST[i][1] === mode) { name = MODE_LIST[i][0]; }
    }
    lab.textContent = name;
  }
}

// すべての定義が済んでから起動する
setup();
</script>
